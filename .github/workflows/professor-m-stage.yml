name: Stage Professor M integration
on:
  push:
    branches: [professor-m-stage]
    paths: ['.github/workflows/professor-m-stage.yml']
permissions:
  contents: write
jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: professor-m-stage
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Add Professor M index and inspect arcana schema
        run: |
          node <<'NODE'
          const fs=require('fs');
          const p='data/saviors/index.json';
          const j=JSON.parse(fs.readFileSync(p,'utf8'));
          j['1039']={
            key:'professor-m',id:1039,file:'./1039.html',
            source:'https://ss.espr.gg/ko/database/characters/professor-m',
            capturedAt:new Date().toISOString(),
            profile:{name:'프로페서M',grade:'SSR',element:'달',className:'레인저',attackType:'정신',description:'심리학과 범죄학을 연구하고 있는 사립탐정. 소시오패스적 성향 탓에 공감능력이 결여되어 있으며, 인간을 탐구하고 분석해 이해하려고 한다.',birthday:'5월 5일',height:'170cm',origin:'불명',affiliation:'람파디스',cvKr:'전해리',cvJp:'후지와라 나츠미',illustration:'./data/savior-detail-assets/프로페서M 일러스트.webp',portrait:'./data/savior-detail-assets/프로페서M.webp'}
          };
          fs.writeFileSync(p,JSON.stringify(j,null,2)+'\n');
          const a=JSON.parse(fs.readFileSync('data/arcanas/arcanas.json','utf8'));
          const report={topType:Array.isArray(a)?'array':typeof a,topKeys:Array.isArray(a)?null:Object.keys(a),count:Array.isArray(a)?a.length:null,sample:Array.isArray(a)?a.slice(-2):Object.fromEntries(Object.entries(a).slice(0,2))};
          fs.writeFileSync('data/arcanas/schema-report.json',JSON.stringify(report,null,2)+'\n');
          NODE
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/saviors/index.json data/arcanas/schema-report.json
          git commit -m 'Stage Professor M index and arcana schema' || true
          git push origin HEAD:professor-m-stage
