name: Stage Professor M integration
on:
  push:
    branches: [professor-m-stage]
    paths: ['.github/workflows/professor-m-stage.yml']
permissions:
  contents: write
jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: professor-m-stage
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Inspect exact integration schemas
        run: |
          node <<'NODE'
          const fs=require('fs');
          const a=JSON.parse(fs.readFileSync('data/arcanas/arcanas.json','utf8'));
          const s=JSON.parse(fs.readFileSync('data/savior-skills/saviors.json','utf8'));
          const report={arcanaCount:a.arcanas?.length,arcanaSample:a.arcanas?.slice(-1)[0],journeyBuffSample:a.journeyBuffs?.slice(-3),skillTop:Array.isArray(s)?'array':Object.keys(s),skillSample:Array.isArray(s)?s.slice(-1)[0]:(s.saviors?.slice(-1)[0]||Object.values(s).find(v=>Array.isArray(v))?.slice(-1)[0])};
          fs.writeFileSync('data/integration-schema-report.json',JSON.stringify(report,null,2)+'\n');
          NODE
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/integration-schema-report.json
          git commit -m 'Inspect exact integration schemas' || true
          git push origin HEAD:professor-m-stage
