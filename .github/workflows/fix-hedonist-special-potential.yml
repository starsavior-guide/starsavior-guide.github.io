name: Fix Hedonist special potential
on:
  push:
    paths:
      - '.github/workflows/fix-hedonist-special-potential.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Arcana data and renderer
        run: |
          python3 <<'PY'
          from pathlib import Path
          import json

          # Standalone source
          p=Path('data/arcanas/7103901.json')
          arc=json.loads(p.read_text())
          arc['specialPotentialId']=32003
          for pot in arc.get('potentialDetails',[]):
              if int(pot.get('id',0))==32003:
                  for lv in pot.get('levels',[]):
                      # ESPR event-granted special potential: do not show a fake point cost.
                      lv['requiredPotentialPoints']=None
          p.write_text(json.dumps(arc,ensure_ascii=False,indent=2)+'\n')

          # Canonical archive: add specialPotentialId and register the detailed potential globally.
          cp=Path('data/arcanas/arcanas.json')
          root=json.loads(cp.read_text())
          arcanas=root if isinstance(root,list) else root.get('arcanas',[])
          target=None
          for a in arcanas:
              if int(a.get('id',0))==7103901:
                  target=a; break
          if target is None:
              raise SystemExit('Arcana 7103901 missing')
          target['specialPotentialId']=32003
          target['potentialDetails']=arc.get('potentialDetails',[])
          target['events']=arc.get('events',target.get('events',[]))
          if isinstance(root,dict):
              pots=root.setdefault('potentials',[])
              detail=next((x for x in arc.get('potentialDetails',[]) if int(x.get('id',0))==32003),None)
              if not detail: raise SystemExit('Potential 32003 missing')
              pots[:]=[x for x in pots if int(x.get('id',0))!=32003]
              pots.append(detail)
          cp.write_text(json.dumps(root,ensure_ascii=False,indent=2)+'\n')

          # Renderer fallback makes future newly imported Arcana work even before global potential merge.
          ap=Path('app.js')
          s=ap.read_text()
          old='const specialPotential = getArcanaPotential(arcana.specialPotentialId);'
          new='const specialPotential = getArcanaPotential(arcana.specialPotentialId) || (Array.isArray(arcana.potentialDetails) ? arcana.potentialDetails.find((potential) => Number(potential.id) === Number(arcana.specialPotentialId)) : null);'
          if old not in s: raise SystemExit('Arcana potential renderer anchor missing')
          s=s.replace(old,new,1)
          ap.write_text(s)
          PY
      - name: Validate
        run: |
          python3 -m json.tool data/arcanas/7103901.json >/dev/null
          python3 -m json.tool data/arcanas/arcanas.json >/dev/null
          grep -q 'specialPotentialId' data/arcanas/7103901.json
          grep -q 'arcana.potentialDetails.find' app.js
      - name: Commit and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.js data/arcanas/7103901.json data/arcanas/arcanas.json
          git rm .github/workflows/fix-hedonist-special-potential.yml
          git commit -m 'Fix Hedonist special potential rendering'
          git push
