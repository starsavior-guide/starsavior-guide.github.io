name: Apply guide card and home button fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-guide-home-fix-once.yml'

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply UI fixes
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const file = 'index.html';
          let html = fs.readFileSync(file, 'utf8');

          const oldHome = '<span class="brand-mark" aria-hidden="true"><img src="./images/home-button.png" alt=""></span>';
          const newHome = '<img class="brand-home-image" src="./images/home-button.png" alt="" aria-hidden="true">';
          if (!html.includes(oldHome) && !html.includes(newHome)) {
            throw new Error('Home button markup was not found.');
          }
          html = html.replace(oldHome, newHome);

          const marker = '</style>\n\n\n  <style id="journey-database-styles">';
          const css = `

    /* 2026-09-15: clearer beginner guide card + direct home image element */
    .brand-home-image {
      display: block;
      width: 38px;
      height: 38px;
      flex: 0 0 38px;
      object-fit: contain;
      object-position: center;
      border: 1px solid color-mix(in srgb, var(--accent) 32%, var(--line));
      border-radius: 10px;
      background: #fff;
      box-shadow: none;
    }

    .newbie-equipment-notice {
      width: min(100%, 760px) !important;
      margin-top: 20px !important;
      padding: 22px 24px !important;
      gap: 16px !important;
      border: 1px solid var(--line) !important;
      border-radius: 16px !important;
      background: var(--surface) !important;
      box-shadow: none !important;
    }

    .newbie-equipment-notice:hover {
      border-color: var(--line-strong) !important;
      background: var(--surface) !important;
    }

    .newbie-equipment-notice-icon {
      flex: 0 0 38px !important;
      width: 38px !important;
      height: 38px !important;
      border: 1px solid color-mix(in srgb, var(--accent) 48%, var(--line)) !important;
      background: color-mix(in srgb, var(--accent) 8%, var(--surface)) !important;
      color: var(--accent) !important;
      font-size: 18px !important;
    }

    .newbie-equipment-notice-copy {
      gap: 8px !important;
    }

    .newbie-equipment-notice-copy strong {
      color: var(--text) !important;
      font-size: 18px !important;
      font-weight: 950 !important;
      line-height: 1.35 !important;
    }

    .newbie-equipment-notice-copy > span:not(.newbie-equipment-notice-actions) {
      color: var(--text) !important;
      font-size: 14px !important;
      font-weight: 750 !important;
      line-height: 1.7 !important;
    }

    .newbie-equipment-notice-actions {
      gap: 8px 22px !important;
      margin-top: 5px !important;
    }

    .newbie-equipment-notice-action {
      color: color-mix(in srgb, var(--accent) 82%, var(--text)) !important;
      font-size: 13px !important;
      font-weight: 950 !important;
    }

    html[data-theme="light"] .newbie-equipment-notice {
      border-color: #d3dae5 !important;
      background: #fff !important;
    }

    html[data-theme="light"] .newbie-equipment-notice:hover {
      border-color: #bdc8d7 !important;
      background: #fff !important;
    }

    html[data-theme="light"] .newbie-equipment-notice-icon {
      border-color: #9ebbe9 !important;
      background: #f2f6fd !important;
      color: #477ee7 !important;
    }

    html[data-theme="light"] .newbie-equipment-notice-action {
      color: #3f6fbd !important;
    }

    @media (max-width: 640px) {
      .brand-home-image {
        width: 36px;
        height: 36px;
        flex-basis: 36px;
        border-radius: 9px;
      }

      .newbie-equipment-notice {
        padding: 18px 17px !important;
        gap: 13px !important;
      }

      .newbie-equipment-notice-icon {
        flex-basis: 34px !important;
        width: 34px !important;
        height: 34px !important;
      }

      .newbie-equipment-notice-copy strong {
        font-size: 17px !important;
      }

      .newbie-equipment-notice-copy > span:not(.newbie-equipment-notice-actions) {
        font-size: 13.5px !important;
        line-height: 1.65 !important;
      }
    }
`;

          if (!html.includes('2026-09-15: clearer beginner guide card + direct home image element')) {
            if (!html.includes(marker)) throw new Error('CSS insertion marker was not found.');
            html = html.replace(marker, css + '\n  </style>\n\n\n  <style id="journey-database-styles">');
          }

          fs.writeFileSync(file, html);
          NODE

      - name: Validate fix
        shell: bash
        run: |
          grep -q 'class="brand-home-image"' index.html
          grep -q 'clearer beginner guide card' index.html
          ! grep -q '<span class="brand-mark" aria-hidden="true"><img src="./images/home-button.png"' index.html

      - name: Commit fix and remove one-shot workflow
        shell: bash
        run: |
          rm -f .github/workflows/apply-guide-home-fix-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/workflows/apply-guide-home-fix-once.yml
          git commit -m 'Improve beginner guide card and home icon rendering'
          git push
