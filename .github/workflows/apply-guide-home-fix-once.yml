name: Apply guide card and home button fix

# corrected retry 2026-09-15
on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/apply-guide-home-fix-once.yml'

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Apply patch
        run: node scripts/patch-guide-home-once.js

      - name: Validate patch
        run: |
          grep -q 'class="brand-home-image"' index.html
          grep -q 'clearer beginner guide card' index.html

      - name: Commit result
        run: |
          rm -f scripts/patch-guide-home-once.js
          rm -f .github/workflows/apply-guide-home-fix-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html scripts/patch-guide-home-once.js .github/workflows/apply-guide-home-fix-once.yml
          git commit -m "Improve beginner guide card and home icon rendering"
          git push
