name: Update site representative image

on:
  push:
    paths:
      - '.tmp/update-site-representative-trigger.txt'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Update representative image metadata
        run: node .tmp/update-site-representative.mjs
      - name: Validate change
        run: git diff --check
      - name: Commit change
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo 'No changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Use chibi mascot as site representative image'
          git pull --rebase origin main
          git push origin HEAD:main
