            const categoryButtons = categories.map(([key, label], index) => `<button class="journey-chip${index === 0 ? ' is-active' : ''}" type="button" data-category="${key}">${label}</button>`).join('');
            const membershipJson = JSON.stringify(filterMembership || {}).replace(/</g, '\\u003c');

            return `<!doctype html>
