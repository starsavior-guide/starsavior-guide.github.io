          if (!arcanaIdBlock) throw new Error('Could not find ARCANA_DETAIL_IDS in app.js.');
          const parsedArcanaIds = [...arcanaIdBlock[1].matchAll(/["']([^"']+)["']\s*:\s*(\d+)/g)]
            .map((match) => ({ name: match[1], id: Number(match[2]) }));
          const uniqueArcanaIds = new Map();
          for (const item of parsedArcanaIds) {
            if (!uniqueArcanaIds.has(item.id)) uniqueArcanaIds.set(item.id, item);
          }
          const ARCANA_TARGETS = [...uniqueArcanaIds.values()].map((item) => ({
            href: `${ARCANA_ROOT}/${item.id}`,
            name: item.name,
            savior: '',
            grade: '',
            mode: 'detail-id',
            id: item.id
          }));
          if (ARCANA_TARGETS.length < 20) {
            throw new Error(`ARCANA_DETAIL_IDS too small: ${ARCANA_TARGETS.length}`);
          }
          console.log(`Loaded ${ARCANA_TARGETS.length} unique Arcana detail IDs from app.js`);

          const normalize = (value) => String(value ?? '')
            .replace(/\u00a0/g, ' ')
            .replace(/\s+/g, ' ')
            .trim();

          function safeFilename(value, fallback = 'arcana-event-asset') {
            const cleaned = normalize(value)
              .replace(/^Image\s*/i, '')
              .replace(/[\\/:*?"<>|]/g, ' ')
              .replace(/[. ]+$/g, '')
              .replace(/\s+/g, ' ')
              .slice(0, 90)
              .trim();
            return cleaned || fallback;
          }

          function extensionFrom(url, contentType = '') {
            try {
              const ext = path.extname(new URL(url).pathname).toLowerCase();
              if (/^\.(webp|png|jpe?g|gif|svg|avif)$/.test(ext)) return ext === '.jpeg' ? '.jpg' : ext;
            } catch (_) {}
            if (/webp/i.test(contentType)) return '.webp';
            if (/png/i.test(contentType)) return '.png';
            if (/jpe?g/i.test(contentType)) return '.jpg';
            if (/gif/i.test(contentType)) return '.gif';
            if (/svg/i.test(contentType)) return '.svg';
            if (/avif/i.test(contentType)) return '.avif';
            return '.bin';
          }

          const browser = await chromium.launch({ headless: true });
          const context = await browser.newContext({ locale: 'ko-KR', viewport: { width: 1180, height: 1800 }, deviceScaleFactor: 1 });
          const page = await context.newPage();
          page.setDefaultTimeout(45000);

          const assetMap = new Map();
          const usedNames = new Map();

          async function downloadAsset(url, preferredName = '') {
            if (!url || !/^https?:\/\//i.test(url)) return null;
            if (/myhits\.vercel\.app|hits\.seeyoufarm\.com/i.test(url)) return null;
            if (assetMap.has(url)) return assetMap.get(url);
            let response;
            try {
              response = await context.request.get(url, { timeout: 45000 });
              if (!response.ok()) throw new Error(`HTTP ${response.status()}`);
            } catch (error) {
              throw new Error(`Arcana event asset download failed: ${url} (${error.message})`);
            }
            const body = await response.body();
