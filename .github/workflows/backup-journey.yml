                  const style = getComputedStyle(parent);
                  const region = regionInfo(parent);
                  atoms.push({
                    type:'text', text,
                    x: Math.round((rect.left - entryRect.left) * 10) / 10,
                    y: Math.round((rect.top - entryRect.top) * 10) / 10,
                    w: Math.round(rect.width * 10) / 10,
                    h: Math.round(rect.height * 10) / 10,
                    fontSize: parseFloat(style.fontSize) || 14,
                    weight: parseInt(style.fontWeight, 10) || (/bold/i.test(style.fontWeight) ? 700 : 400),
                    region: region.id,
                    tone: region.tone
                  });
                }
                for (const img of sourceEntry.querySelectorAll('img')) {
                  if (!isVisible(img)) continue;
                  const rect = img.getBoundingClientRect();
                  let src = '';
                  try { src = new URL(img.currentSrc || img.getAttribute('src') || '', location.href).href; } catch (_) {}
                  if (!src || /myhits\.vercel\.app|hits\.seeyoufarm\.com/i.test(src)) continue;
                  const region = regionInfo(img);
                  atoms.push({
                    type:'image', src, alt: normalize(img.getAttribute('alt')),
                    x: Math.round((rect.left - entryRect.left) * 10) / 10,
                    y: Math.round((rect.top - entryRect.top) * 10) / 10,
                    w: Math.round(rect.width * 10) / 10,
                    h: Math.round(rect.height * 10) / 10,
                    region: region.id,
                    tone: region.tone
                  });
                }
                atoms.sort((a,b) => a.y - b.y || a.x - b.x || (a.type === 'image' ? -1 : 1));
                const rows = [];
                for (const atom of atoms) {
                  const center = atom.y + atom.h / 2;
                  let row = rows.findLast((candidate) => {
                    const overlap = Math.min(candidate.bottom, atom.y + atom.h) - Math.max(candidate.top, atom.y);
                    return overlap > Math.min(candidate.height, atom.h) * .25 || Math.abs(candidate.center - center) <= 7;
                  });
                  if (!row || atom.y - row.bottom > 10) {
                    row = { top: atom.y, bottom: atom.y + atom.h, center, height: atom.h, atoms: [] };
                    rows.push(row);
                  }
                  row.atoms.push(atom);
                  row.top = Math.min(row.top, atom.y);
                  row.bottom = Math.max(row.bottom, atom.y + atom.h);
                  row.height = row.bottom - row.top;
                  row.center = (row.top + row.bottom) / 2;
                }
                const serializedRows = rows.map((row) => {
                  row.atoms.sort((a,b) => a.x - b.x || (a.type === 'image' ? -1 : 1));
                  const segments = [];
                  for (const atom of row.atoms) {
                    if (atom.type === 'image') {
                      const previous = segments[segments.length - 1];
                      if (previous?.type === 'images' && Math.abs(atom.x - previous.lastX) < Math.max(12, atom.w * .55)) {
                        previous.images.push({ src:atom.src, alt:atom.alt, sourceWidth:atom.w, sourceHeight:atom.h });
                        previous.lastX = atom.x;
                      } else {
                        segments.push({ type:'images', images:[{ src:atom.src, alt:atom.alt, sourceWidth:atom.w, sourceHeight:atom.h }], lastX:atom.x });
                      }
                    } else {
                      const previous = segments[segments.length - 1];
                      if (previous?.type === 'text' && atom.x - previous.lastRight < 24) {
                        previous.text = normalize(`${previous.text} ${atom.text}`);
                        previous.lastRight = atom.x + atom.w;
                        previous.fontSize = Math.max(previous.fontSize, atom.fontSize);
                        previous.weight = Math.max(previous.weight, atom.weight);
                      } else {
                        segments.push({ type:'text', text:atom.text, fontSize:atom.fontSize, weight:atom.weight, lastRight:atom.x + atom.w });
                      }
                    }
                  }
                  for (const segment of segments) { delete segment.lastX; delete segment.lastRight; }
                  const text = normalize(segments.filter((s)=>s.type==='text').map((s)=>s.text).join(' '));
                  const regionAtoms = row.atoms.filter((a)=>a.region);
                  const region = regionAtoms[0]?.region || '';
                  const tone = regionAtoms.find((a)=>a.tone==='success')?.tone || regionAtoms.find((a)=>a.tone==='failure')?.tone || regionAtoms.find((a)=>a.tone==='highlight')?.tone || regionAtoms[0]?.tone || 'plain';
                  const fontSize = Math.max(0, ...row.atoms.filter((a)=>a.type==='text').map((a)=>a.fontSize || 0));
                  const weight = Math.max(0, ...row.atoms.filter((a)=>a.type==='text').map((a)=>a.weight || 0));
                  return { text, segments, region, tone, fontSize, weight };
                }).filter((row)=>row.text || row.segments.some((s)=>s.type==='images'));
                const titleRow = serializedRows.find((row) => row.text && !/^or$/i.test(row.text)) || { text:`Entry ${index+1}` };
                const title = titleRow.text;
                const secondIdentity = serializedRows.find((row, i) => i > 0 && /^(구원자\s*:|Savior\s*:|救援者\s*:|救援者：)/i.test(row.text))?.text || '';
                const key = hashText(`${title}|${secondIdentity}`);
                const imageText = serializedRows.flatMap((row) => row.segments || []).filter((segment) => segment.type === 'images').flatMap((segment) => segment.images || []).map((image) => image.alt || '').join(' ');
                const combinedText = normalize(`${serializedRows.map((row)=>row.text).join(' ')} ${imageText}`);
                const difficulties = [];
                for (const [diff, aliases] of Object.entries(difficultyText)) {
                  if (aliases.some((alias) => combinedText === alias || combinedText.startsWith(`${alias} `) || combinedText.endsWith(` ${alias}`) || combinedText.includes(` ${alias} `) || combinedText.includes(` ${alias},`) || combinedText.includes(` ${alias}:`))) difficulties.push(diff);
                }
                return { key, title, searchText: combinedText, difficulties, rows: serializedRows };
              }
          
              const detected = discoverEntries(clone);
              const entries = [];
              for (let i = 0; i < detected.length; i++) {
                const cloneEntry = detected[i];
                const sourceIndex = Number(cloneEntry.getAttribute('data-v76-source-index'));
                const sourceEntry = sourceElements[sourceIndex];
                if (!(sourceEntry instanceof Element)) continue;
                entries.push(extractEntry(sourceEntry, i));
              }
              return { kind, entries, bodyText: normalize(root.innerText) };
            }, { kind, difficultyText: DIFFICULTY_TEXT });
          
            // Download and localize every image referenced by structured rows.
            for (const entry of payload.entries) {
              for (const row of entry.rows) {
                for (const segment of row.segments) {
                  if (segment.type !== 'images') continue;
                  for (const image of segment.images) {
                    const preferred = image.alt || row.text || entry.title || 'journey-image';
                    image.asset = await downloadAsset(image.src, preferred);
                    delete image.src;
                  }
                }
              }
            }
            return payload;
          }
          
          function keyIndex(entries) {
            const map = new Map();
            entries.forEach((entry, index) => {
              if (!map.has(entry.key)) map.set(entry.key, []);
              map.get(entry.key).push(index);
            });
            return map;
          }
          
          function indicesForFiltered(defaultEntries, filteredEntries) {
            const defaults = keyIndex(defaultEntries);
            const indices = new Set();
            for (const entry of filteredEntries) {
              for (const index of defaults.get(entry.key) || []) indices.add(index);
            }
            return [...indices].sort((a,b)=>a-b);
          }
          
          async function clickJourneyCategory(category, aliases) {
            const savedPath = savedCategoryPaths[category];
            const result = await page.evaluate(({ aliases, savedPath }) => {
              const norm = (v) => String(v || '').replace(/\u00a0/g, ' ').replace(/\s+/g, ' ').trim().toLocaleLowerCase();
              const wanted = aliases.map(norm);
              const visible = (el) => {
                if (!(el instanceof HTMLElement)) return false;
                const r = el.getBoundingClientRect();
                const s = getComputedStyle(el);
                return r.width > 0 && r.height > 0 && s.display !== 'none' && s.visibility !== 'hidden';
              };
              const resolvePath = (path) => {
                let node = document.body;
                for (const index of path || []) {
                  node = node?.children?.[index];
                  if (!node) return null;
                }
                return node;
              };
              const makePath = (el) => {
                const path = [];
                let node = el;
                while (node && node !== document.body) {
                  const parent = node.parentElement;
                  if (!parent) return null;
                  path.unshift([...parent.children].indexOf(node));
                  node = parent;
                }
                return node === document.body ? path : null;
              };
              const clickableFor = (el) => {
                const semantic = el.closest('button,[role="button"],label,a');
                if (semantic && visible(semantic)) return semantic;
                let node = el;
                for (let depth = 0; node && node !== document.body && depth < 6; depth++, node = node.parentElement) {
                  if (!(node instanceof HTMLElement) || !visible(node)) continue;
                  const style = getComputedStyle(node);
                  if (style.cursor === 'pointer' || node.onclick || node.tabIndex >= 0) return node;
                }
                return el;
              };

              if (Array.isArray(savedPath)) {
                const saved = resolvePath(savedPath);
                if (saved && visible(saved)) {
                  saved.scrollIntoView({ block: 'center' });
                  saved.click();
                  return { clicked: true, path: savedPath, via: 'saved', text: norm(saved.innerText || saved.textContent) };
                }
              }

              const candidates = [];
              for (const el of document.querySelectorAll('button,[role="button"],label,a,div,span,p')) {
                if (!visible(el)) continue;
                const text = norm(el.innerText || el.textContent);
                if (!text) continue;
                const exact = wanted.includes(text);
                const fuzzy = wanted.some((target) => target.length >= 3 && (text.includes(target) || target.includes(text)));
                if (!exact && !fuzzy) continue;
                const clickable = clickableFor(el);
                if (!clickable || !visible(clickable)) continue;
