          async function selectLanguage(label) {
            const selects = page.locator('select');
            for (let i = 0; i < await selects.count(); i++) {
              const select = selects.nth(i);
              const currentText = await select.locator('option:checked').first().textContent().catch(() => '');
              if ((currentText || '').trim() === label) return true;
              const options = await select.locator('option').evaluateAll((nodes) => nodes.map((node) => ({ value: node.value, text: (node.textContent || '').trim() })));
              const option = options.find((item) => item.text === label);
              if (!option) continue;
              await select.selectOption(option.value);
              await page.waitForTimeout(550);
              return true;
            }

            // If only one language label is visibly exposed, it is normally the current-language trigger.
            const current = await page.evaluate((wanted) => {
              const labels = ['한국어','English','日本語','繁體中文','简体中文'];
              const visible = (el) => {
                if (!(el instanceof HTMLElement)) return false;
                const r = el.getBoundingClientRect();
                const s = getComputedStyle(el);
                return r.width > 0 && r.height > 0 && s.display !== 'none' && s.visibility !== 'hidden';
              };
              const norm = (v) => String(v || '').replace(/\s+/g,' ').trim();
              const exposed = [...document.querySelectorAll('button,[role="button"],label,a,div,span')]
                .filter(visible)
                .map((el) => norm(el.innerText || el.textContent))
                .filter((text) => labels.includes(text));
              const unique = [...new Set(exposed)];
              return unique.length === 1 && unique[0] === wanted;
            }, label);
            if (current) return true;

            const triggers = page.getByText(/한국어|English|日本語|繁體中文|简体中文/, { exact: true });
            for (let i = 0; i < await triggers.count(); i++) {
              const trigger = triggers.nth(i);
              try {
                if (!await trigger.isVisible()) continue;
                await trigger.click();
                await page.waitForTimeout(180);
                const targets = page.getByText(label, { exact: true });
                for (let j = 0; j < await targets.count(); j++) {
                  if (await targets.nth(j).isVisible()) {
                    await targets.nth(j).click();
                    await page.waitForTimeout(600);
                    return true;
                  }
                }
              } catch (_) {}
            }
            throw new Error(`Could not switch Arcana language to ${label}.`);
          }

          async function prepareArcanaIndex(language) {
            await page.goto(ARCANA_ROOT, { waitUntil: 'domcontentloaded', timeout: 60000 });
            await waitReady(900);
            await selectLanguage(language.label);
            await waitReady(900);
            await deepScroll();
          }

          async function discoverArcanaTargets() {
            return page.evaluate(() => {
              const norm = (v) => String(v || '').replace(/\u00a0/g, ' ').replace(/\s+/g, ' ').trim();
              const visible = (el) => {
                if (!(el instanceof HTMLElement)) return false;
                const r = el.getBoundingClientRect();
                const s = getComputedStyle(el);
                return r.width > 0 && r.height > 0 && s.display !== 'none' && s.visibility !== 'hidden';
              };
              const origin = location.origin;
              const generic = new Set(['아르카나','Arcana','アルカナ','이벤트','Event','Events','イベント']);
              const results = [];
              const seen = new Set();

              // Preferred path: real links to detail pages.
              for (const a of document.querySelectorAll('a[href]')) {
                let url;
                try { url = new URL(a.getAttribute('href'), location.href); } catch (_) { continue; }
                if (url.origin !== origin || !url.pathname.startsWith('/arcana')) continue;
                const isRoot = url.pathname.replace(/\/+$/,'') === '/arcana' && !url.search && !url.hash;
                if (isRoot) continue;
                const card = a.closest('article,li,[class*="card"],[class*="item"]') || a;
                const heading = card.querySelector('h1,h2,h3,h4,h5,h6') || a.querySelector('h1,h2,h3,h4,h5,h6');
                const name = norm(heading?.textContent || a.textContent);
                const text = norm(card.textContent);
                if (!name || generic.has(name) || text.length < 3) continue;
                const key = url.href;
                if (seen.has(key)) continue;
                seen.add(key);
                const grade = (text.match(/(?:^|\s)(SSR|SR|R)(?:\s|$)/) || [])[1] || '';
                const lines = String(card.innerText || '').split(/\n+/).map(norm).filter(Boolean);
                const savior = lines.find((line) => line !== name && line !== grade && !/^Image$/i.test(line) && line.length <= 40 && !/^(Lv\.|레벨|Level)/i.test(line)) || '';
                results.push({ href: url.href, name, savior, grade, mode: 'href' });
              }
              if (results.length >= 10) return results;

              // Fallback for SPA cards without href: save name + savior, then click the card again later.
              const candidates = [];
              for (const heading of document.querySelectorAll('h2,h3,h4,h5')) {
                if (!visible(heading)) continue;
                const name = norm(heading.textContent);
                if (!name || generic.has(name)) continue;
                let card = heading;
                for (let depth = 0; card && card !== document.body && depth < 7; depth++, card = card.parentElement) {
                  const text = norm(card.textContent);
                  if (/(?:^|\s)(SSR|SR|R)(?:\s|$)/.test(text) && text.length <= 700) break;
                }
                if (!(card instanceof HTMLElement) || card === document.body) continue;
                const text = norm(card.textContent);
                const grade = (text.match(/(?:^|\s)(SSR|SR|R)(?:\s|$)/) || [])[1] || '';
                if (!grade) continue;
                const lines = String(card.innerText || '').split(/\n+/).map(norm).filter(Boolean);
                const savior = lines.find((line) => line !== name && line !== grade && !/^Image$/i.test(line) && line.length <= 40 && !/^(Lv\.|레벨|Level)/i.test(line)) || '';
                candidates.push({ href: '', name, savior, grade, mode: 'click' });
              }
              const byKey = new Map();
              for (const item of candidates) {
                const key = `${item.name}\u0000${item.savior}\u0000${item.grade}`;
                if (!byKey.has(key)) byKey.set(key, item);
              }
              return [...byKey.values()];
            });
          }

          async function openArcanaTarget(target, language) {
            if (target.href) {
              await page.goto(target.href, { waitUntil: 'domcontentloaded', timeout: 60000 });
              await waitReady(300);
              await selectLanguage(language.label);
              await waitReady(300);
              await deepScroll();
              return;
            }

            await prepareArcanaIndex(language);
            const clicked = await page.evaluate(({ name, savior, grade }) => {
              const norm = (v) => String(v || '').replace(/\u00a0/g, ' ').replace(/\s+/g, ' ').trim();
              const visible = (el) => {
                if (!(el instanceof HTMLElement)) return false;
                const r = el.getBoundingClientRect();
                const s = getComputedStyle(el);
                return r.width > 0 && r.height > 0 && s.display !== 'none' && s.visibility !== 'hidden';
              };
              const clickableFor = (el) => {
                const semantic = el.closest('a[href],button,[role="button"]');
                if (semantic && visible(semantic)) return semantic;
                let node = el;
                for (let depth = 0; node && node !== document.body && depth < 7; depth++, node = node.parentElement) {
                  if (!(node instanceof HTMLElement) || !visible(node)) continue;
                  const style = getComputedStyle(node);
                  if (style.cursor === 'pointer' || node.onclick || node.tabIndex >= 0) return node;
                }
                return null;
              };
              const hits = [];
              for (const el of document.querySelectorAll('h1,h2,h3,h4,h5,h6,button,a,div,span')) {
                if (!visible(el) || norm(el.textContent) !== name) continue;
                const clickable = clickableFor(el);
                if (!clickable) continue;
                const card = clickable.closest('article,li,[class*="card"],[class*="item"]') || clickable.parentElement || clickable;
                const text = norm(card.textContent);
                let score = 1000;
                if (savior && text.includes(savior)) score += 500;
                if (grade && text.includes(grade)) score += 200;
                score -= text.length;
                hits.push({ clickable, score });
              }
              hits.sort((a,b) => b.score - a.score);
              if (!hits.length) return false;
              hits[0].clickable.scrollIntoView({ block: 'center' });
              hits[0].clickable.click();
              return true;
            }, target);
            if (!clicked) throw new Error(`Could not open Arcana card: ${target.name} / ${target.savior}`);
            await page.waitForTimeout(650);
            await waitReady(300);
            await deepScroll();
          }

          async function captureArcanaDetail(language, target, ordinal) {
            const payload = await page.evaluate(({ eventLabels, saviorLabel, fallbackName, fallbackSavior, fallbackGrade, ordinal }) => {
              const normalize = (value) => String(value || '').replace(/\u00a0/g, ' ').replace(/\s+/g, ' ').trim();
              const isVisible = (el) => {
                if (!(el instanceof Element)) return false;
                const rect = el.getBoundingClientRect();
                const style = getComputedStyle(el);
                return rect.width > 0 && rect.height > 0 && style.display !== 'none' && style.visibility !== 'hidden' && style.opacity !== '0';
              };
              const root = document.querySelector('main') || document.querySelector('[role="main"]') || document.body;
              const allVisible = [...root.querySelectorAll('h1,h2,h3,h4,h5,h6,div,span,p,strong')].filter(isVisible);
              const eventHeading = allVisible
                .filter((el) => eventLabels.includes(normalize(el.textContent)))
                .sort((a,b) => a.getBoundingClientRect().top - b.getBoundingClientRect().top)[0] || null;
              if (!eventHeading) return { error: 'event-heading-not-found', bodyText: normalize(root.innerText).slice(0, 1200) };

              const eventTop = eventHeading.getBoundingClientRect().bottom - 2;
              const footer = [...document.querySelectorAll('footer,[role="contentinfo"]')].find(isVisible);
              const footerTop = footer ? footer.getBoundingClientRect().top : Number.POSITIVE_INFINITY;

              // Metadata is above the Event heading. Prefer the largest non-generic heading.
              const generic = new Set(['아르카나','Arcana','アルカナ','이벤트','Event','Events','イベント']);
              const headings = [...root.querySelectorAll('h1,h2,h3,h4,h5,h6')]
                .filter(isVisible)
                .map((el) => ({
                  el,
                  text: normalize(el.textContent),
                  top: el.getBoundingClientRect().top,
                  size: parseFloat(getComputedStyle(el).fontSize) || 0
                }))
                .filter((item) => item.top < eventHeading.getBoundingClientRect().top && item.text && !generic.has(item.text));
              headings.sort((a,b) => b.size - a.size || a.top - b.top);
              const name = headings[0]?.text || fallbackName || `Arcana ${ordinal + 1}`;

              const headerText = normalize(root.innerText).split(/\s+/);
              const rootLines = String(root.innerText || '').split(/\n+/).map(normalize).filter(Boolean);
              const eventLineIndex = rootLines.findIndex((line) => eventLabels.includes(line));
              const beforeLines = eventLineIndex >= 0 ? rootLines.slice(0, eventLineIndex) : rootLines.slice(0, 25);
              const grade = beforeLines.find((line) => /^(SSR|SR|R)$/.test(line)) || fallbackGrade || '';

              let savior = fallbackSavior || '';
              if (!savior) {
                const nameIndex = beforeLines.findIndex((line) => line === name);
                const gradeIndex = beforeLines.findIndex((line) => line === grade);
                const start = Math.max(nameIndex, gradeIndex, -1) + 1;
                savior = beforeLines.slice(start, start + 8).find((line) =>
                  line && line !== name && line !== grade && line.length <= 40 &&
                  !/^(Lv\.|레벨|Level|한국어|English|日本語|아르카나|Arcana|アルカナ)/i.test(line)
                ) || '';
              }

              function parseRgb(value) {
                const m = String(value || '').match(/rgba?\((\d+)[, ]+(\d+)[, ]+(\d+)(?:[, /]+([\d.]+))?\)/i);
                if (!m) return null;
                return { r:+m[1], g:+m[2], b:+m[3], a:m[4] == null ? 1 : +m[4] };
              }
              function toneFrom(rgb) {
                if (!rgb || rgb.a < .05) return 'plain';
                if (rgb.g > rgb.r * 1.28 && rgb.g > rgb.b * 1.12) return 'success';
                if (rgb.r > rgb.g * 1.28 && rgb.r > rgb.b * 1.08) return 'failure';
                if (rgb.r > 90 && rgb.g > 65 && rgb.b < Math.min(rgb.r, rgb.g) * .82) return 'highlight';
                return 'neutral';
              }

              const regionIds = new WeakMap();
              let regionSeq = 0;
              function regionInfo(el) {
                let node = el instanceof Element ? el : el?.parentElement;
                while (node && node !== root) {
                  if (node.closest('header,nav,aside,footer,[role="navigation"],[role="contentinfo"]')) return { id:'', tone:'plain' };
                  const rect = node.getBoundingClientRect();
                  const style = getComputedStyle(node);
                  const bg = parseRgb(style.backgroundColor);
                  const tone = toneFrom(bg);
                  const border = parseFloat(style.borderTopWidth || '0') + parseFloat(style.borderRightWidth || '0') + parseFloat(style.borderBottomWidth || '0') + parseFloat(style.borderLeftWidth || '0');
                  if (rect.width > 15 && rect.height > 12 && ((bg && bg.a >= .06 && tone !== 'plain') || border > 0)) {
                    if (!regionIds.has(node)) regionIds.set(node, `ar${++regionSeq}`);
                    return { id: regionIds.get(node), tone };
                  }
                  node = node.parentElement;
                }
                return { id:'', tone:'plain' };
              }

              const atoms = [];
              const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
              let node;
              while ((node = walker.nextNode())) {
                const parent = node.parentElement;
                if (!parent || !isVisible(parent) || parent.closest('script,style,noscript,header,nav,aside,footer,[role="navigation"],[role="contentinfo"]')) continue;
                const text = normalize(node.nodeValue);
                if (!text) continue;
                const range = document.createRange();
                range.selectNodeContents(node);
                const rect = range.getBoundingClientRect();
                if (!(rect.width > 0 && rect.height > 0) || rect.top < eventTop || rect.top >= footerTop) continue;
                const style = getComputedStyle(parent);
                const region = regionInfo(parent);
                atoms.push({
                  type:'text', text,
                  x: Math.round(rect.left * 10) / 10,
                  y: Math.round((rect.top - eventTop) * 10) / 10,
                  w: Math.round(rect.width * 10) / 10,
                  h: Math.round(rect.height * 10) / 10,
                  fontSize: parseFloat(style.fontSize) || 14,
                  weight: parseInt(style.fontWeight, 10) || (/bold/i.test(style.fontWeight) ? 700 : 400),
                  region: region.id,
                  tone: region.tone
                });
              }

              for (const img of root.querySelectorAll('img')) {
                if (!isVisible(img) || img.closest('header,nav,aside,footer,[role="navigation"],[role="contentinfo"]')) continue;
                const rect = img.getBoundingClientRect();
                if (rect.top < eventTop || rect.top >= footerTop) continue;
                let src = '';
                try { src = new URL(img.currentSrc || img.getAttribute('src') || '', location.href).href; } catch (_) {}
                if (!src || /myhits\.vercel\.app|hits\.seeyoufarm\.com/i.test(src)) continue;
                const region = regionInfo(img);
                atoms.push({
                  type:'image', src, alt: normalize(img.getAttribute('alt')),
                  x: Math.round(rect.left * 10) / 10,
                  y: Math.round((rect.top - eventTop) * 10) / 10,
                  w: Math.round(rect.width * 10) / 10,
                  h: Math.round(rect.height * 10) / 10,
                  region: region.id,
                  tone: region.tone
                });
              }

              atoms.sort((a,b) => a.y - b.y || a.x - b.x || (a.type === 'image' ? -1 : 1));
              const rows = [];
              for (const atom of atoms) {
                const center = atom.y + atom.h / 2;
                let row = rows.findLast((candidate) => {
                  const overlap = Math.min(candidate.bottom, atom.y + atom.h) - Math.max(candidate.top, atom.y);
                  return overlap > Math.min(candidate.height, atom.h) * .25 || Math.abs(candidate.center - center) <= 7;
                });
                if (!row || atom.y - row.bottom > 10) {
                  row = { top:atom.y, bottom:atom.y + atom.h, center, height:atom.h, atoms:[] };
                  rows.push(row);
                }
                row.atoms.push(atom);
                row.top = Math.min(row.top, atom.y);
                row.bottom = Math.max(row.bottom, atom.y + atom.h);
                row.height = row.bottom - row.top;
                row.center = (row.top + row.bottom) / 2;
              }

              const serialized = rows.map((row) => {
                row.atoms.sort((a,b) => a.x - b.x || (a.type === 'image' ? -1 : 1));
                const segments = [];
                for (const atom of row.atoms) {
                  if (atom.type === 'image') {
                    const previous = segments[segments.length - 1];
                    if (previous?.type === 'images' && Math.abs(atom.x - previous.lastX) < Math.max(12, atom.w * .55)) {
                      previous.images.push({ src:atom.src, alt:atom.alt, sourceWidth:atom.w, sourceHeight:atom.h });
                      previous.lastX = atom.x;
                    } else {
                      segments.push({ type:'images', images:[{ src:atom.src, alt:atom.alt, sourceWidth:atom.w, sourceHeight:atom.h }], lastX:atom.x });
                    }
                  } else {
                    const previous = segments[segments.length - 1];
                    if (previous?.type === 'text' && atom.x - previous.lastRight < 24) {
                      previous.text = normalize(`${previous.text} ${atom.text}`);
                      previous.lastRight = atom.x + atom.w;
                      previous.fontSize = Math.max(previous.fontSize, atom.fontSize);
                      previous.weight = Math.max(previous.weight, atom.weight);
                    } else {
                      segments.push({ type:'text', text:atom.text, fontSize:atom.fontSize, weight:atom.weight, lastRight:atom.x + atom.w });
                    }
                  }
                }
                for (const segment of segments) { delete segment.lastX; delete segment.lastRight; }
                const text = normalize(segments.filter((segment) => segment.type === 'text').map((segment) => segment.text).join(' '));
                const regionAtoms = row.atoms.filter((atom) => atom.region);
                const region = regionAtoms[0]?.region || '';
                const tone = regionAtoms.find((atom) => atom.tone === 'failure')?.tone
                  || regionAtoms.find((atom) => atom.tone === 'success')?.tone
                  || regionAtoms.find((atom) => atom.tone === 'highlight')?.tone
                  || regionAtoms[0]?.tone || 'plain';
                const fontSize = Math.max(0, ...row.atoms.filter((atom) => atom.type === 'text').map((atom) => atom.fontSize || 0));
                const weight = Math.max(0, ...row.atoms.filter((atom) => atom.type === 'text').map((atom) => atom.weight || 0));
                return { text, segments, region, tone, fontSize, weight, y:row.top, height:row.height };
              }).filter((row) => row.text || row.segments.some((segment) => segment.type === 'images'));

              // The source footer is not always a semantic <footer>, so trim it by
              // its actual disclaimer text before building Arcana Journey data.
              const footerMarkers = [
                '이 페이지는 게임', '비영리 팬 프로젝트', '프로젝트에 사용된 모든 자산',
                'STUDIOBSIDE', '제보/문의 Discord', 'hippo2003',
                'This page is', 'fan project', 'All assets, data, images', 'Report/Inquiries Discord',
                'このページは', '非営利ファン', '使用されているすべての', 'お問い合わせ Discord'
              ];
              const footerIndex = serialized.findIndex((row) => {
                const text = normalize(row.text).toLowerCase();
                return footerMarkers.some((marker) => text.includes(marker.toLowerCase()));
              });
              const cleanedSerialized = (footerIndex >= 0 ? serialized.slice(0, footerIndex) : serialized)
                .filter((row) => {
                  const text = normalize(row.text);
                  return (text && !/^hits?\b/i.test(text)) || row.segments.some((segment) => segment.type === 'images');
                });

              // Mark event headings while we still have the source typography and geometry.
              const fontSizes = cleanedSerialized
                .filter((row) => normalize(row.text))
                .map((row) => Number(row.fontSize) || 0)
                .filter((value) => value > 0)
                .sort((a,b) => a-b);
              const medianFont = fontSizes.length ? fontSizes[Math.floor(fontSizes.length / 2)] : 14;
              const titleThreshold = Math.max(16.5, medianFont + 1.25);
              const titleExcluded = /^(성공|실패|Success|Failure|成功|失敗|or)$/i;
              const statLike = /(잠재력|스태미나|컨디션|힘\s*[+-]|체력\s*[+-]|인내\s*[+-]|집중\s*[+-]|보호\s*[+-]|공격력|방어력|생명력|속도|할인|여정 버프|턴$)/i;

              for (let index = 0; index < cleanedSerialized.length; index++) {
                const row = cleanedSerialized[index];
                const text = normalize(row.text);
                const hasImages = (row.segments || []).some((segment) => segment.type === 'images');
                const previous = index > 0 ? cleanedSerialized[index - 1] : null;
                const verticalGap = previous ? (Number(row.y) || 0) - ((Number(previous.y) || 0) + (Number(previous.height) || 0)) : 999;
                const looksLikeTitle = text && text.length <= 90 && !titleExcluded.test(text) && !statLike.test(text) && !hasImages
                  && (index === 0 || ((Number(row.fontSize) || 0) >= titleThreshold && (Number(row.weight) || 0) >= 600)
                    || (verticalGap >= 18 && (Number(row.weight) || 0) >= 650));
                row.isEventTitle = Boolean(looksLikeTitle);
              }

              const metadataRows = [
                { text:`[아르카나]${name}`, segments:[{ type:'text', text:`[아르카나]${name}`, fontSize:24, weight:850 }], region:'', tone:'plain', fontSize:24, weight:850, isEventTitle:false },
                { text:`${saviorLabel} : ${savior || '-'}`, segments:[{ type:'text', text:`${saviorLabel} : ${savior || '-'}`, fontSize:15, weight:700 }], region:'', tone:'plain', fontSize:15, weight:700, isEventTitle:false }
              ];
              if (grade) metadataRows.splice(1, 0, { text:grade, segments:[{ type:'text', text:grade, fontSize:14, weight:800 }], region:'', tone:'plain', fontSize:14, weight:800, isEventTitle:false });

              const eventTitleText = cleanedSerialized
                .filter((row) => row.isEventTitle)
                .map((row) => row.text)
                .join(' ');
              // Arcana search intentionally indexes card name, Savior, and event headings.
              // Narrative story text is excluded so names mentioned in another card do not cause false matches.
              const searchText = normalize(`${name} ${grade} ${savior} ${eventTitleText}`);
              return {
                key: `arcana:${normalize(name)}:${normalize(savior)}`,
                title: `[아르카나]${name}`,
                arcanaName: name,
                grade,
                savior,
                searchText,
                difficulties: [],
                categories: [],
                kind: 'arcana',
                rows: [...metadataRows, ...cleanedSerialized]
              };
            }, {
              eventLabels: language.eventLabels,
              saviorLabel: language.saviorLabel,
              fallbackName: target.name || '',
              fallbackSavior: target.savior || '',
              fallbackGrade: target.grade || '',
              ordinal
            });

            if (payload?.error) {
              throw new Error(`Arcana detail extraction failed (${payload.error}) for ${target.name || target.href}. ${payload.bodyText || ''}`);
            }
            if (!payload?.title || !Array.isArray(payload.rows) || payload.rows.length < 3) {
              throw new Error(`Arcana detail extraction was too small for ${target.name || target.href}`);
            }

            for (const row of payload.rows) {
              for (const segment of row.segments || []) {
                if (segment.type !== 'images') continue;
                for (const image of segment.images || []) {
                  if (!image.src) continue;
                  const preferred = image.alt || row.text || payload.arcanaName || 'arcana-event-image';
                  image.asset = await downloadAsset(image.src, preferred);
                  delete image.src;
                }
              }
            }

            // Persist explicit event groups after local asset replacement so the
            // site does not have to guess the boundaries on every render.
            const contentRows = payload.rows.filter((row) =>
              row && !/^\[아르카나\]/.test(String(row.text || ''))
              && String(row.text || '') !== String(payload.grade || '')
              && !/^(구원자|Savior|救援者)\s*[:：]/i.test(String(row.text || ''))
            );
            const eventGroups = [];
            let currentGroup = null;
            for (const row of contentRows) {
              if (row.isEventTitle) {
                currentGroup = { title: String(row.text || '').trim(), rows: [] };
                eventGroups.push(currentGroup);
                continue;
              }
              if (!currentGroup) {
                currentGroup = { title: '', rows: [] };
                eventGroups.push(currentGroup);
              }
              currentGroup.rows.push(row);
            }
            payload.eventGroups = eventGroups.filter((group) => group.title || group.rows.length);
            return payload;
          }

          const arcanaByLanguage = {};
          for (const language of LANGUAGES) {
            const targets = ARCANA_TARGETS;
            console.log(`${language.key}: capturing ${targets.length} Arcana detail pages directly from app.js IDs`);

            const entries = [];
            const seen = new Set();
            for (let i = 0; i < targets.length; i++) {
              const target = targets[i];
              await openArcanaTarget(target, language);
              const entry = await captureArcanaDetail(language, target, i);
              const key = `${normalize(entry.arcanaName)}\u0000${normalize(entry.savior)}`;
              if (!seen.has(key)) {
                seen.add(key);
                entries.push(entry);
              }
              console.log(`${language.key} arcana ${i + 1}/${targets.length}: ${entry.arcanaName} / ${entry.savior}`);
            }
            if (entries.length < 20) throw new Error(`Arcana detail capture too small for ${language.key}: ${entries.length}`);
            arcanaByLanguage[language.key] = entries;
          }

          for (const language of LANGUAGES) {
            const file = path.join(OUT_DIR, language.key, 'journey.json');
            if (!fs.existsSync(file)) throw new Error(`Journey JSON missing before Arcana merge: ${file}`);
            const data = JSON.parse(fs.readFileSync(file, 'utf8'));
            // IMPORTANT: preserve the already-working generic Journey event data and category memberships verbatim.
            data.arcana = arcanaByLanguage[language.key];
            data.version = Math.max(Number(data.version) || 2, 3);
            fs.writeFileSync(file, JSON.stringify(data, null, 2), 'utf8');
          }

          let meta = {};
          if (fs.existsSync(META_PATH)) {
            try { meta = JSON.parse(fs.readFileSync(META_PATH, 'utf8')); } catch (_) {}
          }
          meta.sources = {
            journey: meta.source || 'https://star-savior-arcana-db.pages.dev/journey',
            arcana: ARCANA_ROOT
          };
          meta.arcanaSource = ARCANA_ROOT;
          meta.arcanaMode = 'arcana-detail-ids-from-app';
          meta.counts = meta.counts || {};
          for (const language of LANGUAGES) {
            meta.counts[language.key] = meta.counts[language.key] || {};
            meta.counts[language.key].arcana = arcanaByLanguage[language.key].length;
          }
          meta.localAssetCount = fs.readdirSync(ASSET_DIR).filter((name) => fs.statSync(path.join(ASSET_DIR, name)).isFile()).length;
          fs.writeFileSync(META_PATH, JSON.stringify(meta, null, 2), 'utf8');

          await browser.close();
          console.log(JSON.stringify({
            source: ARCANA_ROOT,
            counts: Object.fromEntries(LANGUAGES.map((language) => [language.key, arcanaByLanguage[language.key].length])),
            assets: meta.localAssetCount
          }, null, 2));
          NODE
          node .arcana-journey-capture.mjs
          rm -f .arcana-journey-capture.mjs

      - name: Verify structured local Journey database
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';

          const languages = ['ko','en','ja'];
          const meta = JSON.parse(fs.readFileSync('data/journey/backup-meta.json','utf8'));
          if (meta.sourceRequiredAtRuntime !== false || meta.mode !== 'structured-local-json') {
            throw new Error('Journey metadata is not local structured JSON.');
          }
          for (const language of languages) {
            const file = `data/journey/${language}/journey.json`;
            if (!fs.existsSync(file)) throw new Error(`Missing ${file}`);
            const raw = fs.readFileSync(file,'utf8');
            if (/https?:\/\//i.test(raw)) throw new Error(`External URL remained in ${file}`);
            const data = JSON.parse(raw);
            if (!Array.isArray(data.arcana) || data.arcana.length < 5) throw new Error(`Arcana data too small for ${language}`);
            if (!Array.isArray(data.events) || data.events.length < 20) throw new Error(`Journey event data too small for ${language}`);
            const combined = [...data.arcana, ...data.events];
            for (const entry of combined) {
              if (!entry.title || !Array.isArray(entry.rows) || !entry.rows.length) throw new Error(`Malformed Journey entry in ${language}`);
            }
          }
          const assets = fs.readdirSync('data/journey-assets').filter((name) => fs.statSync(path.join('data/journey-assets',name)).isFile());
          if (assets.length < 10) throw new Error(`Journey asset backup too small: ${assets.length}`);
          const ko = JSON.parse(fs.readFileSync('data/journey/ko/journey.json','utf8'));
          const koText = [...ko.arcana,...ko.events].map((entry)=>entry.searchText).join(' ');
          for (const token of ['훈련의 방향성','리세트의 일과','오늘의 날씨','두통이 생기다']) {
            if (!koText.includes(token)) throw new Error(`Missing Korean Journey token: ${token}`);
          }
          const arcanaSearch = ko.arcana.some((entry) => (entry.searchText || '').includes('린'));
          if (!arcanaSearch) throw new Error('Arcana Journey search corpus does not contain 린.');
          const knownArcana = ko.arcana.find((entry) => (entry.searchText || '').includes('누각 위, 유리달 맞이'));
          if (!knownArcana) throw new Error('Missing known Arcana detail: 누각 위, 유리달 맞이');
          for (const token of ['부끄럽지 않아요','만물이 지닌 가치','건강이 제일이에요']) {
            if (!(knownArcana.searchText || '').includes(token)) throw new Error(`Known Arcana event token missing: ${token}`);
          }
          if (!(knownArcana.searchText || '').includes('린')) throw new Error('Known Arcana Savior mapping missing: 린');
          if (!Array.isArray(knownArcana.eventGroups) || knownArcana.eventGroups.length < 3) {
            throw new Error(`Known Arcana event grouping failed: ${knownArcana.eventGroups?.length || 0}`);
          }
          const knownEventTitles = knownArcana.eventGroups.map((group) => group.title || '').join(' ');
          for (const token of ['부끄럽지 않아요','만물이 지닌 가치','건강이 제일이에요']) {
            if (!knownEventTitles.includes(token)) throw new Error(`Known Arcana grouped event title missing: ${token}`);
          }
          const arcanaRawText = JSON.stringify(ko.arcana);
          for (const marker of ['비영리 팬 프로젝트','제보/문의 Discord','hippo2003']) {
            if (arcanaRawText.includes(marker)) throw new Error(`Arcana footer text leaked into local data: ${marker}`);
          }
          const unrelated = ko.arcana.find((entry) => String(entry.arcanaName || '').includes('완벽한 바니걸'));
          if (unrelated && String(unrelated.searchText || '').includes('린')) {
            throw new Error('Arcana search corpus false-positive check failed: 완벽한 바니걸 contains 린');
          }
          for (const language of languages) {
            const data = JSON.parse(fs.readFileSync(`data/journey/${language}/journey.json`,'utf8'));
            for (const category of ['reset','raid','aganon','flora','kalaid','weather']) {
              const count = data.events.filter((entry)=>entry.categories?.includes(category)).length;
              if (!count) throw new Error(`Journey category has no entries for ${language}: ${category}`);
            }
          }
          console.log(`Structured Journey verification passed. assets=${assets.length}`);
          NODE

      - name: Commit Journey database
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/journey data/journey-assets
          if git diff --cached --quiet; then
            echo "No Journey changes to commit."
          else
            git commit -m "Rebuild Journey database as local JSON (ko-en-ja)"
            git push
          fi
