name: Backup Journey database
# v75: archive only Journey cards; local search/category/difficulty filters use captured source membership

on:
  push:
    paths:
      - '.github/workflows/backup-journey.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backup-journey:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install browser
        shell: bash
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Capture Journey database locally
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import crypto from 'node:crypto';
          import { chromium } from 'playwright';

          const ROOT = process.cwd();
          const SOURCE_URL = 'https://star-savior-arcana-db.pages.dev/journey';
          const OUT_DIR = path.join(ROOT, 'data', 'journey');
          const ASSET_DIR = path.join(ROOT, 'data', 'journey-assets');
          const META_PATH = path.join(OUT_DIR, 'backup-meta.json');

          const LANGUAGES = [
            { key: 'ko', label: '한국어', htmlLang: 'ko-KR', arcana: '아르카나', events: '여정 이벤트', search: '이름, 이벤트, 보상 검색' },
            { key: 'en', label: 'English', htmlLang: 'en', arcana: 'Arcana', events: 'Journey Events', search: 'Search names, events, rewards' },
            { key: 'ja', label: '日本語', htmlLang: 'ja', arcana: 'アルカナ', events: '旅程イベント', search: '名前・イベント・報酬を検索' },
            { key: 'zh-TW', label: '繁體中文', htmlLang: 'zh-Hant', arcana: '阿爾克那', events: '旅程事件', search: '搜尋名稱、事件、獎勵' },
            { key: 'zh-CN', label: '简体中文', htmlLang: 'zh-Hans', arcana: '阿尔克那', events: '旅程事件', search: '搜索名称、事件、奖励' }
          ];

          fs.rmSync(OUT_DIR, { recursive: true, force: true });
          fs.rmSync(ASSET_DIR, { recursive: true, force: true });
          fs.mkdirSync(OUT_DIR, { recursive: true });
          fs.mkdirSync(ASSET_DIR, { recursive: true });

          function normalize(value) {
            return String(value ?? '').replace(/\u00a0/g, ' ').replace(/\s+/g, ' ').trim();
          }

          function safeFilename(value, fallback = 'asset') {
            const cleaned = normalize(value)
              .replace(/^Image\s*/i, '')
              .replace(/[\\/:*?"<>|]/g, ' ')
              .replace(/[. ]+$/g, '')
              .replace(/\s+/g, ' ')
              .slice(0, 90)
              .trim();
            return cleaned || fallback;
          }

          function extensionFrom(url, contentType = '') {
            try {
              const ext = path.extname(new URL(url).pathname).toLowerCase();
              if (/^\.(webp|png|jpe?g|gif|svg|avif)$/.test(ext)) return ext === '.jpeg' ? '.jpg' : ext;
            } catch (_) {}
            if (/webp/i.test(contentType)) return '.webp';
            if (/png/i.test(contentType)) return '.png';
            if (/jpe?g/i.test(contentType)) return '.jpg';
            if (/gif/i.test(contentType)) return '.gif';
            if (/svg/i.test(contentType)) return '.svg';
            if (/avif/i.test(contentType)) return '.avif';
            if (/woff2/i.test(contentType)) return '.woff2';
            if (/woff/i.test(contentType)) return '.woff';
            if (/ttf/i.test(contentType)) return '.ttf';
            return '.bin';
          }

          const browser = await chromium.launch({ headless: true });
          const context = await browser.newContext({
            locale: 'ko-KR',
            viewport: { width: 1440, height: 1800 },
            deviceScaleFactor: 1
          });
          const page = await context.newPage();
          page.setDefaultTimeout(45000);

          const assetMap = new Map();
          const usedNames = new Map();
          const captureLog = [];

          async function downloadAsset(url, preferredName = '') {
            if (!url || !/^https?:\/\//i.test(url)) return url;
            if (assetMap.has(url)) return assetMap.get(url);

            let response;
            try {
              response = await context.request.get(url, { timeout: 45000 });
              if (!response.ok()) throw new Error(`HTTP ${response.status()}`);
            } catch (error) {
              throw new Error(`Journey asset download failed: ${url} (${error.message})`);
            }

            const body = await response.body();
            if (body.length < 20) throw new Error(`Journey asset was too small: ${url}`);
            const contentType = response.headers()['content-type'] || '';
            const ext = extensionFrom(url, contentType);
            const hash = crypto.createHash('sha256').update(body).digest('hex').slice(0, 10);
            let base = safeFilename(preferredName || path.basename(new URL(url).pathname, path.extname(new URL(url).pathname)), hash);
            let filename = `${base}${ext}`;

            const previous = usedNames.get(filename);
            if (previous && previous !== hash) filename = `${base}-${hash}${ext}`;
            usedNames.set(filename, hash);

            const dest = path.join(ASSET_DIR, filename);
            if (!fs.existsSync(dest)) fs.writeFileSync(dest, body);
            const local = `../../journey-assets/${encodeURIComponent(filename).replaceAll('%2F', '/')}`;
            assetMap.set(url, local);
            return local;
          }

          async function waitForJourneyReady() {
            await page.waitForFunction(() => (document.body?.innerText || '').trim().length > 1500, null, { timeout: 45000 });
            try { await page.waitForLoadState('networkidle', { timeout: 15000 }); } catch (_) {}
            await page.waitForTimeout(1000);
          }

          async function deepScroll() {
            let stable = 0;
            let lastHeight = 0;
            for (let i = 0; i < 90; i++) {
              const info = await page.evaluate(() => {
                window.scrollTo(0, document.documentElement.scrollHeight);
                return { height: document.documentElement.scrollHeight, y: window.scrollY };
              });
              await page.waitForTimeout(180);
              if (info.height === lastHeight) stable += 1;
              else stable = 0;
              lastHeight = info.height;
              if (stable >= 5) break;
            }
            await page.evaluate(() => window.scrollTo(0, 0));
            await page.waitForTimeout(250);
          }

          async function expandMoreButtons() {
            const morePattern = /^(더\s*보기|더보기|Show more|Load more|もっと見る|顯示更多|显示更多)/i;
            for (let round = 0; round < 40; round++) {
              const buttons = page.locator('button');
              const count = await buttons.count();
              let clicked = 0;
              for (let i = 0; i < count; i++) {
                const button = buttons.nth(i);
                let text = '';
                try { text = normalize(await button.innerText()); } catch (_) { continue; }
                if (!morePattern.test(text)) continue;
                try {
                  if (await button.isVisible()) {
                    await button.click({ timeout: 2500 });
                    clicked += 1;
                    await page.waitForTimeout(180);
                  }
                } catch (_) {}
              }
              if (!clicked) break;
              await deepScroll();
            }
          }

          async function expandContentAccordions() {
            const skip = new Set([
              '전체','이지','노말','하드','아르카나','여정 이벤트','리세트','토벌','아가논','플로라','칼라이드','날씨',
              '한국어','English','日本語','繁體中文','简体中文',
              'All','Easy','Normal','Hard','Arcana','Journey Events'
            ]);
            for (let round = 0; round < 8; round++) {
              const collapsed = page.locator('button[aria-expanded="false"]');
              const count = await collapsed.count();
              let clicked = 0;
              for (let i = 0; i < count; i++) {
                const button = collapsed.nth(i);
                let text = '';
                try { text = normalize(await button.innerText()); } catch (_) { continue; }
                if (skip.has(text) || text.length > 120) continue;
                try {
                  if (await button.isVisible()) {
                    await button.click({ timeout: 2000 });
                    clicked += 1;
                    await page.waitForTimeout(80);
                  }
                } catch (_) {}
              }
              if (!clicked) break;
            }
          }

          // The source site changes tab labels between locales.  Record the actual
          // clickable DOM path from the first (Korean) capture and reuse that same
          // structural position for every other language.  Text matching remains a
          // fallback for future source-layout changes.
          const journeyTabFallbackPaths = { arcana: null, events: null };

          const JOURNEY_TAB_PATTERNS = {
            arcana: [
              /^아르카나(?:\s|$)/i,
              /^arcana(?:\s|$)/i,
              /^アルカナ(?:\s|$)/i,
              /^阿爾克那(?:\s|$)/i,
              /^阿尔克那(?:\s|$)/i,
              /아르카나/i,
              /arcana/i,
              /アルカナ/i,
              /阿爾克那/i,
              /阿尔克那/i
            ],
            events: [
              /여정\s*이벤트/i,
              /journey\s*events?/i,
              /旅程\s*イベント/i,
              /旅程\s*事件/i,
              /여정.*이벤트/i,
              /event/i
            ]
          };

          async function journeyControlDiagnostics() {
            return await page.evaluate(() => {
              const norm = (value) => String(value || '').replace(/\u00a0/g, ' ').replace(/\s+/g, ' ').trim();
              const selector = [
                '[role="tab"]',
                'button',
                'a',
                '[role="button"]',
                'label',
                '[aria-selected]',
                '[aria-controls]',
                '[data-state]',
                '[data-value]',
                'div',
                'span'
              ].join(',');
              const seen = new Set();
              const items = [];
              for (const element of document.querySelectorAll(selector)) {
                if (!(element instanceof HTMLElement)) continue;
                const rect = element.getBoundingClientRect();
                const style = getComputedStyle(element);
                const visible = rect.width > 0 && rect.height > 0 && style.visibility !== 'hidden' && style.display !== 'none';
                if (!visible) continue;
                const text = norm(element.innerText || element.textContent);
                const aria = norm(element.getAttribute('aria-label'));
                const title = norm(element.getAttribute('title'));
                const value = norm(element.getAttribute('data-value'));
                const key = [element.tagName, element.getAttribute('role') || '', text, aria, title, value].join('|');
                if (seen.has(key)) continue;
                seen.add(key);
                items.push({
                  tag: element.tagName.toLowerCase(),
                  role: element.getAttribute('role') || '',
                  text: text.slice(0, 120),
                  aria: aria.slice(0, 120),
                  title: title.slice(0, 120),
                  value: value.slice(0, 120),
                  selected: element.getAttribute('aria-selected'),
                  state: element.getAttribute('data-state')
                });
              }
              return items.slice(0, 120);
            });
          }

          async function clickJourneyTab(kind) {
            const patterns = JOURNEY_TAB_PATTERNS[kind];
            if (!patterns) throw new Error(`Unknown Journey tab kind: ${kind}`);

            async function settleAfterTabClick() {
              await page.waitForTimeout(750);
              try { await page.waitForLoadState('networkidle', { timeout: 6000 }); } catch (_) {}
              await expandMoreButtons();
              await expandContentAccordions();
              await deepScroll();
            }

            // After the Korean pass we know the exact clickable node for each tab.
            // Reusing its child-index path is locale independent, unlike translated text.
            const fallbackPath = journeyTabFallbackPaths[kind];
            if (Array.isArray(fallbackPath) && fallbackPath.length) {
              const fallback = await page.evaluate((domPath) => {
                const norm = (value) => String(value || '').replace(/\u00a0/g, ' ').replace(/\s+/g, ' ').trim();
                let element = document.body;
                for (const childIndex of domPath) {
                  if (!element || !element.children || !element.children[childIndex]) {
                    return { clicked: false, reason: 'path-missing' };
                  }
                  element = element.children[childIndex];
                }
                if (!(element instanceof HTMLElement)) return { clicked: false, reason: 'not-html-element' };
                const clickable = element.closest('button,a,[role="tab"],[role="button"],label') || element;
                const rect = clickable.getBoundingClientRect();
                const style = getComputedStyle(clickable);
                if (!(rect.width > 0 && rect.height > 0) || style.visibility === 'hidden' || style.display === 'none') {
                  return { clicked: false, reason: 'not-visible' };
                }
                clickable.scrollIntoView({ block: 'center', inline: 'nearest' });
                clickable.click();
                return {
                  clicked: true,
                  tag: clickable.tagName.toLowerCase(),
                  role: clickable.getAttribute('role') || '',
                  text: norm(clickable.innerText || clickable.textContent).slice(0, 120),
                  aria: norm(clickable.getAttribute('aria-label')).slice(0, 120),
                  selected: clickable.getAttribute('aria-selected'),
                  state: clickable.getAttribute('data-state')
                };
              }, fallbackPath);

              if (fallback.clicked) {
                console.log(`Journey ${kind} tab via saved DOM path: ${JSON.stringify(fallback)}`);
                await settleAfterTabClick();
                return;
              }
              console.warn(`Saved Journey ${kind} tab path failed (${fallback.reason}); falling back to label/structure detection.`);
            }

            const patternSources = patterns.map((pattern) => ({ source: pattern.source, flags: pattern.flags }));
            const result = await page.evaluate(({ kind, patternSources }) => {
              const norm = (value) => String(value || '').replace(/\u00a0/g, ' ').replace(/\s+/g, ' ').trim();
              const patterns = patternSources.map((item) => new RegExp(item.source, item.flags));
              const selector = [
                '[role="tab"]',
                'button',
                'a',
                '[role="button"]',
                'label',
                '[aria-selected]',
                '[aria-controls]',
                '[data-state]',
                '[data-value]',
                'div',
                'span'
              ].join(',');

              function domPathFromBody(element) {
                const parts = [];
                let node = element;
                while (node && node !== document.body) {
                  const parent = node.parentElement;
                  if (!parent) return null;
                  const index = Array.prototype.indexOf.call(parent.children, node);
                  if (index < 0) return null;
                  parts.unshift(index);
                  node = parent;
                }
                return node === document.body ? parts : null;
              }

              const byClickable = new Map();
              for (const element of document.querySelectorAll(selector)) {
                if (!(element instanceof HTMLElement)) continue;
                const clickable = element.closest('button,a,[role="tab"],[role="button"],label') || element;
                if (!(clickable instanceof HTMLElement)) continue;
                const rect = clickable.getBoundingClientRect();
                const style = getComputedStyle(clickable);
                if (!(rect.width > 0 && rect.height > 0) || style.visibility === 'hidden' || style.display === 'none') continue;

                const ownText = norm(element.innerText || element.textContent);
                const ownAria = norm(element.getAttribute('aria-label'));
                const ownTitle = norm(element.getAttribute('title'));
                const ownValue = norm(element.getAttribute('data-value'));
                const clickText = norm(clickable.innerText || clickable.textContent);
                const clickAria = norm(clickable.getAttribute('aria-label'));
                const clickTitle = norm(clickable.getAttribute('title'));
                const clickValue = norm(clickable.getAttribute('data-value'));
                const combined = [ownText, ownAria, ownTitle, ownValue, clickText, clickAria, clickTitle, clickValue]
                  .filter(Boolean).join(' | ');
                if (!combined || !patterns.some((pattern) => pattern.test(combined))) continue;

                let score = 0;
                const role = clickable.getAttribute('role') || '';
                if (role === 'tab') score += 120;
                if (clickable.tagName === 'BUTTON') score += 80;
                if (clickable.hasAttribute('aria-selected')) score += 55;
                if (clickable.hasAttribute('aria-controls')) score += 35;
                if (clickable.closest('[role="tablist"]')) score += 100;
                if (clickable.closest('nav')) score += 20;
                if (combined.length <= 60) score += 20;

                const label = clickText || clickAria || clickValue || ownText || ownAria || ownValue;
                const exactish = kind === 'arcana'
                  ? /^(아르카나|arcana|アルカナ|阿爾克那|阿尔克那)$/i.test(label)
                  : /^(여정\s*이벤트|journey\s*events?|旅程\s*イベント|旅程\s*事件)$/i.test(label);
                if (exactish) score += 250;

                const previous = byClickable.get(clickable);
                if (!previous || score > previous.score) {
                  byClickable.set(clickable, {
                    element: clickable, score, text: clickText || ownText, aria: clickAria || ownAria,
                    title: clickTitle || ownTitle, value: clickValue || ownValue, role,
                    tag: clickable.tagName.toLowerCase(), domPath: domPathFromBody(clickable)
                  });
                }
              }

              const candidates = [...byClickable.values()];
              candidates.sort((a, b) => b.score - a.score || (a.text.length - b.text.length));
              const hit = candidates[0];
              if (!hit) return { clicked: false, kind, candidates: [] };

              hit.element.scrollIntoView({ block: 'center', inline: 'nearest' });
              hit.element.click();
              return {
                clicked: true,
                kind,
                score: hit.score,
                text: hit.text,
                aria: hit.aria,
                title: hit.title,
                value: hit.value,
                role: hit.role,
                tag: hit.tag,
                domPath: hit.domPath,
                candidateCount: candidates.length
              };
            }, { kind, patternSources });

            if (!result.clicked) {
              const diagnostics = await journeyControlDiagnostics();
              throw new Error(`Could not identify Journey ${kind} tab. Visible controls: ${JSON.stringify(diagnostics)}`);
            }

            if (!journeyTabFallbackPaths[kind] && Array.isArray(result.domPath) && result.domPath.length) {
              journeyTabFallbackPaths[kind] = result.domPath;
              console.log(`Saved Journey ${kind} tab DOM path for locale-independent reuse: ${JSON.stringify(result.domPath)}`);
            }

            console.log(`Journey ${kind} tab: ${JSON.stringify(result)}`);
            await settleAfterTabClick();
          }

          async function selectLanguage(label) {
            if (label === '한국어') return true;

            const selects = page.locator('select');
            for (let i = 0; i < await selects.count(); i++) {
              const select = selects.nth(i);
              const options = await select.locator('option').evaluateAll((nodes) => nodes.map((node) => ({ value: node.value, text: (node.textContent || '').trim() })));
              const option = options.find((item) => item.text === label);
              if (!option) continue;
              await select.selectOption(option.value);
              await page.waitForTimeout(800);
              return true;
            }

            // Custom language menu fallback.
            const triggerCandidates = page.getByText(/한국어|English|日本語|繁體中文|简体中文/, { exact: true });
            const triggerCount = await triggerCandidates.count();
            for (let i = 0; i < triggerCount; i++) {
              try {
                const el = triggerCandidates.nth(i);
                if (!await el.isVisible()) continue;
                await el.click();
                await page.waitForTimeout(250);
                const target = page.getByText(label, { exact: true });
                const targetCount = await target.count();
                for (let j = 0; j < targetCount; j++) {
                  if (await target.nth(j).isVisible()) {
                    await target.nth(j).click();
                    await page.waitForTimeout(800);
                    return true;
                  }
                }
              } catch (_) {}
            }
            return false;
          }

          function replaceSerializedUrl(html, remoteUrl, localUrl) {
            if (!remoteUrl) return html;
            let next = html.split(remoteUrl).join(localUrl);
            // outerHTML serializes query-string ampersands as &amp;. Replace that form too.
            const escaped = remoteUrl.replaceAll('&', '&amp;');
            if (escaped !== remoteUrl) next = next.split(escaped).join(localUrl);
            return next;
          }

          async function localizeImagesInFragment(snapshot) {
            for (const image of snapshot.images) {
              const remote = image.currentSrc || image.src;
              if (!remote || !/^https?:\/\//i.test(remote)) continue;
              if (image.token && !snapshot.html.includes(image.token)) continue;
              const local = await downloadAsset(remote, image.alt || image.nearby || 'journey-image');
              // Every cloned <img> gets a stable token before serialization, so encoded query strings
              // cannot leave a remote URL behind in the static archive.
              if (image.token) snapshot.html = snapshot.html.split(image.token).join(local);
              snapshot.html = replaceSerializedUrl(snapshot.html, image.src, local);
              snapshot.html = replaceSerializedUrl(snapshot.html, image.currentSrc, local);
            }
            for (const background of snapshot.backgrounds || []) {
              if (!background.url || !/^https?:\/\//i.test(background.url)) continue;
              const escapedBackground = background.url.replaceAll('&', '&amp;');
              if (!snapshot.html.includes(background.url) && !snapshot.html.includes(escapedBackground)) continue;
              const local = await downloadAsset(background.url, background.nearby || 'journey-background');
              snapshot.html = replaceSerializedUrl(snapshot.html, background.url, local);
            }
            return snapshot;
          }

          const SOURCE_FILTER_ALIASES = {
            category: {
              reset: ['리세트','Reset','リセット','重置'],
              raid: ['토벌','Raid','討伐'],
              aganon: ['아가논','Aganon','アガノン','阿加農','阿加农'],
              flora: ['플로라','Flora','フローラ','芙蘿拉','芙萝拉'],
              kalaid: ['칼라이드','Kalaid','カライド','卡萊德','卡莱德'],
              weather: ['날씨','Weather','天気','天氣','天气']
            },
            difficulty: {
              easy: ['이지','Easy','イージー','簡單','简单'],
              normal: ['노말','Normal','ノーマル','普通'],
              hard: ['하드','Hard','ハード','困難','困难']
            },
            difficultyTrigger: ['난이도','Difficulty','難易度','難度','难度']
          };

          async function clickVisibleExact(labels) {
            const result = await page.evaluate((labels) => {
              const norm = (value) => String(value || '').replace(/\u00a0/g, ' ').replace(/\s+/g, ' ').trim().toLocaleLowerCase();
              const wanted = new Set(labels.map(norm));
              const candidates = [];
              const selector = 'button,[role="button"],[role="option"],summary,label,a,div,span';
              for (const element of document.querySelectorAll(selector)) {
                if (!(element instanceof HTMLElement)) continue;
                const text = norm(element.innerText || element.textContent);
                if (!wanted.has(text)) continue;
                const clickable = element.closest('button,[role="button"],[role="option"],summary,label,a') || element;
                if (!(clickable instanceof HTMLElement)) continue;
                const rect = clickable.getBoundingClientRect();
                const style = getComputedStyle(clickable);
                if (!(rect.width > 0 && rect.height > 0) || style.display === 'none' || style.visibility === 'hidden') continue;
                let score = 0;
                if (clickable.tagName === 'BUTTON') score += 80;
                if (clickable.getAttribute('role') === 'option') score += 70;
                if (clickable.getAttribute('role') === 'button') score += 60;
                if (clickable.tagName === 'SUMMARY') score += 50;
                score -= Math.min((clickable.innerText || '').length, 100);
                candidates.push({ element: clickable, score, text });
              }
              candidates.sort((a,b) => b.score - a.score);
              const hit = candidates[0];
              if (!hit) return { clicked:false, labels };
              hit.element.scrollIntoView({ block:'center', inline:'nearest' });
              hit.element.click();
              return { clicked:true, text:hit.text, count:candidates.length };
            }, labels);
            if (result.clicked) {
              await page.waitForTimeout(500);
              try { await page.waitForLoadState('networkidle', { timeout: 5000 }); } catch (_) {}
              await deepScroll();
            }
            return result;
          }

          async function setSourceCategory(key) {
            const aliases = SOURCE_FILTER_ALIASES.category[key] || [];
            if (!aliases.length) return false;
            const result = await clickVisibleExact(aliases);
            if (!result.clicked) console.warn(`Could not click source category ${key}: ${JSON.stringify(result)}`);
            return result.clicked;
          }

          async function setSourceDifficulty(key) {
            const aliases = SOURCE_FILTER_ALIASES.difficulty[key] || [];
            if (!aliases.length) return false;

            // Native select first.
            const selectResult = await page.evaluate(({ aliases, triggerAliases }) => {
              const norm = (value) => String(value || '').replace(/\u00a0/g, ' ').replace(/\s+/g, ' ').trim().toLocaleLowerCase();
              const wanted = new Set(aliases.map(norm));
              const triggerWanted = new Set(triggerAliases.map(norm));
              for (const select of document.querySelectorAll('select')) {
                const options = [...select.options];
                const hit = options.find((option) => wanted.has(norm(option.textContent)));
                if (!hit) continue;
                const near = norm(select.getAttribute('aria-label')) + ' ' + norm(select.closest('label,div')?.innerText);
                if (triggerWanted.size && ![...triggerWanted].some((token) => near.includes(token)) && options.length > 8) continue;
                select.value = hit.value;
                select.dispatchEvent(new Event('input', { bubbles:true }));
                select.dispatchEvent(new Event('change', { bubbles:true }));
                return { changed:true, value:hit.value };
              }
              return { changed:false };
            }, { aliases, triggerAliases: SOURCE_FILTER_ALIASES.difficultyTrigger });
            if (selectResult.changed) {
              await page.waitForTimeout(650);
              await deepScroll();
              return true;
            }

            // Custom popover/menu: open difficulty trigger, then select exact option.
            await clickVisibleExact(SOURCE_FILTER_ALIASES.difficultyTrigger);
            await page.waitForTimeout(150);
            const option = await clickVisibleExact(aliases);
            if (!option.clicked) console.warn(`Could not click source difficulty ${key}: ${JSON.stringify(option)}`);
            return option.clicked;
          }

          async function captureCurrentMain({ localize = true } = {}) {
            const snapshot = await page.evaluate(() => {
              const root = document.querySelector('main') || document.querySelector('[role="main"]') || document.body;
              const clone = root.cloneNode(true);
              const sourceElements = [root, ...root.querySelectorAll('*')];
              const cloneElements = [clone, ...clone.querySelectorAll('*')];

              const normText = (value) => String(value || '').replace(/\u00a0/g, ' ').replace(/\s+/g, ' ').trim();
              const hashText = (value) => {
                const text = normText(value);
                let h = 2166136261;
                for (let i = 0; i < text.length; i++) {
                  h ^= text.charCodeAt(i);
                  h = Math.imul(h, 16777619);
                }
                return `j${(h >>> 0).toString(36)}`;
              };

              // Preserve visual information needed by individual cards, but do not carry desktop page geometry into mobile.
              for (let i = 0; i < Math.min(sourceElements.length, cloneElements.length); i++) {
                const source = sourceElements[i];
                const target = cloneElements[i];
                if (!(source instanceof Element) || !(target instanceof Element)) continue;
                const style = getComputedStyle(source);
                const rect = source.getBoundingClientRect();
                const compact = rect.width > 0 && rect.height > 0 && rect.width <= 180 && rect.height <= 180;
                const keep = [
                  'display','visibility','opacity','flex-direction','flex-wrap','align-items','justify-content','gap','grid-template-columns','grid-auto-flow',
                  'margin-top','margin-right','margin-bottom','margin-left','padding-top','padding-right','padding-bottom','padding-left',
                  'border-top-width','border-right-width','border-bottom-width','border-left-width','border-style','border-color','border-radius',
                  'background-color','background-image','background-size','background-position','background-repeat',
                  'color','font-size','font-weight','line-height','letter-spacing','text-align','white-space','overflow-wrap','word-break','object-fit'
                ];
                if (compact) keep.push('position','width','height','max-width','max-height','overflow','inset','z-index','aspect-ratio');
                const pieces = [];
                for (const prop of keep) {
                  const value = style.getPropertyValue(prop);
                  if (value && value !== 'normal' && value !== 'auto' && (prop === 'display' || value !== 'none') && value !== '0px') pieces.push(`${prop}:${value}`);
                }
                if (pieces.length) target.setAttribute('style', pieces.join(';'));
              }

              clone.querySelectorAll('script,noscript,iframe,source').forEach((el) => el.remove());

              // Resolve images against the live page and remember the source-rendered size.
              const trackerHosts = new Set(['myhits.vercel.app', 'hits.seeyoufarm.com']);
              const images = [];
              const sourceImages = [...root.querySelectorAll('img')];
              const cloneImages = [...clone.querySelectorAll('img')];
              for (let i = 0; i < Math.min(sourceImages.length, cloneImages.length); i++) {
                const sourceImg = sourceImages[i];
                const cloneImg = cloneImages[i];
                let src = '';
                try {
                  const raw = sourceImg.getAttribute('src') || '';
                  if (raw) src = new URL(raw, location.href).href;
                } catch (_) {}
                const currentSrc = sourceImg.currentSrc || '';
                let hostname = '';
                try { hostname = new URL(currentSrc || src).hostname; } catch (_) {}
                if (trackerHosts.has(hostname)) {
                  cloneImg.remove();
                  continue;
                }
                const nearby = sourceImg.closest('article,section,li,div')?.innerText || '';
                const token = `__JOURNEY_LOCAL_IMAGE_${i}__`;
                const rect = sourceImg.getBoundingClientRect();
                const renderedWidth = Math.max(18, Math.min(96, Math.round(rect.width || 48)));
                cloneImg.setAttribute('src', token);
                cloneImg.removeAttribute('srcset');
                cloneImg.removeAttribute('sizes');
                cloneImg.removeAttribute('loading');
                cloneImg.setAttribute('data-journey-image', '1');
                cloneImg.style.setProperty('--journey-img-width', `${renderedWidth}px`);
                cloneImg.style.maxWidth = '96px';
                cloneImg.style.height = 'auto';
                images.push({
                  token,
                  src,
                  currentSrc,
                  alt: (sourceImg.getAttribute('alt') || '').trim(),
                  nearby: nearby.replace(/\s+/g, ' ').trim().slice(0, 80)
                });
              }

              const sourceMenuTokens = [
                '가챠 시뮬레이터','여정 아이템','몬스터 정보','잠재력','월페이퍼','구원자 시뮬레이터',
                'Gacha Simulator','Journey Items','Monster Info','Potential','Wallpaper','Savior Simulator',
                'ガチャシミュレーター','旅程アイテム','モンスター情報','潜在力','壁紙','救援者シミュレーター',
                '抽卡模擬器','旅程道具','怪物資訊','潛力','桌布','救援者模擬器',
                '抽卡模拟器','旅程道具','怪物信息','潜力','壁纸','救援者模拟器'
              ];
              const sourceFilterTokens = [
                '난이도','아르카나','여정 이벤트','전체','리세트','토벌','아가논','플로라','칼라이드','날씨','성공 보상','실패 보상',
                'Difficulty','Arcana','Journey Events','All','Reset','Raid','Aganon','Flora','Kalaid','Weather','Success Reward','Failure Reward'
              ];

              function tokenHits(text, tokens) {
                return tokens.reduce((count, token) => count + (text.includes(token) ? 1 : 0), 0);
              }

              function removeCompactCluster(tokens, minHits, maxTextLength) {
                const candidates = [...clone.querySelectorAll('header,nav,aside,section,div,form')]
                  .map((el) => {
                    const text = normText(el.innerText || el.textContent);
                    return { el, text, hits: tokenHits(text, tokens) };
                  })
                  .filter((item) => item.hits >= minHits && item.text.length <= maxTextLength)
                  .sort((a, b) => a.text.length - b.text.length);
                for (const item of candidates) if (item.el.isConnected) item.el.remove();
              }

              clone.querySelectorAll('header,nav,aside,[role="navigation"],[role="menu"],[role="menubar"]').forEach((el) => {
                const text = normText(el.innerText || el.textContent);
                if (tokenHits(text, sourceMenuTokens) >= 1 || /Change Theme|메뉴|Menu|メニュー/.test(text)) el.remove();
              });
              removeCompactCluster(sourceMenuTokens, 2, 1800);

              // A search input uniquely identifies the source filter block. Remove its largest compact ancestor.
              for (const control of [...clone.querySelectorAll('input,select,textarea')]) {
                let node = control;
                let best = null;
                for (let depth = 0; depth < 8 && node && node !== clone; depth++, node = node.parentElement) {
                  const text = normText(node.innerText || node.textContent);
                  const hits = tokenHits(text, sourceFilterTokens);
                  if (hits >= 3 && text.length <= 1400) best = node;
                  if (text.length > 1800) break;
                }
                if (best?.isConnected) best.remove();
              }
              removeCompactCluster(sourceFilterTokens, 4, 1600);

              // Remove source page interaction from the card clone without deleting choice text blocks.
              clone.querySelectorAll('a[href]').forEach((a) => { a.removeAttribute('href'); a.removeAttribute('target'); });
              clone.querySelectorAll('*').forEach((el) => {
                for (const attr of [...el.attributes]) if (/^on/i.test(attr.name)) el.removeAttribute(attr.name);
              });

              // Keep small absolute-position icon composites intact; normalize only page-sized positioning.
              clone.querySelectorAll('*').forEach((el) => {
                const style = el.style;
                if (!style) return;
                const width = parseFloat(style.width || '0');
                const height = parseFloat(style.height || '0');
                const compact = width > 0 && height > 0 && width <= 180 && height <= 180;
                if (style.position === 'fixed' || style.position === 'sticky' || (style.position === 'absolute' && !compact)) {
                  style.position = 'static';
                  style.inset = '';
                  style.left = '';
                  style.right = '';
                  style.top = '';
                  style.bottom = '';
                  style.transform = '';
                }
                style.boxSizing = 'border-box';
                if (!compact) {
                  style.maxWidth = '100%';
                  if (style.width && /px$/.test(style.width) && parseFloat(style.width) > 900) style.width = '100%';
                  if (style.minWidth && /px$/.test(style.minWidth)) style.minWidth = '0';
                }
              });

              function entrySignature(node) {
                const classes = [...node.classList].filter(Boolean).slice(0, 4).sort().join('.');
                return `${node.tagName}|${classes}`;
              }

              function discoverEntries(container) {
                let best = null;
                const parents = [container, ...container.querySelectorAll('main,section,div,ul,ol')];
                for (const parent of parents) {
                  const direct = [...parent.children].filter((child) => {
                    const text = normText(child.innerText || child.textContent);
                    if (text.length < 45) return false;
                    const style = child.style;
                    return !child.hidden && style.display !== 'none' && style.visibility !== 'hidden' && style.opacity !== '0';
                  });
                  if (direct.length < 2) continue;
                  const groups = new Map();
                  for (const child of direct) {
                    const sig = entrySignature(child);
                    if (!groups.has(sig)) groups.set(sig, []);
                    groups.get(sig).push(child);
                  }
                  for (const group of groups.values()) {
                    if (group.length < 2) continue;
                    const lengths = group.map((child) => normText(child.innerText || child.textContent).length);
                    const avg = lengths.reduce((a,b) => a+b, 0) / lengths.length;
                    if (avg < 55) continue;
                    const score = group.length * 10000 + Math.min(avg, 1200) * 20 - Math.max(0, direct.length - group.length) * 80;
                    if (!best || score > best.score) best = { parent, entries: group, score };
                  }
                }
                if (best) return best;

                const articles = [...container.querySelectorAll('article')].filter((node) => normText(node.innerText || node.textContent).length >= 45);
                if (articles.length) return { parent: container, entries: articles, score: 1 };
                const children = [...container.children].filter((node) => normText(node.innerText || node.textContent).length >= 45);
                return { parent: container, entries: children, score: 0 };
              }

              const detected = discoverEntries(clone);
              const clean = document.createElement('div');
              clean.className = 'journey-captured-list';
              const entryKeys = [];
              detected.entries.forEach((entry, index) => {
                const copy = entry.cloneNode(true);
                const text = normText(copy.innerText || copy.textContent);
                const key = hashText(text + '|' + [...copy.querySelectorAll('img')].map((img) => img.getAttribute('alt') || '').join('|'));
                copy.setAttribute('data-journey-entry', '1');
                copy.setAttribute('data-journey-index', String(index));
                copy.setAttribute('data-journey-key', key);
                entryKeys.push(key);
                clean.appendChild(copy);
              });

              const backgrounds = [];
              const seenBackgrounds = new Set();
              for (const element of sourceElements) {
                if (!(element instanceof Element)) continue;
                const value = getComputedStyle(element).backgroundImage || '';
                for (const match of value.matchAll(/url\(["']?([^"')]+)["']?\)/g)) {
                  let resolved = '';
                  try { resolved = new URL(match[1], location.href).href; } catch (_) {}
                  if (!resolved || seenBackgrounds.has(resolved)) continue;
                  seenBackgrounds.add(resolved);
                  backgrounds.push({ url: resolved, nearby: (element.innerText || '').replace(/\s+/g, ' ').trim().slice(0, 80) });
                }
              }

              return {
                html: clean.outerHTML,
                text: (root.innerText || '').replace(/\u00a0/g, ' ').replace(/\s+/g, ' ').trim(),
                images,
                backgrounds,
                entryKeys,
                entryCount: entryKeys.length
              };
            });

            if (!localize) return snapshot;
            return localizeImagesInFragment(snapshot);
          }

          function indicesForKeys(defaultKeys, filteredKeys) {
            const set = new Set(filteredKeys || []);
            const indices = [];
            defaultKeys.forEach((key, index) => { if (set.has(key)) indices.push(index); });
            return indices;
          }

          async function captureKoreanFilterMembership(defaultArcana, defaultEvents) {
            const membership = {
              category: {},
              difficulty: { arcana: {}, events: {} }
            };

            for (const key of Object.keys(SOURCE_FILTER_ALIASES.category)) {
              await page.goto(SOURCE_URL, { waitUntil:'domcontentloaded', timeout:60000 });
              await waitForJourneyReady();
              await clickJourneyTab('events');
              if (!await setSourceCategory(key)) throw new Error(`Could not classify Journey category ${key} from source.`);
              const filtered = await captureCurrentMain({ localize:false });
              const indices = indicesForKeys(defaultEvents.entryKeys, filtered.entryKeys);
              if (!indices.length || indices.length >= defaultEvents.entryKeys.length) {
                throw new Error(`Journey category ${key} classification was invalid (${indices.length}/${defaultEvents.entryKeys.length}).`);
              }
              membership.category[key] = indices;
              console.log(`Journey category ${key}: ${indices.length} entries`);
            }

            for (const key of Object.keys(SOURCE_FILTER_ALIASES.difficulty)) {
              for (const kind of ['arcana','events']) {
                await page.goto(SOURCE_URL, { waitUntil:'domcontentloaded', timeout:60000 });
                await waitForJourneyReady();
                await clickJourneyTab(kind);
                if (!await setSourceDifficulty(key)) throw new Error(`Could not classify Journey ${kind} difficulty ${key} from source.`);
                const filtered = await captureCurrentMain({ localize:false });
                const defaults = kind === 'arcana' ? defaultArcana : defaultEvents;
                const indices = indicesForKeys(defaults.entryKeys, filtered.entryKeys);
                if (!indices.length) throw new Error(`Journey ${kind} difficulty ${key} classification returned no entries.`);
                membership.difficulty[kind][key] = indices;
                console.log(`Journey ${kind} difficulty ${key}: ${indices.length} entries`);
              }
            }
            return membership;
          }

          function archivePage(language, arcanaSnapshot, eventSnapshot, capturedAt, filterMembership) {
            const labels = {
              ko: {
                title:'여정', arcana:'아르카나', events:'여정 이벤트', difficulty:'난이도', all:'전체', easy:'이지', normal:'노말', hard:'하드',
                search:'카드 명, 이벤트 명, 보상 등...', reset:'리세트', raid:'토벌', aganon:'아가논', flora:'플로라', kalaid:'칼라이드', weather:'날씨',
                success:'성공 보상', failure:'실패 보상', empty:'검색 결과가 없습니다.'
              },
              en: {
                title:'Journey', arcana:'Arcana', events:'Journey Events', difficulty:'Difficulty', all:'All', easy:'Easy', normal:'Normal', hard:'Hard',
                search:'Card name, event name, rewards...', reset:'Reset', raid:'Raid', aganon:'Aganon', flora:'Flora', kalaid:'Kalaid', weather:'Weather',
                success:'Success Reward', failure:'Failure Reward', empty:'No matching results.'
              },
              ja: {
                title:'旅程', arcana:'アルカナ', events:'旅程イベント', difficulty:'難易度', all:'すべて', easy:'イージー', normal:'ノーマル', hard:'ハード',
                search:'カード名・イベント名・報酬など...', reset:'リセット', raid:'討伐', aganon:'アガノン', flora:'フローラ', kalaid:'カライド', weather:'天気',
                success:'成功報酬', failure:'失敗報酬', empty:'検索結果がありません。'
              },
              'zh-TW': {
                title:'旅程', arcana:'阿爾克那', events:'旅程事件', difficulty:'難度', all:'全部', easy:'簡單', normal:'普通', hard:'困難',
                search:'卡片名稱、事件名稱、獎勵等...', reset:'重置', raid:'討伐', aganon:'阿加農', flora:'芙蘿拉', kalaid:'卡萊德', weather:'天氣',
                success:'成功獎勵', failure:'失敗獎勵', empty:'找不到符合的結果。'
              },
              'zh-CN': {
                title:'旅程', arcana:'阿尔克那', events:'旅程事件', difficulty:'难度', all:'全部', easy:'简单', normal:'普通', hard:'困难',
                search:'卡片名称、事件名称、奖励等...', reset:'重置', raid:'讨伐', aganon:'阿加农', flora:'芙萝拉', kalaid:'卡莱德', weather:'天气',
                success:'成功奖励', failure:'失败奖励', empty:'没有匹配的结果。'
              }
            }[language.key];

            const categories = [
              ['all', labels.all], ['reset', labels.reset], ['raid', labels.raid], ['aganon', labels.aganon],
              ['flora', labels.flora], ['kalaid', labels.kalaid], ['weather', labels.weather]
