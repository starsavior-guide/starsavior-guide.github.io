            await prepareJourneyMode('events', language);
            await expandAll();
            const events = await captureStructured('events');
          
            if (arcana.entries.length < 5) throw new Error(`Arcana Journey extraction too small for ${language.key}: ${arcana.entries.length}`);
            if (events.entries.length < 20) throw new Error(`Journey event extraction too small for ${language.key}: ${events.entries.length}`);
            if (language.key === 'ko') {
              const body = events.bodyText;
              for (const token of ['훈련의 방향성','리세트의 일과','오늘의 날씨','두통이 생기다']) {
                if (!body.includes(token)) throw new Error(`Journey source missing expected event: ${token}`);
              }
            }
            captures[language.key] = { arcana, events };
            console.log(`${language.key}: arcana=${arcana.entries.length}, events=${events.entries.length}`);
          }

          // Do not assume translated DOMs have identical counts/order. Classify each language independently.
          for (const language of LANGUAGES) {
            categoryMembership[language.key] = await captureCategoryMembership(captures[language.key].events, language);
          }
          
          for (const language of LANGUAGES) {
            const snapshot = captures[language.key];
            const membership = categoryMembership[language.key];
            snapshot.events.entries.forEach((entry, index) => {
              entry.categories = Object.entries(membership).filter(([, indices]) => indices.includes(index)).map(([key]) => key);
              entry.kind = 'events';
            });
            snapshot.arcana.entries.forEach((entry) => {
              entry.categories = [];
              entry.kind = 'arcana';
            });
            const langDir = path.join(OUT_DIR, language.key);
            fs.mkdirSync(langDir, { recursive: true });
            fs.writeFileSync(path.join(langDir, 'journey.json'), JSON.stringify({
              version: 2,
              language: language.key,
              arcana: snapshot.arcana.entries,
              events: snapshot.events.entries
            }, null, 2), 'utf8');
          }
          
          await browser.close();
          
          const meta = {
            capturedAt: new Date().toISOString(),
            source: SOURCE_URL,
            mode: 'structured-local-json',
            sourceRequiredAtRuntime: false,
            languages: LANGUAGES.map((item)=>item.key),
            localAssetCount: fs.readdirSync(ASSET_DIR).filter((name)=>fs.statSync(path.join(ASSET_DIR,name)).isFile()).length,
            counts: Object.fromEntries(LANGUAGES.map((language) => [language.key, {
              arcana: captures[language.key].arcana.entries.length,
              events: captures[language.key].events.entries.length
            }])),
            categories: Object.fromEntries(LANGUAGES.map((language) => [language.key,
