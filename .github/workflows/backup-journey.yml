name: Backup Arcana events (Journey frozen)

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/backup-journey.yml"
      - "scripts/backup-arcana-events.mjs"

permissions:
  contents: write

jobs:
  backup-arcana-events:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Validate backup script
        run: node --check scripts/backup-arcana-events.mjs

      - name: Refresh Arcana events from the source DB
        run: node scripts/backup-arcana-events.mjs

      - name: Validate generated changes
        run: git diff --check

      - name: Commit Arcana-only refresh
        shell: bash
        run: |
          git add data/journey data/journey-assets
          if git diff --cached --quiet; then
            echo "No Arcana changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: refresh Arcana events from source DB"
          git push
