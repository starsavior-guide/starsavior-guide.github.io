                candidates.push({ clickable, score, text });
              }
              candidates.sort((a,b) => b.score - a.score);
              const hit = candidates[0];
              if (!hit) return { clicked: false };
              hit.clickable.scrollIntoView({ block: 'center' });
              hit.clickable.click();
              return { clicked: true, path: makePath(hit.clickable), via: 'search', text: hit.text };
            }, { aliases, savedPath });

            if (result.clicked && !savedCategoryPaths[category] && Array.isArray(result.path)) {
              savedCategoryPaths[category] = result.path;
            }
            if (result.clicked) {
              await page.waitForTimeout(500);
              await deepScroll();
            }
            return result;
          }

          async function captureCategoryMembership(defaultEvents, language) {
            const result = {};
            for (const [category, aliases] of Object.entries(CATEGORY_ALIASES)) {
              await prepareJourneyMode('events', language);
              const categoryClick = await clickJourneyCategory(category, aliases);
              if (!categoryClick.clicked) {
                const controls = await page.evaluate(() => [...document.querySelectorAll('button,[role="button"],label,a')]
                  .filter((el) => {
                    const r = el.getBoundingClientRect();
                    const s = getComputedStyle(el);
                    return r.width > 0 && r.height > 0 && s.display !== 'none' && s.visibility !== 'hidden';
                  })
                  .map((el) => String(el.innerText || el.textContent || '').replace(/\s+/g,' ').trim())
                  .filter(Boolean)
                  .slice(0,100));
                throw new Error(`Could not click source Journey category ${category} for ${language.key}. Visible controls: ${JSON.stringify(controls)}`);
              }
              console.log(`${language.key} category ${category}: clicked via ${categoryClick.via}${categoryClick.text ? ` (${categoryClick.text})` : ''}`);
              await expandAll();
              const filtered = await captureStructured('events');
              const indices = indicesForFiltered(defaultEvents.entries, filtered.entries);
              if (!indices.length || indices.length >= defaultEvents.entries.length) {
                throw new Error(`Invalid source Journey category membership ${category} for ${language.key}: ${indices.length}/${defaultEvents.entries.length}`);
              }
              result[category] = indices;
              console.log(`${language.key} category ${category}: ${indices.length}`);
            }
            return result;
          }
          
          const captures = {};
          const categoryMembership = {};
          
          for (const language of LANGUAGES) {
            // Fresh page: both types are enabled. Disable Journey Events and capture Arcana only.
            await prepareJourneyMode('arcana', language);
            await expandAll();
            const arcana = await captureStructured('arcana');

