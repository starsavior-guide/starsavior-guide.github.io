              @media(max-width:390px){body{padding-left:5px;padding-right:5px}.journey-top-row{grid-template-columns:112px minmax(0,1fr)}.difficulty-wrap summary{padding:0 10px}.journey-search{font-size:13px}.journey-chip{padding:0 9px;font-size:12px}}
            </style>
          </head>
          <body>
            <section class="journey-controls" aria-label="${labels.title}">
              <div class="journey-top-row">
                <details class="difficulty-wrap" id="difficulty-wrap"><summary>${labels.difficulty}</summary><div class="difficulty-menu">
                  <button class="difficulty-option is-active" type="button" data-difficulty="all">${labels.all}</button><button class="difficulty-option" type="button" data-difficulty="easy">${labels.easy}</button><button class="difficulty-option" type="button" data-difficulty="normal">${labels.normal}</button><button class="difficulty-option" type="button" data-difficulty="hard">${labels.hard}</button>
                </div></details>
                <input class="journey-search" id="journey-search" type="search" placeholder="${labels.search}" autocomplete="off">
              </div>
              <div class="journey-type-row"><label class="journey-check"><input id="toggle-arcana" type="checkbox" checked> ${labels.arcana}</label><label class="journey-check"><input id="toggle-events" type="checkbox" checked> ${labels.events}</label></div>
              <div class="journey-category-row">${categoryButtons}</div>
              <div class="journey-legend" aria-label="reward legend"><span class="legend-item"><span class="legend-swatch"></span>${labels.success}</span><span class="legend-item failure"><span class="legend-swatch"></span>${labels.failure}</span></div>
            </section>
            <section class="archive-pane" id="pane-arcana"><div class="snapshot-root">${arcanaSnapshot.html}</div><div class="archive-dim">${labels.empty}</div></section>
            <section class="archive-pane" id="pane-events"><div class="snapshot-root">${eventSnapshot.html}</div><div class="archive-dim">${labels.empty}</div></section>
            <script>
              (() => {
                const membership = ${membershipJson};
                const input = document.querySelector('#journey-search');
                const difficultyWrap = document.querySelector('#difficulty-wrap');
                const difficultyButtons = [...document.querySelectorAll('.difficulty-option')];
                const categoryButtons = [...document.querySelectorAll('.journey-chip')];
                const toggleArcana = document.querySelector('#toggle-arcana');
                const toggleEvents = document.querySelector('#toggle-events');
                const panes = { arcana:document.querySelector('#pane-arcana'), events:document.querySelector('#pane-events') };
                const entries = {
                  arcana:[...panes.arcana.querySelectorAll('[data-journey-entry="1"]')],
                  events:[...panes.events.querySelectorAll('[data-journey-entry="1"]')]
                };
                let category = 'all';
                let difficulty = 'all';

                function searchable(node) {
                  const alt = [...node.querySelectorAll('img')].map((img) => img.getAttribute('alt') || '').join(' ');
                  return ((node.innerText || '') + ' ' + alt + ' ' + (node.getAttribute('data-journey-key') || '')).replace(/\s+/g,' ').trim().toLocaleLowerCase();
                }
                function inMembership(kind, group, key, index) {
                  if (key === 'all') return true;
                  const list = group === 'category' ? membership?.category?.[key] : membership?.difficulty?.[kind]?.[key];
                  if (!Array.isArray(list)) return true;
                  return list.includes(index);
                }
                function applyPane(kind) {
                  const pane = panes[kind];
                  const query = (input.value || '').replace(/\s+/g,' ').trim().toLocaleLowerCase();
                  let visible = 0;
                  entries[kind].forEach((node, index) => {
                    const searchMatch = !query || searchable(node).includes(query);
                    const categoryMatch = kind === 'arcana' || inMembership(kind, 'category', category, index);
                    const difficultyMatch = inMembership(kind, 'difficulty', difficulty, index);
                    const show = searchMatch && categoryMatch && difficultyMatch;
                    node.hidden = !show;
                    node.style.display = show ? '' : 'none';
                    if (show) visible += 1;
                  });
                  pane.classList.toggle('is-no-match', entries[kind].length > 0 && visible === 0);
                }
                function applyAll() {
                  panes.arcana.hidden = !toggleArcana.checked;
                  panes.events.hidden = !toggleEvents.checked;
                  if (toggleArcana.checked) applyPane('arcana');
                  if (toggleEvents.checked) applyPane('events');
                }
                input.addEventListener('input', applyAll);
                input.addEventListener('search', applyAll);
                toggleArcana.addEventListener('change', applyAll);
                toggleEvents.addEventListener('change', applyAll);
                categoryButtons.forEach((button) => button.addEventListener('click', () => {
                  category = button.dataset.category || 'all';
                  categoryButtons.forEach((item) => item.classList.toggle('is-active', item === button));
                  applyAll();
                }));
                difficultyButtons.forEach((button) => button.addEventListener('click', () => {
                  difficulty = button.dataset.difficulty || 'all';
                  difficultyButtons.forEach((item) => item.classList.toggle('is-active', item === button));
                  difficultyWrap.open = false;
                  applyAll();
                }));
                document.addEventListener('click', (event) => { if (difficultyWrap.open && !difficultyWrap.contains(event.target)) difficultyWrap.open = false; });
                applyAll();
              })();
            </script>
          </body>
          </html>`;
          }

          await page.goto(SOURCE_URL, { waitUntil: 'domcontentloaded', timeout: 60000 });
          await waitForJourneyReady();
          const snapshots = {};
          let filterMembership = null;

          for (const language of LANGUAGES) {
            console.log(`\n=== Capture ${language.key} ===`);
            await page.goto(SOURCE_URL, { waitUntil: 'domcontentloaded', timeout: 60000 });
            await waitForJourneyReady();
            const changed = await selectLanguage(language.label);
            if (!changed && language.key !== 'ko') console.warn(`Language selector did not expose ${language.label}; capturing the currently rendered locale instead.`);
            await waitForJourneyReady();

            await clickJourneyTab('arcana');
            const arcana = await captureCurrentMain();
            console.log(`${language.key} arcana text=${arcana.text.length}, entries=${arcana.entryCount}, images=${arcana.images.length}`);

            await clickJourneyTab('events');
            const events = await captureCurrentMain();
            console.log(`${language.key} events text=${events.text.length}, entries=${events.entryCount}, images=${events.images.length}`);

            if (language.key === 'ko') {
              const mustInclude = ['훈련의 방향성', '리세트의 일과', '오늘의 날씨', '의뢰 실패', '두통이 생기다'];
              const missing = mustInclude.filter((token) => !events.text.includes(token));
              if (events.text.length < 12000 || missing.length) throw new Error(`Korean Journey-event snapshot looks incomplete. text=${events.text.length}, missing=${missing.join(', ')}`);
              if (arcana.text.length < 2500) throw new Error(`Korean Arcana Journey snapshot looks incomplete. text=${arcana.text.length}`);
              if (arcana.entryCount < 2 || events.entryCount < 4) throw new Error(`Journey card extraction looks incomplete: arcana=${arcana.entryCount}, events=${events.entryCount}`);
              filterMembership = await captureKoreanFilterMembership(arcana, events);
            }

            if (!filterMembership) throw new Error('Journey filter membership was not captured from the Korean source pass.');

            const capturedAt = new Date().toISOString();
            const forbiddenRuntimeHosts = ['myhits.vercel.app', 'hits.seeyoufarm.com', 'star-savior-arcana-db.pages.dev'];
            for (const [kind, snapshot] of [['arcana', arcana], ['events', events]]) {
              const leftovers = forbiddenRuntimeHosts.filter((host) => snapshot.html.includes(host));
              if (leftovers.length) throw new Error(`${language.key} ${kind} snapshot still contains forbidden runtime hosts: ${leftovers.join(', ')}`);
            }

            const langDir = path.join(OUT_DIR, language.key);
            fs.mkdirSync(langDir, { recursive:true });
            fs.writeFileSync(path.join(langDir, 'index.html'), archivePage(language, arcana, events, capturedAt, filterMembership), 'utf8');
            fs.writeFileSync(path.join(langDir, 'arcana.html'), arcana.html, 'utf8');
            fs.writeFileSync(path.join(langDir, 'events.html'), events.html, 'utf8');
            fs.writeFileSync(path.join(langDir, 'arcana.txt'), arcana.text, 'utf8');
            fs.writeFileSync(path.join(langDir, 'events.txt'), events.text, 'utf8');
            snapshots[language.key] = {
              arcanaTextLength:arcana.text.length, eventTextLength:events.text.length,
              arcanaEntries:arcana.entryCount, eventEntries:events.entryCount,
              arcanaImages:arcana.images.length, eventImages:events.images.length
            };
          }

          await browser.close();

          const meta = {
            source: SOURCE_URL,
            capturedAt: new Date().toISOString(),
            mode: 'fully-local-static-archive',
            sourceRequiredAtRuntime: false,
            languages: LANGUAGES.map((item) => item.key),
            localAssetCount: fs.readdirSync(ASSET_DIR).filter((name) => fs.statSync(path.join(ASSET_DIR, name)).isFile()).length,
            snapshots
          };
          fs.writeFileSync(META_PATH, JSON.stringify(meta, null, 2), 'utf8');
          console.log('\nJourney archive complete:');
          console.log(JSON.stringify(meta, null, 2));
          NODE

      - name: Verify local Journey archive has no runtime source dependency
        shell: bash
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/journey-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 2

          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { chromium } from 'playwright';

          const meta = JSON.parse(fs.readFileSync('data/journey/backup-meta.json', 'utf8'));
          if (meta.sourceRequiredAtRuntime !== false) throw new Error('Journey metadata still declares a runtime source dependency.');

          const browser = await chromium.launch({ headless: true });
          const context = await browser.newContext({ viewport: { width: 1100, height: 1400 } });
          const page = await context.newPage();
          const externalRequests = [];
          await page.route('**/*', async (route) => {
            const url = new URL(route.request().url());
            if (['127.0.0.1', 'localhost'].includes(url.hostname) || ['data:', 'blob:'].includes(url.protocol)) {
              return route.continue();
            }
            externalRequests.push(route.request().url());
            return route.abort();
          });

          await page.goto('http://127.0.0.1:4173/data/journey/ko/', { waitUntil: 'domcontentloaded', timeout: 30000 });
          await page.waitForTimeout(500);
          const text = (await page.locator('body').innerText()).replace(/\s+/g, ' ');
          if (!text.includes('훈련의 방향성') || !text.includes('두통이 생기다')) {
            throw new Error('Local Journey events were not available during offline verification.');
          }


          const duplicatedControls = await page.locator('.snapshot-root input,.snapshot-root select,.snapshot-root textarea').count();
          if (duplicatedControls) throw new Error(`Source filter controls leaked into local snapshots (${duplicatedControls}).`);

          const arcanaEntries = page.locator('#pane-arcana [data-journey-entry="1"]');
          const eventEntries = page.locator('#pane-events [data-journey-entry="1"]');
          const allArcanaCount = await arcanaEntries.count();
          const allEventCount = await eventEntries.count();
          if (allArcanaCount < 2 || allEventCount < 4) throw new Error(`Local Journey entry extraction was too small: arcana=${allArcanaCount}, events=${allEventCount}`);

          const searchInput = page.locator('#journey-search');
          await searchInput.fill('린');
          await page.waitForTimeout(100);
          const visibleArcanaAfterSearch = await arcanaEntries.evaluateAll((nodes) => nodes.filter((node) => !node.hidden && getComputedStyle(node).display !== 'none').length);
          if (!visibleArcanaAfterSearch) throw new Error('Local Journey search did not find Arcana entries for 린.');
          await searchInput.fill('');
          await page.waitForTimeout(100);

          const resetButton = page.locator('.journey-chip[data-category="reset"]');
          await resetButton.click();
          await page.waitForTimeout(100);
          const resetVisible = await eventEntries.evaluateAll((nodes) => nodes.filter((node) => !node.hidden && getComputedStyle(node).display !== 'none').length);
          if (!resetVisible || resetVisible >= allEventCount) throw new Error(`Reset category filter did not narrow Journey events (${resetVisible}/${allEventCount}).`);
          await page.locator('.journey-chip[data-category="all"]').click();

          const imageWidths = await page.locator('[data-journey-entry="1"] img[data-journey-image="1"]').evaluateAll((nodes) => nodes.map((node) => node.getBoundingClientRect().width));
          if (imageWidths.some((width) => width > 100.5)) throw new Error(`Journey image exceeded local size cap: ${Math.max(...imageWidths)}`);

          const arcanaText = (await page.locator('#pane-arcana').innerText()).trim();
          if (arcanaText.length < 2000) throw new Error(`Local Journey Arcana archive was too small (${arcanaText.length}).`);

          const search = page.locator('#journey-search');
          if (await search.count() !== 1) throw new Error('Journey search UI was not generated.');
          if (await page.locator('.journey-chip').count() !== 7) throw new Error('Journey category filter UI was incomplete.');
          if (await page.locator('#toggle-arcana').count() !== 1 || await page.locator('#toggle-events').count() !== 1) {
            throw new Error('Journey type checkboxes were not generated.');
          }

          const forbiddenUi = ['LOCAL ARCHIVE','가챠 시뮬레이터','여정 아이템','몬스터 정보','월페이퍼','구원자 시뮬레이터'];
          const leakedUi = forbiddenUi.filter((token) => text.includes(token));
          if (leakedUi.length) throw new Error(`Source-site UI leaked into local Journey archive: ${leakedUi.join(', ')}`);

          if (externalRequests.length) {
            throw new Error(`Journey archive attempted external runtime requests:\n${externalRequests.join('\n')}`);
          }

          await browser.close();
          console.log('Offline verification passed: Journey works without the source site.');
          NODE

      - name: Commit Journey archive
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/journey data/journey-assets
          if git diff --cached --quiet; then
            echo "No Journey changes to commit."
          else
            git commit -m "Backup Journey database locally"
            git push
          fi
