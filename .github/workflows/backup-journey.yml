name: Backup Journey database

on:
  push:
    paths:
      - '.github/workflows/backup-journey.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backup-journey:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install browser
        shell: bash
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Capture structured Journey database
        shell: bash
        run: |
          cat > /tmp/capture-journey.mjs <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import crypto from 'node:crypto';
          import { chromium } from 'playwright';
          
          const ROOT = process.cwd();
          const SOURCE_URL = 'https://star-savior-arcana-db.pages.dev/journey';
          const OUT_DIR = path.join(ROOT, 'data', 'journey');
          const ASSET_DIR = path.join(ROOT, 'data', 'journey-assets');
          const META_PATH = path.join(OUT_DIR, 'backup-meta.json');
          
          const LANGUAGES = [
            { key: 'ko', label: '한국어' },
            { key: 'en', label: 'English' },
            { key: 'ja', label: '日本語' },
            { key: 'zh-TW', label: '繁體中文' },
            { key: 'zh-CN', label: '简体中文' }
          ];
          
          const TAB_PATTERNS = {
            arcana: [/^아르카나$/i, /^arcana$/i, /^アルカナ$/i, /^阿爾克那$/i, /^阿尔克那$/i, /아르카나/i, /arcana/i, /アルカナ/i, /阿爾克那/i, /阿尔克那/i],
            events: [/여정\s*이벤트/i, /journey\s*events?/i, /旅程\s*イベント/i, /旅程\s*事件/i, /event/i]
          };
          
          const CATEGORY_ALIASES = {
            reset: ['리세트','Reset','リセット','重置'],
            raid: ['토벌','Raid','討伐','讨伐'],
            aganon: ['아가논','Aganon','アガノン','阿加農','阿加农'],
            flora: ['플로라','Flora','フローラ','芙蘿拉','芙萝拉'],
            kalaid: ['칼라이드','Kalaid','カライド','卡萊德','卡莱德'],
            weather: ['날씨','Weather','天気','天氣','天气']
          };
          
          const DIFFICULTY_TEXT = {
            easy: ['이지','Easy','イージー','簡單','简单'],
            normal: ['노말','Normal','ノーマル','普通'],
            hard: ['하드','Hard','ハード','困難','困难']
          };
          
          fs.rmSync(OUT_DIR, { recursive: true, force: true });
          fs.rmSync(ASSET_DIR, { recursive: true, force: true });
          fs.mkdirSync(OUT_DIR, { recursive: true });
          fs.mkdirSync(ASSET_DIR, { recursive: true });
          
          function normalize(value) {
            return String(value ?? '').replace(/\u00a0/g, ' ').replace(/\s+/g, ' ').trim();
          }
          
          function safeFilename(value, fallback = 'journey-asset') {
            const cleaned = normalize(value)
              .replace(/^Image\s*/i, '')
              .replace(/[\\/:*?"<>|]/g, ' ')
              .replace(/[. ]+$/g, '')
              .replace(/\s+/g, ' ')
              .slice(0, 90)
              .trim();
            return cleaned || fallback;
          }
          
          function extensionFrom(url, contentType = '') {
            try {
              const ext = path.extname(new URL(url).pathname).toLowerCase();
              if (/^\.(webp|png|jpe?g|gif|svg|avif)$/.test(ext)) return ext === '.jpeg' ? '.jpg' : ext;
            } catch (_) {}
            if (/webp/i.test(contentType)) return '.webp';
            if (/png/i.test(contentType)) return '.png';
            if (/jpe?g/i.test(contentType)) return '.jpg';
            if (/gif/i.test(contentType)) return '.gif';
            if (/svg/i.test(contentType)) return '.svg';
            if (/avif/i.test(contentType)) return '.avif';
            return '.bin';
          }
          
          function hash(value) {
            return crypto.createHash('sha1').update(String(value)).digest('hex').slice(0, 12);
          }
          
          const browser = await chromium.launch({ headless: true });
          const context = await browser.newContext({ locale: 'ko-KR', viewport: { width: 1180, height: 1800 }, deviceScaleFactor: 1 });
          const page = await context.newPage();
          page.setDefaultTimeout(45000);
          
          const assetMap = new Map();
          const usedNames = new Map();
          const savedTabPaths = { arcana: null, events: null };
          
          async function downloadAsset(url, preferredName = '') {
            if (!url || !/^https?:\/\//i.test(url)) return null;
            if (assetMap.has(url)) return assetMap.get(url);
            let response;
            try {
              response = await context.request.get(url, { timeout: 45000 });
              if (!response.ok()) throw new Error(`HTTP ${response.status()}`);
            } catch (error) {
              throw new Error(`Journey asset download failed: ${url} (${error.message})`);
            }
            const body = await response.body();
            if (body.length < 20) throw new Error(`Journey asset was too small: ${url}`);
            const contentType = response.headers()['content-type'] || '';
            const ext = extensionFrom(url, contentType);
            const bodyHash = crypto.createHash('sha256').update(body).digest('hex').slice(0, 10);
            let base = safeFilename(preferredName || path.basename(new URL(url).pathname, path.extname(new URL(url).pathname)), bodyHash);
            let filename = `${base}${ext}`;
            if (usedNames.has(filename) && usedNames.get(filename) !== bodyHash) filename = `${base}-${bodyHash}${ext}`;
            usedNames.set(filename, bodyHash);
            const target = path.join(ASSET_DIR, filename);
            if (!fs.existsSync(target)) fs.writeFileSync(target, body);
            assetMap.set(url, filename);
            return filename;
          }
          
          async function waitReady() {
            await page.waitForFunction(() => (document.body?.innerText || '').trim().length > 1500, null, { timeout: 45000 });
            try { await page.waitForLoadState('networkidle', { timeout: 12000 }); } catch (_) {}
            await page.waitForTimeout(700);
          }
          
          async function deepScroll() {
            let stable = 0;
            let previous = 0;
            for (let i = 0; i < 80; i++) {
              const height = await page.evaluate(() => {
                window.scrollTo(0, document.documentElement.scrollHeight);
                return document.documentElement.scrollHeight;
              });
              await page.waitForTimeout(120);
              stable = height === previous ? stable + 1 : 0;
              previous = height;
              if (stable >= 4) break;
            }
            await page.evaluate(() => window.scrollTo(0, 0));
            await page.waitForTimeout(180);
          }
          
          async function expandAll() {
            const skip = new Set(['전체','이지','노말','하드','아르카나','여정 이벤트','리세트','토벌','아가논','플로라','칼라이드','날씨','한국어','English','日本語','繁體中文','简体中文']);
            for (let round = 0; round < 6; round++) {
              const buttons = page.locator('button[aria-expanded="false"]');
              const count = await buttons.count();
              let clicks = 0;
              for (let i = 0; i < count; i++) {
                const button = buttons.nth(i);
                let text = '';
                try { text = normalize(await button.innerText()); } catch (_) { continue; }
                if (skip.has(text) || text.length > 100) continue;
                try {
                  if (await button.isVisible()) {
                    await button.click({ timeout: 1800 });
                    clicks++;
                    await page.waitForTimeout(60);
                  }
                } catch (_) {}
              }
              if (!clicks) break;
            }
            await deepScroll();
          }
          
          async function clickJourneyTab(kind) {
            const patterns = TAB_PATTERNS[kind].map((re) => ({ source: re.source, flags: re.flags }));
            const savedPath = savedTabPaths[kind];
            const result = await page.evaluate(({ patterns, savedPath }) => {
              const norm = (v) => String(v || '').replace(/\u00a0/g, ' ').replace(/\s+/g, ' ').trim();
              const visible = (el) => {
                if (!(el instanceof HTMLElement)) return false;
                const r = el.getBoundingClientRect();
                const s = getComputedStyle(el);
                return r.width > 0 && r.height > 0 && s.display !== 'none' && s.visibility !== 'hidden';
              };
              const resolvePath = (path) => {
                let node = document.body;
                for (const index of path || []) {
                  node = node?.children?.[index];
                  if (!node) return null;
                }
                return node;
              };
              const makePath = (el) => {
                const path = [];
                let node = el;
                while (node && node !== document.body) {
                  const parent = node.parentElement;
                  if (!parent) return null;
                  path.unshift([...parent.children].indexOf(node));
                  node = parent;
                }
                return node === document.body ? path : null;
              };
              if (Array.isArray(savedPath)) {
                const saved = resolvePath(savedPath);
                if (saved && visible(saved)) {
                  saved.click();
                  return { clicked: true, path: savedPath, via: 'saved' };
                }
              }
              const regexes = patterns.map((p) => new RegExp(p.source, p.flags));
              const selector = 'button,[role="tab"],[role="button"],label,a,div,span';
              const candidates = [];
              for (const el of document.querySelectorAll(selector)) {
                if (!visible(el)) continue;
                const text = norm(el.innerText || el.textContent);
                if (!text || !regexes.some((re) => re.test(text))) continue;
                const clickable = el.closest('button,[role="tab"],[role="button"],label,a') || el;
                if (!visible(clickable)) continue;
                let score = 0;
                if (clickable.matches('[role="tab"]')) score += 120;
                if (clickable.tagName === 'BUTTON') score += 100;
                if (text.length < 30) score += 40;
                score -= text.length;
                candidates.push({ clickable, score, text });
              }
              candidates.sort((a,b) => b.score - a.score);
              const hit = candidates[0];
              if (!hit) return { clicked: false };
              hit.clickable.scrollIntoView({ block: 'center' });
              hit.clickable.click();
              return { clicked: true, path: makePath(hit.clickable), text: hit.text, via: 'search' };
            }, { patterns, savedPath });
            if (!result.clicked) throw new Error(`Could not find Journey ${kind} tab.`);
            if (!savedTabPaths[kind] && Array.isArray(result.path)) savedTabPaths[kind] = result.path;
            await page.waitForTimeout(550);
            await deepScroll();
          }
          
          async function selectLanguage(label) {
            if (label === '한국어') return;
            const selects = page.locator('select');
            for (let i = 0; i < await selects.count(); i++) {
              const select = selects.nth(i);
              const options = await select.locator('option').evaluateAll((nodes) => nodes.map((node) => ({ value: node.value, text: (node.textContent || '').trim() })));
              const option = options.find((item) => item.text === label);
              if (!option) continue;
              await select.selectOption(option.value);
              await page.waitForTimeout(650);
              return;
            }
            const triggers = page.getByText(/한국어|English|日本語|繁體中文|简体中文/, { exact: true });
            for (let i = 0; i < await triggers.count(); i++) {
              const trigger = triggers.nth(i);
              try {
                if (!await trigger.isVisible()) continue;
                await trigger.click();
                await page.waitForTimeout(180);
                const targets = page.getByText(label, { exact: true });
                for (let j = 0; j < await targets.count(); j++) {
                  if (await targets.nth(j).isVisible()) {
                    await targets.nth(j).click();
                    await page.waitForTimeout(650);
                    return;
                  }
                }
              } catch (_) {}
            }
            throw new Error(`Could not switch Journey language to ${label}.`);
          }
          
          async function clickVisibleExact(labels) {
            const result = await page.evaluate((labels) => {
              const norm = (v) => String(v || '').replace(/\u00a0/g, ' ').replace(/\s+/g, ' ').trim().toLocaleLowerCase();
              const wanted = new Set(labels.map(norm));
              const visible = (el) => {
                if (!(el instanceof HTMLElement)) return false;
                const r = el.getBoundingClientRect();
                const s = getComputedStyle(el);
                return r.width > 0 && r.height > 0 && s.display !== 'none' && s.visibility !== 'hidden';
              };
              const candidates = [];
              for (const el of document.querySelectorAll('button,[role="button"],[role="option"],summary,label,a,div,span')) {
                if (!visible(el)) continue;
                const text = norm(el.innerText || el.textContent);
                if (!wanted.has(text)) continue;
                const clickable = el.closest('button,[role="button"],[role="option"],summary,label,a') || el;
                if (!visible(clickable)) continue;
                let score = 0;
                if (clickable.tagName === 'BUTTON') score += 100;
                if (clickable.getAttribute('role') === 'option') score += 80;
                if (clickable.getAttribute('role') === 'button') score += 70;
                score -= normalize(clickable.innerText).length;
                candidates.push({ clickable, score, text });
              }
              candidates.sort((a,b) => b.score - a.score);
              const hit = candidates[0];
              if (!hit) return { clicked: false };
              hit.clickable.scrollIntoView({ block: 'center' });
              hit.clickable.click();
              return { clicked: true, text: hit.text };
            }, labels);
            if (result.clicked) {
              await page.waitForTimeout(500);
              await deepScroll();
            }
            return result.clicked;
          }
          
          async function captureStructured(kind) {
            const payload = await page.evaluate(({ kind, difficultyText }) => {
              const root = document.querySelector('main') || document.querySelector('[role="main"]') || document.body;
              const normalize = (value) => String(value || '').replace(/\u00a0/g, ' ').replace(/\s+/g, ' ').trim();
              const hashText = (value) => {
                const text = normalize(value);
                let h = 2166136261;
                for (let i = 0; i < text.length; i++) { h ^= text.charCodeAt(i); h = Math.imul(h, 16777619); }
                return `j${(h >>> 0).toString(36)}`;
              };
              const sourceElements = [root, ...root.querySelectorAll('*')];
              const clone = root.cloneNode(true);
              const cloneElements = [clone, ...clone.querySelectorAll('*')];
              for (let i = 0; i < Math.min(sourceElements.length, cloneElements.length); i++) {
                const source = sourceElements[i];
                const target = cloneElements[i];
                if (!(source instanceof Element) || !(target instanceof Element)) continue;
                target.setAttribute('data-v76-source-index', String(i));
                const style = getComputedStyle(source);
                target.style.display = style.display;
                target.style.visibility = style.visibility;
                target.style.opacity = style.opacity;
              }
              clone.querySelectorAll('script,noscript,iframe,source').forEach((el) => el.remove());
          
              const menuTokens = ['가챠 시뮬레이터','여정 아이템','몬스터 정보','잠재력','월페이퍼','구원자 시뮬레이터','Gacha Simulator','Journey Items','Monster Info','Potential','Wallpaper','Savior Simulator'];
              const filterTokens = ['난이도','아르카나','여정 이벤트','전체','리세트','토벌','아가논','플로라','칼라이드','날씨','성공 보상','실패 보상','Difficulty','Arcana','Journey Events','All','Reset','Raid','Aganon','Flora','Kalaid','Weather'];
              const hits = (text, tokens) => tokens.reduce((n,t) => n + (text.includes(t) ? 1 : 0), 0);
              const removeClusters = (tokens, minHits, maxLength) => {
                const candidates = [...clone.querySelectorAll('header,nav,aside,section,div,form')]
                  .map((el) => ({ el, text: normalize(el.textContent), hits: hits(normalize(el.textContent), tokens) }))
                  .filter((item) => item.hits >= minHits && item.text.length <= maxLength)
                  .sort((a,b) => a.text.length - b.text.length);
                for (const item of candidates) if (item.el.isConnected) item.el.remove();
              };
              clone.querySelectorAll('header,nav,aside,[role="navigation"],[role="menu"],[role="menubar"]').forEach((el) => {
                const text = normalize(el.textContent);
                if (hits(text, menuTokens) || /Change Theme|메뉴|Menu/.test(text)) el.remove();
              });
              removeClusters(menuTokens, 2, 1800);
              for (const control of [...clone.querySelectorAll('input,select,textarea')]) {
                let node = control;
                let best = null;
                for (let depth = 0; depth < 9 && node && node !== clone; depth++, node = node.parentElement) {
                  const text = normalize(node.textContent);
                  if (hits(text, filterTokens) >= 3 && text.length <= 1800) best = node;
                  if (text.length > 2400) break;
                }
                if (best?.isConnected) best.remove();
              }
              removeClusters(filterTokens, 4, 1800);
          
              function signature(node) {
                return `${node.tagName}|${[...node.classList].filter(Boolean).slice(0,4).sort().join('.')}`;
              }
              function discoverEntries(container) {
                let best = null;
                const parents = [container, ...container.querySelectorAll('main,section,div,ul,ol')];
                for (const parent of parents) {
                  const direct = [...parent.children].filter((child) => {
                    const text = normalize(child.textContent);
                    const style = child.style;
                    return text.length >= 35 && style.display !== 'none' && style.visibility !== 'hidden' && style.opacity !== '0';
                  });
                  if (direct.length < 2) continue;
                  const groups = new Map();
                  for (const child of direct) {
                    const sig = signature(child);
                    if (!groups.has(sig)) groups.set(sig, []);
                    groups.get(sig).push(child);
                  }
                  for (const group of groups.values()) {
                    if (group.length < 2) continue;
                    const lengths = group.map((child) => normalize(child.textContent).length);
                    const avg = lengths.reduce((a,b)=>a+b,0) / lengths.length;
                    if (avg < 50) continue;
                    const score = group.length * 10000 + Math.min(avg, 1500) * 20 - Math.max(0, direct.length - group.length) * 80;
                    if (!best || score > best.score) best = { entries: group, score };
                  }
                }
                if (best) return best.entries;
                const articles = [...container.querySelectorAll('article')].filter((el) => normalize(el.textContent).length >= 35);
                if (articles.length >= 2) return articles;
                return [...container.children].filter((el) => normalize(el.textContent).length >= 35);
              }
          
              function parseRgb(value) {
                const m = String(value || '').match(/rgba?\((\d+)[, ]+(\d+)[, ]+(\d+)(?:[, /]+([\d.]+))?\)/i);
                if (!m) return null;
                return { r:+m[1], g:+m[2], b:+m[3], a:m[4] == null ? 1 : +m[4] };
              }
              function toneFrom(rgb) {
                if (!rgb || rgb.a < .05) return 'plain';
                if (rgb.g > rgb.r * 1.28 && rgb.g > rgb.b * 1.12) return 'success';
                if (rgb.r > rgb.g * 1.28 && rgb.r > rgb.b * 1.08) return 'failure';
                if (rgb.r > 90 && rgb.g > 65 && rgb.b < Math.min(rgb.r, rgb.g) * .82) return 'highlight';
                return 'neutral';
              }
          
              function extractEntry(sourceEntry, index) {
                const entryRect = sourceEntry.getBoundingClientRect();
                const regionIds = new WeakMap();
                let regionSeq = 0;
                function regionInfo(el) {
                  let node = el instanceof Element ? el : el?.parentElement;
                  while (node && node !== sourceEntry) {
                    const rect = node.getBoundingClientRect();
                    const style = getComputedStyle(node);
                    const bg = parseRgb(style.backgroundColor);
                    const tone = toneFrom(bg);
                    const border = parseFloat(style.borderTopWidth || '0') + parseFloat(style.borderRightWidth || '0') + parseFloat(style.borderBottomWidth || '0') + parseFloat(style.borderLeftWidth || '0');
                    const areaRatio = entryRect.width * entryRect.height > 0 ? (rect.width * rect.height) / (entryRect.width * entryRect.height) : 1;
                    if (rect.width > 15 && rect.height > 12 && areaRatio < .94 && ((bg && bg.a >= .06 && tone !== 'plain') || border > 0)) {
                      if (!regionIds.has(node)) regionIds.set(node, `r${++regionSeq}`);
                      return { id: regionIds.get(node), tone };
                    }
                    node = node.parentElement;
                  }
                  return { id: '', tone: 'plain' };
                }
                function isVisible(el) {
                  if (!(el instanceof Element)) return false;
                  const rect = el.getBoundingClientRect();
                  const style = getComputedStyle(el);
                  return rect.width > 0 && rect.height > 0 && style.display !== 'none' && style.visibility !== 'hidden' && style.opacity !== '0';
                }
                const atoms = [];
                const walker = document.createTreeWalker(sourceEntry, NodeFilter.SHOW_TEXT);
                let node;
                while ((node = walker.nextNode())) {
                  const parent = node.parentElement;
                  if (!parent || !isVisible(parent) || parent.closest('script,style,noscript')) continue;
                  const text = normalize(node.nodeValue);
                  if (!text) continue;
                  const range = document.createRange();
                  range.selectNodeContents(node);
                  const rect = range.getBoundingClientRect();
                  if (!(rect.width > 0 && rect.height > 0)) continue;
                  const style = getComputedStyle(parent);
                  const region = regionInfo(parent);
                  atoms.push({
                    type:'text', text,
                    x: Math.round((rect.left - entryRect.left) * 10) / 10,
                    y: Math.round((rect.top - entryRect.top) * 10) / 10,
                    w: Math.round(rect.width * 10) / 10,
                    h: Math.round(rect.height * 10) / 10,
                    fontSize: parseFloat(style.fontSize) || 14,
                    weight: parseInt(style.fontWeight, 10) || (/bold/i.test(style.fontWeight) ? 700 : 400),
                    region: region.id,
                    tone: region.tone
                  });
                }
                for (const img of sourceEntry.querySelectorAll('img')) {
                  if (!isVisible(img)) continue;
                  const rect = img.getBoundingClientRect();
                  let src = '';
                  try { src = new URL(img.currentSrc || img.getAttribute('src') || '', location.href).href; } catch (_) {}
                  if (!src || /myhits\.vercel\.app|hits\.seeyoufarm\.com/i.test(src)) continue;
                  const region = regionInfo(img);
                  atoms.push({
                    type:'image', src, alt: normalize(img.getAttribute('alt')),
                    x: Math.round((rect.left - entryRect.left) * 10) / 10,
                    y: Math.round((rect.top - entryRect.top) * 10) / 10,
                    w: Math.round(rect.width * 10) / 10,
                    h: Math.round(rect.height * 10) / 10,
                    region: region.id,
                    tone: region.tone
                  });
                }
                atoms.sort((a,b) => a.y - b.y || a.x - b.x || (a.type === 'image' ? -1 : 1));
                const rows = [];
                for (const atom of atoms) {
                  const center = atom.y + atom.h / 2;
                  let row = rows.findLast((candidate) => {
                    const overlap = Math.min(candidate.bottom, atom.y + atom.h) - Math.max(candidate.top, atom.y);
                    return overlap > Math.min(candidate.height, atom.h) * .25 || Math.abs(candidate.center - center) <= 7;
                  });
                  if (!row || atom.y - row.bottom > 10) {
                    row = { top: atom.y, bottom: atom.y + atom.h, center, height: atom.h, atoms: [] };
                    rows.push(row);
                  }
                  row.atoms.push(atom);
                  row.top = Math.min(row.top, atom.y);
                  row.bottom = Math.max(row.bottom, atom.y + atom.h);
                  row.height = row.bottom - row.top;
                  row.center = (row.top + row.bottom) / 2;
                }
                const serializedRows = rows.map((row) => {
                  row.atoms.sort((a,b) => a.x - b.x || (a.type === 'image' ? -1 : 1));
                  const segments = [];
                  for (const atom of row.atoms) {
                    if (atom.type === 'image') {
                      const previous = segments[segments.length - 1];
                      if (previous?.type === 'images' && Math.abs(atom.x - previous.lastX) < Math.max(12, atom.w * .55)) {
                        previous.images.push({ src:atom.src, alt:atom.alt, sourceWidth:atom.w, sourceHeight:atom.h });
                        previous.lastX = atom.x;
                      } else {
                        segments.push({ type:'images', images:[{ src:atom.src, alt:atom.alt, sourceWidth:atom.w, sourceHeight:atom.h }], lastX:atom.x });
                      }
                    } else {
                      const previous = segments[segments.length - 1];
                      if (previous?.type === 'text' && atom.x - previous.lastRight < 24) {
                        previous.text = normalize(`${previous.text} ${atom.text}`);
                        previous.lastRight = atom.x + atom.w;
                        previous.fontSize = Math.max(previous.fontSize, atom.fontSize);
                        previous.weight = Math.max(previous.weight, atom.weight);
                      } else {
                        segments.push({ type:'text', text:atom.text, fontSize:atom.fontSize, weight:atom.weight, lastRight:atom.x + atom.w });
                      }
                    }
                  }
                  for (const segment of segments) { delete segment.lastX; delete segment.lastRight; }
                  const text = normalize(segments.filter((s)=>s.type==='text').map((s)=>s.text).join(' '));
                  const regionAtoms = row.atoms.filter((a)=>a.region);
                  const region = regionAtoms[0]?.region || '';
                  const tone = regionAtoms.find((a)=>a.tone==='success')?.tone || regionAtoms.find((a)=>a.tone==='failure')?.tone || regionAtoms.find((a)=>a.tone==='highlight')?.tone || regionAtoms[0]?.tone || 'plain';
                  const fontSize = Math.max(0, ...row.atoms.filter((a)=>a.type==='text').map((a)=>a.fontSize || 0));
                  const weight = Math.max(0, ...row.atoms.filter((a)=>a.type==='text').map((a)=>a.weight || 0));
                  return { text, segments, region, tone, fontSize, weight };
                }).filter((row)=>row.text || row.segments.some((s)=>s.type==='images'));
                const titleRow = serializedRows.find((row) => row.text && !/^or$/i.test(row.text)) || { text:`Entry ${index+1}` };
                const title = titleRow.text;
                const secondIdentity = serializedRows.find((row, i) => i > 0 && /^(구원자\s*:|Savior\s*:|救援者\s*:|救援者：)/i.test(row.text))?.text || '';
                const key = hashText(`${title}|${secondIdentity}`);
                const imageText = serializedRows.flatMap((row) => row.segments || []).filter((segment) => segment.type === 'images').flatMap((segment) => segment.images || []).map((image) => image.alt || '').join(' ');
                const combinedText = normalize(`${serializedRows.map((row)=>row.text).join(' ')} ${imageText}`);
                const difficulties = [];
                for (const [diff, aliases] of Object.entries(difficultyText)) {
                  if (aliases.some((alias) => combinedText === alias || combinedText.startsWith(`${alias} `) || combinedText.endsWith(` ${alias}`) || combinedText.includes(` ${alias} `) || combinedText.includes(` ${alias},`) || combinedText.includes(` ${alias}:`))) difficulties.push(diff);
                }
                return { key, title, searchText: combinedText, difficulties, rows: serializedRows };
              }
          
              const detected = discoverEntries(clone);
              const entries = [];
              for (let i = 0; i < detected.length; i++) {
                const cloneEntry = detected[i];
                const sourceIndex = Number(cloneEntry.getAttribute('data-v76-source-index'));
                const sourceEntry = sourceElements[sourceIndex];
                if (!(sourceEntry instanceof Element)) continue;
                entries.push(extractEntry(sourceEntry, i));
              }
              return { kind, entries, bodyText: normalize(root.innerText) };
            }, { kind, difficultyText: DIFFICULTY_TEXT });
          
            // Download and localize every image referenced by structured rows.
            for (const entry of payload.entries) {
              for (const row of entry.rows) {
                for (const segment of row.segments) {
                  if (segment.type !== 'images') continue;
                  for (const image of segment.images) {
                    const preferred = image.alt || row.text || entry.title || 'journey-image';
                    image.asset = await downloadAsset(image.src, preferred);
                    delete image.src;
                  }
                }
              }
            }
            return payload;
          }
          
          function keyIndex(entries) {
            const map = new Map();
            entries.forEach((entry, index) => {
              if (!map.has(entry.key)) map.set(entry.key, []);
              map.get(entry.key).push(index);
            });
            return map;
          }
          
          function indicesForFiltered(defaultEntries, filteredEntries) {
            const defaults = keyIndex(defaultEntries);
            const indices = new Set();
            for (const entry of filteredEntries) {
              for (const index of defaults.get(entry.key) || []) indices.add(index);
            }
            return [...indices].sort((a,b)=>a-b);
          }
          
          async function captureCategoryMembership(defaultEvents) {
            const result = {};
            for (const [category, aliases] of Object.entries(CATEGORY_ALIASES)) {
              await page.goto(SOURCE_URL, { waitUntil:'domcontentloaded', timeout:60000 });
              await waitReady();
              await clickJourneyTab('events');
              const clicked = await clickVisibleExact(aliases);
              if (!clicked) throw new Error(`Could not click source Journey category: ${category}`);
              const filtered = await captureStructured('events');
              const indices = indicesForFiltered(defaultEvents.entries, filtered.entries);
              if (!indices.length || indices.length >= defaultEvents.entries.length) {
                throw new Error(`Invalid source Journey category membership ${category}: ${indices.length}/${defaultEvents.entries.length}`);
              }
              result[category] = indices;
              console.log(`category ${category}: ${indices.length}`);
            }
            return result;
          }
          
          const captures = {};
          let categoryMembership = null;
          
          for (const language of LANGUAGES) {
            await page.goto(SOURCE_URL, { waitUntil:'domcontentloaded', timeout:60000 });
            await waitReady();
            if (language.label !== '한국어') await selectLanguage(language.label);
            await clickJourneyTab('arcana');
            await expandAll();
            const arcana = await captureStructured('arcana');
            await clickJourneyTab('events');
            await expandAll();
            const events = await captureStructured('events');
          
            if (language.key === 'ko') {
              if (arcana.entries.length < 5) throw new Error(`Arcana Journey extraction too small: ${arcana.entries.length}`);
              if (events.entries.length < 20) throw new Error(`Journey event extraction too small: ${events.entries.length}`);
              const body = events.bodyText;
              for (const token of ['훈련의 방향성','리세트의 일과','오늘의 날씨','두통이 생기다']) {
                if (!body.includes(token)) throw new Error(`Journey source missing expected event: ${token}`);
              }
            }
            if (language.key !== 'ko') {
              if (arcana.entries.length !== captures.ko.arcana.entries.length || events.entries.length !== captures.ko.events.entries.length) {
                throw new Error(`Journey entry order/count changed for ${language.key}: arcana=${arcana.entries.length}/${captures.ko.arcana.entries.length}, events=${events.entries.length}/${captures.ko.events.entries.length}`);
              }
            }
            captures[language.key] = { arcana, events };
            console.log(`${language.key}: arcana=${arcana.entries.length}, events=${events.entries.length}`);
          }
          
          // Category classification uses the Korean source once and is then applied by source order to every language.
          await page.goto(SOURCE_URL, { waitUntil:'domcontentloaded', timeout:60000 });
          await waitReady();
          await clickJourneyTab('events');
          categoryMembership = await captureCategoryMembership(captures.ko.events);
          
          for (const language of LANGUAGES) {
            const snapshot = captures[language.key];
            snapshot.events.entries.forEach((entry, index) => {
              entry.categories = Object.entries(categoryMembership).filter(([, indices]) => indices.includes(index)).map(([key]) => key);
              entry.kind = 'events';
            });
            snapshot.arcana.entries.forEach((entry) => {
              entry.categories = [];
              entry.kind = 'arcana';
            });
            const langDir = path.join(OUT_DIR, language.key);
            fs.mkdirSync(langDir, { recursive: true });
            fs.writeFileSync(path.join(langDir, 'journey.json'), JSON.stringify({
              version: 1,
              language: language.key,
              arcana: snapshot.arcana.entries,
              events: snapshot.events.entries
            }, null, 2), 'utf8');
          }
          
          await browser.close();
          
          const meta = {
            capturedAt: new Date().toISOString(),
            source: SOURCE_URL,
            mode: 'structured-local-json',
            sourceRequiredAtRuntime: false,
            languages: LANGUAGES.map((item)=>item.key),
            localAssetCount: fs.readdirSync(ASSET_DIR).filter((name)=>fs.statSync(path.join(ASSET_DIR,name)).isFile()).length,
            counts: Object.fromEntries(LANGUAGES.map((language) => [language.key, {
              arcana: captures[language.key].arcana.entries.length,
              events: captures[language.key].events.entries.length
            }])),
            categories: Object.fromEntries(Object.entries(categoryMembership).map(([key, value])=>[key, value.length]))
          };
          fs.writeFileSync(META_PATH, JSON.stringify(meta, null, 2), 'utf8');
          console.log(JSON.stringify(meta, null, 2));
          NODE
          node /tmp/capture-journey.mjs

      - name: Verify structured local Journey database
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';

          const languages = ['ko','en','ja','zh-TW','zh-CN'];
          const meta = JSON.parse(fs.readFileSync('data/journey/backup-meta.json','utf8'));
          if (meta.sourceRequiredAtRuntime !== false || meta.mode !== 'structured-local-json') {
            throw new Error('Journey metadata is not local structured JSON.');
          }
          for (const language of languages) {
            const file = `data/journey/${language}/journey.json`;
            if (!fs.existsSync(file)) throw new Error(`Missing ${file}`);
            const raw = fs.readFileSync(file,'utf8');
            if (/https?:\/\//i.test(raw)) throw new Error(`External URL remained in ${file}`);
            const data = JSON.parse(raw);
            if (!Array.isArray(data.arcana) || data.arcana.length < 5) throw new Error(`Arcana data too small for ${language}`);
            if (!Array.isArray(data.events) || data.events.length < 20) throw new Error(`Journey event data too small for ${language}`);
            const combined = [...data.arcana, ...data.events];
            for (const entry of combined) {
              if (!entry.title || !Array.isArray(entry.rows) || !entry.rows.length) throw new Error(`Malformed Journey entry in ${language}`);
            }
          }
          const assets = fs.readdirSync('data/journey-assets').filter((name) => fs.statSync(path.join('data/journey-assets',name)).isFile());
          if (assets.length < 10) throw new Error(`Journey asset backup too small: ${assets.length}`);
          const ko = JSON.parse(fs.readFileSync('data/journey/ko/journey.json','utf8'));
          const koText = [...ko.arcana,...ko.events].map((entry)=>entry.searchText).join(' ');
          for (const token of ['훈련의 방향성','리세트의 일과','오늘의 날씨','두통이 생기다']) {
            if (!koText.includes(token)) throw new Error(`Missing Korean Journey token: ${token}`);
          }
          const arcanaSearch = ko.arcana.some((entry) => (entry.searchText || '').includes('린'));
          if (!arcanaSearch) throw new Error('Arcana Journey search corpus does not contain 린.');
          for (const category of ['reset','raid','aganon','flora','kalaid','weather']) {
            const count = ko.events.filter((entry)=>entry.categories?.includes(category)).length;
            if (!count) throw new Error(`Journey category has no entries: ${category}`);
          }
          console.log(`Structured Journey verification passed. assets=${assets.length}`);
          NODE

      - name: Commit Journey database
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/journey data/journey-assets
          if git diff --cached --quiet; then
            echo "No Journey changes to commit."
          else
            git commit -m "Rebuild Journey database as local JSON"
            git push
          fi
