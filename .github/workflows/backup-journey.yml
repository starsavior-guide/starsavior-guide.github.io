              .archive-pane{max-width:1180px;margin:0 auto 14px;min-width:0}.archive-pane[hidden]{display:none!important}
              .journey-captured-list{display:grid!important;gap:12px!important;width:100%!important;max-width:100%!important;margin:0!important;padding:0!important}
