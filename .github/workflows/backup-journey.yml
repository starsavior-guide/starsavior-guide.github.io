                    const areaRatio = entryRect.width * entryRect.height > 0 ? (rect.width * rect.height) / (entryRect.width * entryRect.height) : 1;
                    if (rect.width > 15 && rect.height > 12 && areaRatio < .94 && ((bg && bg.a >= .06 && tone !== 'plain') || border > 0)) {
