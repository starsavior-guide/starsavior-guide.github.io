name: Backup Journey database

on:
  push:
    paths:
      - '.github/workflows/backup-journey.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backup-journey:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install browser
        shell: bash
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Capture structured Journey database
        shell: bash
        run: |
          cat > .journey-capture.mjs <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import crypto from 'node:crypto';
          import { chromium } from 'playwright';
          
          const ROOT = process.cwd();
          const SOURCE_URL = 'https://star-savior-arcana-db.pages.dev/journey';
          const OUT_DIR = path.join(ROOT, 'data', 'journey');
          const ASSET_DIR = path.join(ROOT, 'data', 'journey-assets');
          const META_PATH = path.join(OUT_DIR, 'backup-meta.json');
          
          const LANGUAGES = [
            { key: 'ko', label: '한국어' },
            { key: 'en', label: 'English' },
            { key: 'ja', label: '日本語' }
          ];
          
          const TAB_PATTERNS = {
            arcana: [/^아르카나$/i, /^arcana$/i, /^アルカナ$/i, /^阿爾克那$/i, /^阿尔克那$/i, /아르카나/i, /arcana/i, /アルカナ/i, /阿爾克那/i, /阿尔克那/i],
            events: [/여정\s*이벤트/i, /journey\s*events?/i, /旅程\s*イベント/i, /旅程\s*事件/i, /event/i]
          };

          // The source Journey page uses two independent checkboxes, not tabs.
          // Capture each content type by explicitly setting these checkbox states.
          const TYPE_ALIASES = {
            arcana: ['아르카나','Arcana','Arcana Event','Arcana Events','Show Arcana Event','Show Arcana Events','アルカナ','阿爾克那','阿尔克那'],
            events: ['여정 이벤트','Journey Event','Journey Events','Show Journey Event','Show Journey Events','旅程イベント','旅程事件']
          };
          
          const CATEGORY_ALIASES = {
            reset: ['리세트','Lisette','Reset','リセッテ','リセット','莉賽特','莉赛特','重置'],
            raid: ['토벌','Hunt','Raid','討伐','讨伐'],
            aganon: ['아가논','Aganon','アガノン','阿加農','阿加农'],
            flora: ['플로라','Flora','フローラ','芙蘿拉','芙萝拉'],
            kalaid: ['칼라이드','Kalaid','カライド','卡萊德','卡莱德'],
            weather: ['날씨','Weather','天気','天氣','天气']
          };
          
          const DIFFICULTY_TEXT = {
            easy: ['이지','Easy','イージー','簡單','简单'],
            normal: ['노말','Normal','ノーマル','普通'],
            hard: ['하드','Hard','ハード','困難','困难']
          };
          
          fs.rmSync(OUT_DIR, { recursive: true, force: true });
          fs.rmSync(ASSET_DIR, { recursive: true, force: true });
          fs.mkdirSync(OUT_DIR, { recursive: true });
          fs.mkdirSync(ASSET_DIR, { recursive: true });
          
          function normalize(value) {
            return String(value ?? '').replace(/\u00a0/g, ' ').replace(/\s+/g, ' ').trim();
          }
          
          function safeFilename(value, fallback = 'journey-asset') {
            const cleaned = normalize(value)
              .replace(/^Image\s*/i, '')
              .replace(/[\\/:*?"<>|]/g, ' ')
              .replace(/[. ]+$/g, '')
              .replace(/\s+/g, ' ')
              .slice(0, 90)
              .trim();
            return cleaned || fallback;
          }
          
          function extensionFrom(url, contentType = '') {
            try {
              const ext = path.extname(new URL(url).pathname).toLowerCase();
              if (/^\.(webp|png|jpe?g|gif|svg|avif)$/.test(ext)) return ext === '.jpeg' ? '.jpg' : ext;
            } catch (_) {}
            if (/webp/i.test(contentType)) return '.webp';
            if (/png/i.test(contentType)) return '.png';
            if (/jpe?g/i.test(contentType)) return '.jpg';
            if (/gif/i.test(contentType)) return '.gif';
            if (/svg/i.test(contentType)) return '.svg';
            if (/avif/i.test(contentType)) return '.avif';
            return '.bin';
          }
          
          function hash(value) {
            return crypto.createHash('sha1').update(String(value)).digest('hex').slice(0, 12);
          }
          
          const browser = await chromium.launch({ headless: true });
          const context = await browser.newContext({ locale: 'ko-KR', viewport: { width: 1180, height: 1800 }, deviceScaleFactor: 1 });
          const page = await context.newPage();
          page.setDefaultTimeout(45000);
          
          const assetMap = new Map();
          const usedNames = new Map();
          const savedTabPaths = { arcana: null, events: null };
          const savedTypePaths = { arcana: null, events: null };
          const savedCategoryPaths = Object.fromEntries(Object.keys(CATEGORY_ALIASES).map((key) => [key, null]));
          
          async function downloadAsset(url, preferredName = '') {
            if (!url || !/^https?:\/\//i.test(url)) return null;
            if (assetMap.has(url)) return assetMap.get(url);
            let response;
            try {
              response = await context.request.get(url, { timeout: 45000 });
              if (!response.ok()) throw new Error(`HTTP ${response.status()}`);
            } catch (error) {
              throw new Error(`Journey asset download failed: ${url} (${error.message})`);
            }
            const body = await response.body();
            if (body.length < 20) throw new Error(`Journey asset was too small: ${url}`);
            const contentType = response.headers()['content-type'] || '';
            const ext = extensionFrom(url, contentType);
            const bodyHash = crypto.createHash('sha256').update(body).digest('hex').slice(0, 10);
            let base = safeFilename(preferredName || path.basename(new URL(url).pathname, path.extname(new URL(url).pathname)), bodyHash);
            let filename = `${base}${ext}`;
            if (usedNames.has(filename) && usedNames.get(filename) !== bodyHash) filename = `${base}-${bodyHash}${ext}`;
            usedNames.set(filename, bodyHash);
            const target = path.join(ASSET_DIR, filename);
            if (!fs.existsSync(target)) fs.writeFileSync(target, body);
            assetMap.set(url, filename);
            return filename;
          }
          
          async function waitReady() {
            await page.waitForFunction(() => (document.body?.innerText || '').trim().length > 1500, null, { timeout: 45000 });
            try { await page.waitForLoadState('networkidle', { timeout: 12000 }); } catch (_) {}
            await page.waitForTimeout(700);
          }
          
          async function deepScroll() {
            let stable = 0;
            let previous = 0;
            for (let i = 0; i < 80; i++) {
              const height = await page.evaluate(() => {
                window.scrollTo(0, document.documentElement.scrollHeight);
                return document.documentElement.scrollHeight;
              });
              await page.waitForTimeout(120);
              stable = height === previous ? stable + 1 : 0;
              previous = height;
              if (stable >= 4) break;
            }
            await page.evaluate(() => window.scrollTo(0, 0));
            await page.waitForTimeout(180);
          }
          
          async function expandAll() {
            const skip = new Set(['전체','이지','노말','하드','아르카나','여정 이벤트','리세트','토벌','아가논','플로라','칼라이드','날씨','한국어','English','日本語','繁體中文','简体中文']);
            for (let round = 0; round < 6; round++) {
              const buttons = page.locator('button[aria-expanded="false"]');
              const count = await buttons.count();
              let clicks = 0;
              for (let i = 0; i < count; i++) {
                const button = buttons.nth(i);
                let text = '';
                try { text = normalize(await button.innerText()); } catch (_) { continue; }
                if (skip.has(text) || text.length > 100) continue;
                try {
                  if (await button.isVisible()) {
                    await button.click({ timeout: 1800 });
                    clicks++;
                    await page.waitForTimeout(60);
                  }
                } catch (_) {}
              }
              if (!clicks) break;
            }
            await deepScroll();
          }
          
          async function clickJourneyTab(kind) {
            const patterns = TAB_PATTERNS[kind].map((re) => ({ source: re.source, flags: re.flags }));
            const savedPath = savedTabPaths[kind];
            const result = await page.evaluate(({ patterns, savedPath }) => {
              const norm = (v) => String(v || '').replace(/\u00a0/g, ' ').replace(/\s+/g, ' ').trim();
              const visible = (el) => {
                if (!(el instanceof HTMLElement)) return false;
                const r = el.getBoundingClientRect();
                const s = getComputedStyle(el);
                return r.width > 0 && r.height > 0 && s.display !== 'none' && s.visibility !== 'hidden';
              };
              const resolvePath = (path) => {
                let node = document.body;
                for (const index of path || []) {
                  node = node?.children?.[index];
                  if (!node) return null;
                }
                return node;
              };
              const makePath = (el) => {
                const path = [];
                let node = el;
                while (node && node !== document.body) {
                  const parent = node.parentElement;
                  if (!parent) return null;
                  path.unshift([...parent.children].indexOf(node));
                  node = parent;
                }
                return node === document.body ? path : null;
              };
              if (Array.isArray(savedPath)) {
                const saved = resolvePath(savedPath);
                if (saved && visible(saved)) {
                  saved.click();
                  return { clicked: true, path: savedPath, via: 'saved' };
                }
              }
              const regexes = patterns.map((p) => new RegExp(p.source, p.flags));
              const selector = 'button,[role="tab"],[role="button"],label,a,div,span';
              const candidates = [];
              for (const el of document.querySelectorAll(selector)) {
                if (!visible(el)) continue;
                const text = norm(el.innerText || el.textContent);
                if (!text || !regexes.some((re) => re.test(text))) continue;
                const clickable = el.closest('button,[role="tab"],[role="button"],label,a') || el;
                if (!visible(clickable)) continue;
                let score = 0;
                if (clickable.matches('[role="tab"]')) score += 120;
                if (clickable.tagName === 'BUTTON') score += 100;
                if (text.length < 30) score += 40;
                score -= text.length;
                candidates.push({ clickable, score, text });
              }
              candidates.sort((a,b) => b.score - a.score);
              const hit = candidates[0];
              if (!hit) return { clicked: false };
              hit.clickable.scrollIntoView({ block: 'center' });
              hit.clickable.click();
              return { clicked: true, path: makePath(hit.clickable), text: hit.text, via: 'search' };
            }, { patterns, savedPath });
            if (!result.clicked) throw new Error(`Could not find Journey ${kind} tab.`);
            if (!savedTabPaths[kind] && Array.isArray(result.path)) savedTabPaths[kind] = result.path;
            await page.waitForTimeout(550);
            await deepScroll();
          }
          
          // The source renders Arcana / Journey Event as custom clickable UI, not semantic checkboxes.
          // A fresh Journey page starts with both enabled. For a single-type capture, reload the page
          // and click the *other* label once to disable it. This avoids relying on aria/input state.
          async function clickJourneyType(kind) {
            const savedPath = savedTypePaths[kind];
            const result = await page.evaluate(({ labels, savedPath }) => {
              const norm = (v) => String(v || '').replace(/\u00a0/g, ' ').replace(/\s+/g, ' ').trim().toLocaleLowerCase();
              const wanted = labels.map(norm);
              const visible = (el) => {
                if (!(el instanceof HTMLElement)) return false;
                const r = el.getBoundingClientRect();
                const s = getComputedStyle(el);
                return r.width > 0 && r.height > 0 && s.display !== 'none' && s.visibility !== 'hidden';
              };
              const resolvePath = (path) => {
                let node = document.body;
                for (const index of path || []) {
                  node = node?.children?.[index];
                  if (!node) return null;
                }
                return node;
              };
              const makePath = (el) => {
                const path = [];
                let node = el;
                while (node && node !== document.body) {
                  const parent = node.parentElement;
                  if (!parent) return null;
                  path.unshift([...parent.children].indexOf(node));
                  node = parent;
                }
                return node === document.body ? path : null;
              };
              const clickableFor = (el) => {
                const semantic = el.closest('button,label,a,[role="checkbox"],[role="switch"],[role="button"],input[type="checkbox"]');
                if (semantic && visible(semantic)) return semantic;
                let node = el;
                for (let depth = 0; node && node !== document.body && depth < 7; depth++, node = node.parentElement) {
                  if (!(node instanceof HTMLElement) || !visible(node)) continue;
                  const style = getComputedStyle(node);
                  if (style.cursor === 'pointer' || node.onclick || node.tabIndex >= 0) return node;
                  const input = node.querySelector?.('input[type="checkbox"]');
                  if (input) return input.closest('label') || input;
                }
                return el.parentElement || el;
              };

              if (Array.isArray(savedPath)) {
                const saved = resolvePath(savedPath);
                if (saved && visible(saved)) {
                  saved.scrollIntoView({ block: 'center' });
                  saved.click();
                  return { clicked: true, path: savedPath, via: 'saved' };
                }
              }

              const candidates = [];
              for (const el of document.querySelectorAll('button,label,a,[role="checkbox"],[role="switch"],[role="button"],div,span,p')) {
                if (!visible(el)) continue;
                const text = norm(el.innerText || el.textContent);
                if (!text) continue;
                const exact = wanted.includes(text);
                const fuzzy = wanted.some((target) => target.length >= 4 && (text.includes(target) || target.includes(text)));
                if (!exact && !fuzzy) continue;
                const clickable = clickableFor(el);
                if (!clickable || !visible(clickable)) continue;
                let score = exact ? 400 : 160;
                if (clickable.tagName === 'LABEL') score += 180;
                if (clickable.matches?.('[role="checkbox"],input[type="checkbox"]')) score += 170;
                if (clickable.tagName === 'BUTTON' || clickable.getAttribute?.('role') === 'button') score += 120;
                if (getComputedStyle(clickable).cursor === 'pointer') score += 70;
                score -= text.length;
                candidates.push({ clickable, score, text });
              }
              candidates.sort((a,b) => b.score - a.score);
              const hit = candidates[0];
              if (!hit) return { clicked: false };
              hit.clickable.scrollIntoView({ block: 'center' });
              hit.clickable.click();
              return { clicked: true, path: makePath(hit.clickable), text: hit.text, via: 'search' };
            }, { labels: TYPE_ALIASES[kind], savedPath });

            if (result.clicked && !savedTypePaths[kind] && Array.isArray(result.path)) {
              savedTypePaths[kind] = result.path;
            }
            if (result.clicked) {
              await page.waitForTimeout(650);
              await deepScroll();
            }
            return result;
          }

          async function prepareJourneyMode(kind, language) {
            await page.goto(SOURCE_URL, { waitUntil:'domcontentloaded', timeout:60000 });
            await waitReady();
            await selectLanguage(language.label);
            await waitReady();

            const unwantedKind = kind === 'arcana' ? 'events' : 'arcana';
            const result = await clickJourneyType(unwantedKind);
            if (!result.clicked) {
              const visibleTexts = await page.evaluate(() => [...document.querySelectorAll('button,div,span,p,label')]
                .filter((el) => {
                  const r = el.getBoundingClientRect();
                  const s = getComputedStyle(el);
                  return r.width > 0 && r.height > 0 && s.display !== 'none' && s.visibility !== 'hidden';
                })
                .map((el) => String(el.innerText || el.textContent || '').replace(/\s+/g,' ').trim())
                .filter((text) => text && text.length <= 60)
                .slice(0, 160));
              throw new Error(`Could not disable Journey ${unwantedKind} while preparing ${kind} for ${language.key}. Visible text: ${JSON.stringify(visibleTexts)}`);
            }
            console.log(`${language.key} ${kind}: disabled ${unwantedKind} via ${result.via}${result.text ? ` (${result.text})` : ''}`);
            await page.waitForTimeout(450);
            await deepScroll();
          }

          async function selectLanguage(label) {
            const selects = page.locator('select');
            for (let i = 0; i < await selects.count(); i++) {
              const select = selects.nth(i);
              const currentText = await select.locator('option:checked').first().textContent().catch(() => '');
              if ((currentText || '').trim() === label) return true;
              const options = await select.locator('option').evaluateAll((nodes) => nodes.map((node) => ({ value: node.value, text: (node.textContent || '').trim() })));
              const option = options.find((item) => item.text === label);
              if (!option) continue;
              await select.selectOption(option.value);
              await page.waitForTimeout(650);
              return true;
            }
            const triggers = page.getByText(/한국어|English|日本語|繁體中文|简体中文/, { exact: true });
            for (let i = 0; i < await triggers.count(); i++) {
              const trigger = triggers.nth(i);
              try {
                if (!await trigger.isVisible()) continue;
                await trigger.click();
                await page.waitForTimeout(180);
                const targets = page.getByText(label, { exact: true });
                for (let j = 0; j < await targets.count(); j++) {
                  if (await targets.nth(j).isVisible()) {
                    await targets.nth(j).click();
                    await page.waitForTimeout(650);
                    return true;
                  }
                }
              } catch (_) {}
            }
            throw new Error(`Could not switch Journey language to ${label}.`);
          }
          
          async function clickVisibleExact(labels) {
            const result = await page.evaluate((labels) => {
              const norm = (v) => String(v || '').replace(/\u00a0/g, ' ').replace(/\s+/g, ' ').trim().toLocaleLowerCase();
              const wanted = new Set(labels.map(norm));
              const visible = (el) => {
                if (!(el instanceof HTMLElement)) return false;
                const r = el.getBoundingClientRect();
                const s = getComputedStyle(el);
                return r.width > 0 && r.height > 0 && s.display !== 'none' && s.visibility !== 'hidden';
              };
              const candidates = [];
              for (const el of document.querySelectorAll('button,[role="button"],[role="option"],summary,label,a,div,span')) {
                if (!visible(el)) continue;
                const text = norm(el.innerText || el.textContent);
                if (!wanted.has(text)) continue;
                const clickable = el.closest('button,[role="button"],[role="option"],summary,label,a') || el;
                if (!visible(clickable)) continue;
                let score = 0;
                if (clickable.tagName === 'BUTTON') score += 100;
                if (clickable.getAttribute('role') === 'option') score += 80;
                if (clickable.getAttribute('role') === 'button') score += 70;
                score -= norm(clickable.innerText).length;
                candidates.push({ clickable, score, text });
              }
              candidates.sort((a,b) => b.score - a.score);
              const hit = candidates[0];
              if (!hit) return { clicked: false };
              hit.clickable.scrollIntoView({ block: 'center' });
              hit.clickable.click();
              return { clicked: true, text: hit.text };
            }, labels);
            if (result.clicked) {
              await page.waitForTimeout(500);
              await deepScroll();
            }
            return result.clicked;
          }
          
          async function captureStructured(kind) {
            const payload = await page.evaluate(({ kind, difficultyText }) => {
              const root = document.querySelector('main') || document.querySelector('[role="main"]') || document.body;
              const normalize = (value) => String(value || '').replace(/\u00a0/g, ' ').replace(/\s+/g, ' ').trim();
              const hashText = (value) => {
                const text = normalize(value);
                let h = 2166136261;
                for (let i = 0; i < text.length; i++) { h ^= text.charCodeAt(i); h = Math.imul(h, 16777619); }
                return `j${(h >>> 0).toString(36)}`;
              };
              const sourceElements = [root, ...root.querySelectorAll('*')];
              const clone = root.cloneNode(true);
              const cloneElements = [clone, ...clone.querySelectorAll('*')];
              for (let i = 0; i < Math.min(sourceElements.length, cloneElements.length); i++) {
                const source = sourceElements[i];
                const target = cloneElements[i];
                if (!(source instanceof Element) || !(target instanceof Element)) continue;
                target.setAttribute('data-v76-source-index', String(i));
                const style = getComputedStyle(source);
                target.style.display = style.display;
                target.style.visibility = style.visibility;
                target.style.opacity = style.opacity;
              }
              clone.querySelectorAll('script,noscript,iframe,source').forEach((el) => el.remove());
          
              const menuTokens = ['가챠 시뮬레이터','여정 아이템','몬스터 정보','잠재력','월페이퍼','구원자 시뮬레이터','Gacha Simulator','Journey Items','Monster Info','Potential','Wallpaper','Savior Simulator'];
              const filterTokens = ['난이도','아르카나','여정 이벤트','전체','리세트','토벌','아가논','플로라','칼라이드','날씨','성공 보상','실패 보상','Difficulty','Arcana','Journey Events','All','Reset','Raid','Aganon','Flora','Kalaid','Weather'];
              const hits = (text, tokens) => tokens.reduce((n,t) => n + (text.includes(t) ? 1 : 0), 0);
              const removeClusters = (tokens, minHits, maxLength) => {
                const candidates = [...clone.querySelectorAll('header,nav,aside,section,div,form')]
                  .map((el) => ({ el, text: normalize(el.textContent), hits: hits(normalize(el.textContent), tokens) }))
                  .filter((item) => item.hits >= minHits && item.text.length <= maxLength)
                  .sort((a,b) => a.text.length - b.text.length);
                for (const item of candidates) if (item.el.isConnected) item.el.remove();
              };
              clone.querySelectorAll('header,nav,aside,[role="navigation"],[role="menu"],[role="menubar"]').forEach((el) => {
                const text = normalize(el.textContent);
                if (hits(text, menuTokens) || /Change Theme|메뉴|Menu/.test(text)) el.remove();
              });
              removeClusters(menuTokens, 2, 1800);
              for (const control of [...clone.querySelectorAll('input,select,textarea')]) {
                let node = control;
                let best = null;
                for (let depth = 0; depth < 9 && node && node !== clone; depth++, node = node.parentElement) {
                  const text = normalize(node.textContent);
                  if (hits(text, filterTokens) >= 3 && text.length <= 1800) best = node;
                  if (text.length > 2400) break;
                }
                if (best?.isConnected) best.remove();
              }
              removeClusters(filterTokens, 4, 1800);
          
              function signature(node) {
                return `${node.tagName}|${[...node.classList].filter(Boolean).slice(0,4).sort().join('.')}`;
              }
              function discoverEntries(container) {
                let best = null;
                const parents = [container, ...container.querySelectorAll('main,section,div,ul,ol')];
                for (const parent of parents) {
                  const direct = [...parent.children].filter((child) => {
                    const text = normalize(child.textContent);
                    const style = child.style;
                    return text.length >= 35 && style.display !== 'none' && style.visibility !== 'hidden' && style.opacity !== '0';
                  });
                  if (direct.length < 2) continue;
                  const groups = new Map();
                  for (const child of direct) {
                    const sig = signature(child);
                    if (!groups.has(sig)) groups.set(sig, []);
                    groups.get(sig).push(child);
                  }
                  for (const group of groups.values()) {
                    if (group.length < 2) continue;
                    const lengths = group.map((child) => normalize(child.textContent).length);
                    const avg = lengths.reduce((a,b)=>a+b,0) / lengths.length;
                    if (avg < 50) continue;
                    const score = group.length * 10000 + Math.min(avg, 1500) * 20 - Math.max(0, direct.length - group.length) * 80;
                    if (!best || score > best.score) best = { entries: group, score };
                  }
                }
                if (best) return best.entries;
                const articles = [...container.querySelectorAll('article')].filter((el) => normalize(el.textContent).length >= 35);
                if (articles.length >= 2) return articles;
                return [...container.children].filter((el) => normalize(el.textContent).length >= 35);
              }
          
              function parseRgb(value) {
                const m = String(value || '').match(/rgba?\((\d+)[, ]+(\d+)[, ]+(\d+)(?:[, /]+([\d.]+))?\)/i);
                if (!m) return null;
                return { r:+m[1], g:+m[2], b:+m[3], a:m[4] == null ? 1 : +m[4] };
              }
              function toneFrom(rgb) {
                if (!rgb || rgb.a < .05) return 'plain';
                if (rgb.g > rgb.r * 1.28 && rgb.g > rgb.b * 1.12) return 'success';
                if (rgb.r > rgb.g * 1.28 && rgb.r > rgb.b * 1.08) return 'failure';
                if (rgb.r > 90 && rgb.g > 65 && rgb.b < Math.min(rgb.r, rgb.g) * .82) return 'highlight';
                return 'neutral';
              }
          
              function extractEntry(sourceEntry, index) {
                const entryRect = sourceEntry.getBoundingClientRect();
                const regionIds = new WeakMap();
