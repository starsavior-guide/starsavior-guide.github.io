          NODE
          node .journey-capture.mjs
          rm -f .journey-capture.mjs

      - name: Replace Arcana events from Arcana detail pages
        shell: bash
        run: |
          cat > .arcana-journey-capture.mjs <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import crypto from 'node:crypto';
          import { chromium } from 'playwright';

          const ROOT = process.cwd();
          const ARCANA_ROOT = 'https://star-savior-arcana-db.pages.dev/arcana';
          const APP_PATH = path.join(ROOT, 'app.js');
          const OUT_DIR = path.join(ROOT, 'data', 'journey');
          const ASSET_DIR = path.join(ROOT, 'data', 'journey-assets');
          const META_PATH = path.join(OUT_DIR, 'backup-meta.json');
          const LANGUAGES = [
