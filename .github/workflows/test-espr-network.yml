name: Test ESPR network path

on:
  push:
    paths:
      - '.tmp/espr-network-test-trigger.txt'

permissions:
  contents: read

jobs:
  network-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Test current sync endpoints
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const targets = [
            ['mirror-saviors', 'https://star-savior-arcana-db.pages.dev/data/saviors.json', 'json'],
            ['mirror-arcanas', 'https://star-savior-arcana-db.pages.dev/data/arcanas.json', 'json'],
            ['cdn-portrait', 'https://ss.esprcdn.dev/images/characters/portrait/1058.webp', 'image'],
            ['official-page', 'https://ss.espr.gg/ko/database/characters', 'html']
          ];
          let failedCurrentPath = false;
          for (const [name, url, kind] of targets) {
            try {
              const controller = new AbortController();
              const timer = setTimeout(() => controller.abort(), 30000);
              const res = await fetch(url, {
                redirect: 'follow',
                signal: controller.signal,
                headers: {
                  'user-agent': 'starsavior-guide-network-test/1.0',
                  accept: kind === 'json' ? 'application/json' : kind === 'image' ? 'image/*' : 'text/html,*/*'
                }
              });
              clearTimeout(timer);
              const body = Buffer.from(await res.arrayBuffer());
              console.log(JSON.stringify({
                name,
                status: res.status,
                ok: res.ok,
                contentType: res.headers.get('content-type') || '',
                bytes: body.length,
                finalUrl: res.url
              }));
              if (name !== 'official-page' && (!res.ok || res.status === 429 || body.length < 20)) failedCurrentPath = true;
            } catch (error) {
              console.log(JSON.stringify({ name, error: error?.message || String(error) }));
              if (name !== 'official-page') failedCurrentPath = true;
            }
          }
          if (failedCurrentPath) process.exitCode = 1;
          NODE
