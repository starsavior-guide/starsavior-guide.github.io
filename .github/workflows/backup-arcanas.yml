name: Backup Arcana database

on:
  workflow_dispatch:
    inputs:
      refresh_all:
        description: 'Download every Arcana image again'
        required: false
        default: false
        type: boolean
  push:
    paths:
      - '.github/workflows/backup-arcanas.yml'
      - 'scripts/backup-arcanas.mjs'

permissions:
  contents: write

concurrency:
  group: starsavior-source-backup-write
  cancel-in-progress: false

jobs:
  backup-arcanas:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Validate backup script
        run: node --check scripts/backup-arcanas.mjs

      - name: Refresh local Arcana archive
        env:
          REFRESH_ALL: ${{ github.event.inputs.refresh_all || 'false' }}
        run: node scripts/backup-arcanas.mjs

      - name: Validate local Arcana archive
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const archive = JSON.parse(fs.readFileSync('data/arcanas/arcanas.json', 'utf8'));
          const manifest = JSON.parse(fs.readFileSync('data/arcanas/manifest.json', 'utf8'));
          const expectedLanguages = JSON.stringify(['ko', 'en', 'ja']);

          if (JSON.stringify(archive.languages) !== expectedLanguages || JSON.stringify(manifest.languages) !== expectedLanguages) {
            throw new Error('Only Korean, English, and Japanese are allowed.');
          }
          if (!archive.localOnly || !manifest.localOnly) {
            throw new Error('The Arcana archive must be local-only.');
          }
          if (!Array.isArray(archive.arcanas) || archive.arcanas.length < 79) {
            throw new Error('The Arcana archive is incomplete.');
          }

          const eventCount = archive.arcanas.reduce((sum, arcana) => sum + (arcana.events?.length || 0), 0);
          const choiceCount = archive.arcanas.reduce((sum, arcana) => (
            sum + (arcana.events || []).reduce((inner, event) => inner + (event.choices?.length || 0), 0)
          ), 0);
          if (manifest.arcanaCount !== archive.arcanas.length || manifest.eventCount !== eventCount || manifest.choiceCount !== choiceCount) {
            throw new Error('The Arcana manifest counts do not match the archive.');
          }
          if (eventCount < 191 || choiceCount < 236) {
            throw new Error('The Arcana event archive is incomplete.');
          }

          const forbiddenLanguageKeys = new Set(['zh', 'zh-CN', 'zh-TW', 'cn', 'tw', 'zhs', 'zht']);
          const assetPaths = new Set();
          function inspect(value) {
            if (Array.isArray(value)) {
              value.forEach(inspect);
              return;
            }
            if (!value || typeof value !== 'object') return;
            const keys = Object.keys(value);
            if (keys.some((key) => forbiddenLanguageKeys.has(key))) {
              throw new Error('A disallowed language key exists in the Arcana archive.');
            }
            if (keys.some((key) => ['ko', 'en', 'ja'].includes(key))) {
              const languageKeys = keys.filter((key) => ['ko', 'en', 'ja'].includes(key)).sort();
              if (JSON.stringify(languageKeys) !== JSON.stringify(['en', 'ja', 'ko'])) {
                throw new Error('A localized Arcana value is incomplete.');
              }
            }
            for (const [key, child] of Object.entries(value)) {
              if (['image', 'icon', 'background', 'mainStatIcon'].includes(key) && typeof child === 'string' && child) {
                if (!child.startsWith('./data/arcana-assets/')) {
                  throw new Error(`Non-local Arcana asset path: ${child}`);
                }
                assetPaths.add(child.replace(/^\.\//, ''));
              }
              inspect(child);
            }
          }
          inspect(archive);

          if (assetPaths.size !== manifest.assetCount) {
            throw new Error(`Arcana asset count mismatch: ${assetPaths.size} != ${manifest.assetCount}`);
          }
          for (const filename of assetPaths) {
            if (!fs.existsSync(filename) || fs.statSync(filename).size < 20) {
              throw new Error(`Missing or empty Arcana asset: ${filename}`);
            }
          }
          NODE

      - name: Validate generated changes
        run: git diff --check

      - name: Commit local Arcana archive
        shell: bash
        run: |
          if [ -z "$(git status --porcelain -- data/arcanas data/arcana-assets)" ]; then
            echo 'No Arcana archive changes to commit.'
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/arcanas data/arcana-assets
          git commit -m 'Refresh local Arcana database'
          git pull --rebase origin main
          git push origin HEAD:main
