name: Backup Arcana database from ESPR

on:
  workflow_dispatch:
    inputs:
      refresh_all:
        description: 'Download every Arcana/Potential image again'
        required: false
        default: false
        type: boolean
  push:
    paths:
      - '.github/workflows/backup-arcanas.yml'
      - 'scripts/espr-common.mjs'
      - 'scripts/backup-espr-arcanas.mjs'
      - 'scripts/backup-arcanas.mjs'
      - 'scripts/backup-arcana-events.mjs'

permissions:
  contents: write

concurrency:
  group: starsavior-source-backup-write
  cancel-in-progress: false

jobs:
  backup-arcanas:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install Chromium scraper
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Validate ESPR Arcana scripts
        run: |
          node --check scripts/espr-common.mjs
          node --check scripts/backup-espr-arcanas.mjs
          node --check scripts/backup-arcana-events.mjs

      - name: Refresh Arcana archive from ESPR
        env:
          REFRESH_ALL: ${{ github.event.inputs.refresh_all || 'false' }}
        run: node scripts/backup-espr-arcanas.mjs

      - name: Refresh Journey Arcana mirror
        run: node scripts/backup-arcana-events.mjs

      - name: Validate local Arcana archive
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const archive = JSON.parse(fs.readFileSync('data/arcanas/arcanas.json', 'utf8'));
          const manifest = JSON.parse(fs.readFileSync('data/arcanas/manifest.json', 'utf8'));
          if (archive.sourceOrigin !== 'https://ss.espr.gg' || manifest.sourceOrigin !== 'https://ss.espr.gg') throw new Error('Arcana source is not ESPR.');
          if (JSON.stringify(archive.languages) !== JSON.stringify(['ko','en','ja'])) throw new Error('Arcana languages must be ko/en/ja.');
          if (!archive.localOnly || !manifest.localOnly) throw new Error('Arcana archive must remain local-only.');
          if (!Array.isArray(archive.arcanas) || archive.arcanas.length < 80) throw new Error(`Arcana archive incomplete (${archive.arcanas?.length ?? 0}).`);
          if (!Array.isArray(archive.potentials) || archive.potentials.length < 50) throw new Error('Potential archive incomplete.');
          if (manifest.arcanaCount !== archive.arcanas.length || manifest.potentialCount !== archive.potentials.length) throw new Error('Arcana manifest mismatch.');
          for (const arcana of archive.arcanas) {
            if (!arcana.image?.startsWith('./data/arcana-assets/cards/')) throw new Error(`Non-local Arcana image: ${arcana.image}`);
            const filename = arcana.image.replace(/^\.\//, '');
            if (!fs.existsSync(filename) || fs.statSync(filename).size < 20) throw new Error(`Missing Arcana image: ${filename}`);
          }
          NODE

      - name: Validate generated changes
        run: git diff --check

      - name: Commit ESPR Arcana archive
        shell: bash
        run: |
          if [ -z "$(git status --porcelain -- data/arcanas data/arcana-assets data/journey data/journey-assets)" ]; then
            echo 'No Arcana changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/arcanas data/arcana-assets data/journey data/journey-assets
          git commit -m 'Refresh Arcana database from ESPR'
          git pull --rebase origin main
          git push origin HEAD:main
