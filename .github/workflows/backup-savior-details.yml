name: Backup Savior details

on:
  push:
    paths:
      - '.github/workflows/backup-savior-details.yml'
      - 'app.js'
  workflow_dispatch:
    inputs:
      refresh_all:
        description: 'Refresh every Savior snapshot, even if a backup already exists'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: starsavior-source-backup-write
  cancel-in-progress: false

jobs:
  backup-savior-details:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install browser
        shell: bash
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Backup Savior detail pages
        shell: bash
        env:
          REFRESH_ALL: ${{ github.event.inputs.refresh_all || 'false' }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import crypto from 'node:crypto';
          import { chromium } from 'playwright';

          const ROOT = process.cwd();
          const APP_PATH = path.join(ROOT, 'app.js');
          const OUT_DIR = path.join(ROOT, 'data', 'saviors');
          const ASSET_DIR = path.join(ROOT, 'data', 'savior-detail-assets');
          const INDEX_PATH = path.join(OUT_DIR, 'index.json');
          const SOURCE_ORIGIN = 'https://star-savior-arcana-db.pages.dev';
          const SOURCE_ROOT = `${SOURCE_ORIGIN}/savior`;
          const SOURCE_SAVIORS_URL = `${SOURCE_ORIGIN}/data/saviors.json`;
          const refreshAll = String(process.env.REFRESH_ALL || 'false').toLowerCase() === 'true';

          if (!fs.existsSync(APP_PATH)) {
            throw new Error('app.js was not found in the repository root.');
          }

          fs.mkdirSync(OUT_DIR, { recursive: true });
          fs.mkdirSync(ASSET_DIR, { recursive: true });

          const appText = fs.readFileSync(APP_PATH, 'utf8');
          const idBlock = appText.match(/const\s+SAVIOR_DETAIL_IDS\s*=\s*\{([\s\S]*?)\n\};/);
          if (!idBlock) {
            throw new Error('Could not find SAVIOR_DETAIL_IDS in app.js.');
          }

          const entries = [...idBlock[1].matchAll(/["']([^"']+)["']\s*:\s*(\d+)/g)]
            .map((m) => ({ key: m[1], id: Number(m[2]) }));

          if (!entries.length) {
            throw new Error('No Savior detail IDs were found in app.js.');
          }

          let oldIndex = {};
          if (fs.existsSync(INDEX_PATH)) {
            try {
              oldIndex = JSON.parse(fs.readFileSync(INDEX_PATH, 'utf8'));
            } catch (_) {}
          }

          const staticById = new Map(entries.map((entry) => [entry.id, entry]));
          const sourceResponse = await fetch(SOURCE_SAVIORS_URL, { headers: { accept: 'application/json' } });
          if (!sourceResponse.ok) throw new Error(`Could not load source Savior list (HTTP ${sourceResponse.status}).`);
          const sourceSaviors = await sourceResponse.json();
          if (!Array.isArray(sourceSaviors) || sourceSaviors.length < 52) {
            throw new Error(`Source Savior list is incomplete (${sourceSaviors?.length ?? 'invalid'}).`);
          }

          const uniqueById = new Map();
          for (const sourceSavior of sourceSaviors) {
            const id = Number(sourceSavior?.id);
            if (!id) continue;
            uniqueById.set(id, staticById.get(id) || { key: `source-${id}`, id });
          }
          for (const entry of entries) {
            if (!uniqueById.has(entry.id)) uniqueById.set(entry.id, entry);
          }
          const saviors = [...uniqueById.values()].sort((a, b) => a.id - b.id);

          function safeExt(url, contentType = '') {
            try {
              const ext = path.extname(new URL(url).pathname).toLowerCase();
              if (/^\.(webp|png|jpe?g|gif|svg|avif)$/.test(ext)) return ext;
            } catch (_) {}
            if (/webp/i.test(contentType)) return '.webp';
            if (/png/i.test(contentType)) return '.png';
            if (/jpe?g/i.test(contentType)) return '.jpg';
            if (/gif/i.test(contentType)) return '.gif';
            if (/svg/i.test(contentType)) return '.svg';
            if (/avif/i.test(contentType)) return '.avif';
            return '.bin';
          }

          async function downloadAsset(request, url) {
            if (!url || !/^https?:\/\//i.test(url)) return url;
            const hash = crypto.createHash('sha256').update(url).digest('hex').slice(0, 24);
            let response;
            try {
              response = await request.get(url, { timeout: 45000 });
              if (!response.ok()) throw new Error(`HTTP ${response.status()}`);
            } catch (error) {
              console.warn(`asset skipped: ${url} (${error.message})`);
              return url;
            }
            const contentType = response.headers()['content-type'] || '';
            const ext = safeExt(url, contentType);
            const filename = `${hash}${ext}`;
            const dest = path.join(ASSET_DIR, filename);
            if (!fs.existsSync(dest) || fs.statSync(dest).size < 20) {
              fs.writeFileSync(dest, await response.body());
            }
            return `../savior-detail-assets/${filename}`;
          }

          function snapshotShell(title, content, sourceUrl, capturedAt) {
            const escapedTitle = String(title || 'Savior details')
              .replaceAll('&', '&amp;').replaceAll('<', '&lt;').replaceAll('>', '&gt;')
              .replaceAll('"', '&quot;');
            return `<!doctype html>
          <html lang="ko">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <meta name="color-scheme" content="dark light">
            <title>${escapedTitle}</title>
            <style>
              :root{color-scheme:dark;--bg:#020817;--panel:#07101f;--panel2:#0a1426;--line:#28354a;--text:#f4f7ff;--muted:#a8b2c7;--accent:#6f8dff}
              *{box-sizing:border-box}
              html,body{margin:0;padding:0;background:transparent;color:var(--text);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
              body{padding:2px 2px 18px;line-height:1.65;overflow-wrap:anywhere}
              main,.snapshot-root{display:block}
              h1,h2,h3,h4,h5,h6{color:var(--text);line-height:1.3;margin:22px 0 12px;letter-spacing:-.03em}
              h1{font-size:26px}h2{font-size:22px}h3{font-size:18px}h4,h5,h6{font-size:16px}
              p{margin:10px 0;color:var(--text)}
              small,.muted,[class*="muted"],[class*="desc"],[class*="sub"]{color:var(--muted)}
              section,article,[class*="card"],[class*="panel"],[class*="skill"],[class*="stat"]{max-width:100%}
              section+section{margin-top:16px}
              img,svg,video,canvas{max-width:100%;height:auto}
              img{border-radius:12px}
              table{width:100%;border-collapse:collapse;margin:12px 0;font-size:14px}
              th,td{border:1px solid var(--line);padding:9px 10px;text-align:left;vertical-align:top}
              th{background:var(--panel2)}
              ul,ol{padding-left:1.35rem}
              li+li{margin-top:5px}
              a{color:#9db0ff;text-decoration:none}
              button,input,select,textarea{font:inherit}
              details{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:10px 0;background:var(--panel)}
              details>summary{font-weight:800;cursor:default}
              .snapshot-meta{margin:0 0 14px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;color:var(--muted);font-size:12px;background:rgba(8,16,31,.75)}
              .snapshot-root>*:first-child{margin-top:0}
              [hidden]{display:block!important}
            </style>
          </head>
          <body>
            <div class="snapshot-meta">백업 기준: ${capturedAt}</div>
            <main class="snapshot-root">${content}</main>
          </body>
          </html>`;
          }

          const browser = await chromium.launch({ headless: true });
          const context = await browser.newContext({
            locale: 'ko-KR',
            viewport: { width: 1280, height: 1600 }
          });
          const page = await context.newPage();
          page.setDefaultTimeout(60000);

          const newIndex = { ...oldIndex };
          const failures = [];

          for (const [position, savior] of saviors.entries()) {
            const outputPath = path.join(OUT_DIR, `${savior.id}.html`);
            const previousPortrait = oldIndex[String(savior.id)]?.profile?.portrait || '';
            if (!refreshAll && previousPortrait && fs.existsSync(outputPath) && fs.statSync(outputPath).size > 500) {
              console.log(`[${position + 1}/${saviors.length}] keep ${savior.key} (${savior.id})`);
              newIndex[String(savior.id)] = {
                ...(newIndex[String(savior.id)] || {}),
                key: savior.key,
                id: savior.id,
                file: `./${savior.id}.html`,
                source: `${SOURCE_ROOT}/${savior.id}`
              };
              continue;
            }

            const sourceUrl = `${SOURCE_ROOT}/${savior.id}`;
            console.log(`[${position + 1}/${saviors.length}] capture ${savior.key} (${savior.id})`);

            let success = false;
            let lastError;
            for (let attempt = 1; attempt <= 3 && !success; attempt++) {
              try {
                await page.goto(sourceUrl, { waitUntil: 'domcontentloaded', timeout: 60000 });
                try { await page.waitForLoadState('networkidle', { timeout: 20000 }); } catch (_) {}
                await page.waitForFunction(() => (document.body?.innerText || '').trim().length > 300, null, { timeout: 30000 });
                await page.waitForTimeout(1500);

                const debugInfo = await page.evaluate(() => ({
                  title: document.title,
                  url: location.href,
                  bodyText: (document.body?.innerText || '').trim().length,
                  mainText: (document.querySelector('main')?.innerText || '').trim().length,
                  rootText: (document.querySelector('#root')?.innerText || '').trim().length,
                  nextText: (document.querySelector('#__next')?.innerText || '').trim().length
                }));
                console.log(`loaded ${debugInfo.url} body=${debugInfo.bodyText} main=${debugInfo.mainText} root=${debugInfo.rootText} next=${debugInfo.nextText}`);

                // Expand ordinary accordion controls so their hidden skill/detail text is present in the snapshot.
                try {
                  const expandable = page.locator('button[aria-expanded=\"false\"]');
                  const count = await expandable.count();
                  for (let i = 0; i < count; i++) {
                    const control = expandable.nth(i);
                    const label = ((await control.innerText().catch(() => '')) || '').replace(/\s+/g, ' ').trim();
                    if (/한국어|English|日本語|뒤로/.test(label)) continue;
                    await control.click({ timeout: 1500 }).catch(() => {});
                  }
                } catch (_) {}

                // Trigger lazy-loaded assets before cloning.
                await page.evaluate(async () => {
                  const total = Math.max(document.body.scrollHeight, document.documentElement.scrollHeight);
                  const step = Math.max(500, Math.floor(window.innerHeight * 0.8));
                  for (let y = 0; y < total; y += step) {
                    window.scrollTo(0, y);
                    await new Promise((resolve) => setTimeout(resolve, 35));
                  }
                  window.scrollTo(0, 0);
                });
                await page.waitForTimeout(500);

                const snapshot = await page.evaluate(() => {
                  // Build the backup from a DOM Range instead of deleting structural wrappers.
                  // This avoids wiping the whole page when Illustration/Arc Point or footer text
                  // lives inside a large application container.
                  const body = document.body;

                  const normalize = (value) => String(value || '').replace(/\s+/g, ' ').trim();
                  const badges = [...body.querySelectorAll('[class*="savior-detail_badges"] span')]
                    .map((el) => normalize(el.textContent))
                    .filter(Boolean);
                  const pickBadge = (values) => badges.find((badge) => values.includes(badge)) || '';
                  const grade = pickBadge(['SSR', 'SR', 'R']);
                  const element = pickBadge(['태양', '달', '별', '질서', '혼돈']);
                  const className = pickBadge(['스트라이커', '어쌔신', '레인저', '캐스터', '디펜더', '서포터']);
                  const attackType = badges.find((badge) => ![grade, element, className].includes(badge)) || '';
                  const factValues = {};
                  body.querySelectorAll('strong').forEach((label) => {
                    const key = normalize(label.textContent);
                    if (!['생일', '신장', '출신', '소속', 'CV (KR)', 'CV (JP)'].includes(key)) return;
                    const value = label.nextElementSibling || label.parentElement?.querySelector('span:last-child');
                    factValues[key] = normalize(value?.textContent);
                  });
                  const profileName = normalize(body.querySelector('[class*="savior-detail_name-row"] h2, [class*="savior-detail_savior-info"] h2')?.textContent);
                  const portrait = [...body.querySelectorAll('img')].find((img) => {
                    const alt = normalize(img.getAttribute('alt'));
                    const src = img.getAttribute('src') || img.src || '';
                    return /\/images\/icon\/portrait\//i.test(src) || (profileName && alt === profileName);
                  });
                  const portraitUrl = portrait
                    ? new URL(portrait.getAttribute('src') || portrait.src, document.baseURI).href
                    : '';
                  const illustration = [...body.querySelectorAll('img')].find((img) => {
                    const alt = normalize(img.getAttribute('alt'));
                    const src = img.getAttribute('src') || img.src || '';
                    return alt === 'Savior Illustration' || /(?:%EC%9D%BC%EB%9F%AC%EC%8A%A4%ED%8A%B8|일러스트)/i.test(src);
                  });
                  const illustrationUrl = illustration
                    ? new URL(illustration.getAttribute('src') || illustration.src, document.baseURI).href
                    : '';
                  const profile = {
                    name: profileName,
                    grade,
                    element,
                    className,
                    attackType,
                    description: normalize(body.querySelector('[class*="savior-detail_savior-desc"]')?.textContent),
                    birthday: factValues['생일'] || '',
                    height: factValues['신장'] || '',
                    origin: factValues['출신'] || '',
                    affiliation: factValues['소속'] || '',
                    cvKr: factValues['CV (KR)'] || '',
                    cvJp: factValues['CV (JP)'] || ''
                  };
                  const markerCandidates = [...body.querySelectorAll('h1,h2,h3,h4,h5,h6,[role="heading"],p,span,strong')];
                  const marker = markerCandidates.find((el) => {
                    const text = normalize(el.textContent);
                    return text === '일러스트' || /^아크\s*포인트(?:\s|$|\()/.test(text);
                  });

                  const range = document.createRange();
                  range.setStart(body, 0);
                  if (marker) {
                    range.setEndBefore(marker);
                  } else {
                    range.setEnd(body, body.childNodes.length);
                  }

                  const wrapper = document.createElement('div');
                  wrapper.className = 'captured-savior-detail';
                  wrapper.appendChild(range.cloneContents());

                  // Remove executable/source-site chrome only. Do not remove ancestor wrappers by text.
                  wrapper.querySelectorAll('script,noscript,style,link,nav,footer,form,dialog').forEach((el) => el.remove());
                  wrapper.querySelectorAll('header').forEach((el) => el.remove());
                  wrapper.querySelectorAll('details').forEach((el) => el.setAttribute('open', ''));
                  wrapper.querySelectorAll('[hidden]').forEach((el) => el.removeAttribute('hidden'));
                  wrapper.querySelectorAll('[aria-hidden="true"]').forEach((el) => el.removeAttribute('aria-hidden'));
                  wrapper.querySelectorAll('[inert]').forEach((el) => el.removeAttribute('inert'));

                  // Remove only obvious navigation controls. Skill/detail content has already been expanded above.
                  wrapper.querySelectorAll('button,select,input,textarea').forEach((el) => {
                    const text = normalize(el.textContent || el.getAttribute('aria-label') || el.getAttribute('title'));
                    if (!text || /^(뒤로|한국어|English|日本語|터치하여 확인)$/.test(text)) {
                      el.remove();
                    }
                  });

                  // A source-site top bar may be a plain div rather than <header>. Only remove very small
                  // containers whose direct text is clearly the language/back navigation itself.
                  [...wrapper.querySelectorAll('div')].forEach((el) => {
                    if (el.children.length > 8) return;
                    const own = normalize([...el.childNodes]
                      .filter((n) => n.nodeType === Node.TEXT_NODE)
                      .map((n) => n.textContent)
                      .join(' '));
                    if (own && own.length < 80 && /^(구원자\s*)?(한국어|English|日本語)/.test(own)) {
                      el.remove();
                    }
                  });

                  const assetUrls = new Set();
                  wrapper.querySelectorAll('img').forEach((img) => {
                    const raw = img.getAttribute('src') || img.src || '';
                    if (!raw) return;
                    const abs = new URL(raw, document.baseURI).href;
                    img.setAttribute('src', abs);
                    img.removeAttribute('srcset');
                    assetUrls.add(abs);
                  });
                  wrapper.querySelectorAll('source').forEach((sourceEl) => {
                    const raw = sourceEl.getAttribute('src') || '';
                    if (raw) {
                      const abs = new URL(raw, document.baseURI).href;
                      sourceEl.setAttribute('src', abs);
                      assetUrls.add(abs);
                    }
                    sourceEl.removeAttribute('srcset');
                  });
                  wrapper.querySelectorAll('a[href]').forEach((a) => {
                    try {
                      a.setAttribute('href', new URL(a.getAttribute('href'), document.baseURI).href);
                    } catch (_) {}
                    a.setAttribute('target', '_blank');
                    a.setAttribute('rel', 'noopener noreferrer');
                  });

                  const cleanedTextLength = normalize(wrapper.innerText || wrapper.textContent).length;
                  return {
                    title: document.title,
                    html: wrapper.innerHTML,
                    assets: [...assetUrls],
                    cleanedTextLength,
                    markerText: marker ? normalize(marker.textContent) : '',
                    markerFound: Boolean(marker),
                    profile,
                    portraitUrl,
                    illustrationUrl
                  };
                });
                const plainLength = (snapshot.html || '').replace(/<[^>]*>/g, '').replace(/\s+/g, ' ').trim().length;
                console.log(`snapshot cleaned=${snapshot.cleanedTextLength || 0} plain=${plainLength} assets=${snapshot.assets.length} marker=${snapshot.markerFound ? snapshot.markerText : "none"}`);
                if (!snapshot.html || plainLength < 300) {
                  const bodyPreview = await page.evaluate(() => (document.body?.innerText || '').replace(/\s+/g, ' ').trim().slice(0, 220));
                  throw new Error(`Captured Savior content was unexpectedly empty (snapshot=${plainLength}). body preview: ${bodyPreview}`);
                }

                let html = snapshot.html;
                for (const assetUrl of snapshot.assets) {
                  const localUrl = await downloadAsset(context.request, assetUrl);
                  if (localUrl && localUrl !== assetUrl) {
                    html = html.split(assetUrl).join(localUrl);
                  }
                }

                const previousEntry = oldIndex[String(savior.id)] || {};
                const previousProfile = previousEntry.profile || {};
                let portrait = previousProfile.portrait || '';
                if (snapshot.portraitUrl) {
                  const localPortrait = await downloadAsset(context.request, snapshot.portraitUrl);
                  if (localPortrait && localPortrait !== snapshot.portraitUrl) {
                    portrait = `./data/${localPortrait.replace(/^\.\.\//, '')}`;
                  }
                }
                let illustration = previousProfile.illustration || '';
                if (snapshot.illustrationUrl) {
                  const localIllustration = await downloadAsset(context.request, snapshot.illustrationUrl);
                  if (localIllustration && localIllustration !== snapshot.illustrationUrl) {
                    illustration = `./data/${localIllustration.replace(/^\.\.\//, '')}`;
                  }
                }
                const profile = {
                  ...previousProfile,
                  ...Object.fromEntries(Object.entries(snapshot.profile || {}).filter(([, value]) => value)),
                  portrait,
                  illustration
                };

                const capturedAt = new Date().toISOString();
                fs.writeFileSync(outputPath, snapshotShell(snapshot.title, html, sourceUrl, capturedAt), 'utf8');
                newIndex[String(savior.id)] = {
                  key: savior.key,
                  id: savior.id,
                  file: `./${savior.id}.html`,
                  source: sourceUrl,
                  capturedAt,
                  profile
                };
                success = true;
              } catch (error) {
                lastError = error;
                console.warn(`attempt ${attempt} failed: ${error.message}`);
                if (attempt < 3) await page.waitForTimeout(attempt * 2000);
              }
            }

            if (!success) failures.push(`${savior.key} (${savior.id}): ${lastError?.message || 'unknown error'}`);
          }

          await browser.close();

          // Older workflow versions stored asset paths relative to the snapshot HTML.
          // Normalize portrait/illustration paths for use from the site's root page as well.
          for (const savior of saviors) {
            const entry = newIndex[String(savior.id)];
            if (!entry?.profile) continue;
            for (const field of ['portrait', 'illustration']) {
              const value = entry.profile[field];
              if (!value) continue;
              entry.profile[field] = String(value)
                .replace(/^\.\.\/savior-detail-assets\//, './data/savior-detail-assets/')
                .replace(/^\.\/savior-detail-assets\//, './data/savior-detail-assets/')
                .replace(/^savior-detail-assets\//, './data/savior-detail-assets/');
            }
          }

          newIndex._meta = {
            sourceRoot: SOURCE_ROOT,
            generatedAt: new Date().toISOString(),
            count: saviors.length,
            profileCount: saviors.filter((savior) => newIndex[String(savior.id)]?.profile).length,
            portraitCount: saviors.filter((savior) => newIndex[String(savior.id)]?.profile?.portrait).length,
            illustrationCount: saviors.filter((savior) => newIndex[String(savior.id)]?.profile?.illustration).length,
            profileFields: ['name', 'grade', 'element', 'className', 'attackType', 'description', 'birthday', 'height', 'origin', 'affiliation', 'cvKr', 'cvJp', 'portrait', 'illustration'],
            assetsRoot: './data/savior-detail-assets',
            excludedSnapshotSections: ['일러스트', '아크 포인트']
          };
          fs.writeFileSync(INDEX_PATH, JSON.stringify(newIndex, null, 2) + '\n', 'utf8');

          if (failures.length) {
            console.error('\nFailed Savior pages:');
            failures.forEach((failure) => console.error(`- ${failure}`));
            process.exit(2);
          }

          console.log(`Backed up ${saviors.length} Savior detail entries.`);
          NODE

      - name: Commit Savior backups
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/saviors data/savior-detail-assets
          if git diff --cached --quiet; then
            echo "No Savior backup changes to commit."
          else
            git commit -m "Backup Savior details"
            for attempt in 1 2 3; do
              if git pull --rebase origin main && git push origin HEAD:main; then
                exit 0
              fi
              git rebase --abort 2>/dev/null || true
              if [ "$attempt" -lt 3 ]; then
                echo "Push attempt $attempt failed; retrying after remote refresh."
                sleep $((attempt * 2))
              fi
            done
            echo "Failed to push Savior backups after 3 attempts."
            exit 1
          fi
