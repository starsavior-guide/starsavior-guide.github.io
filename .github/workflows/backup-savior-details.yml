name: Backup Savior details

on:
  push:
    paths:
      - '.github/workflows/backup-savior-details.yml'
      - 'app.js'
  workflow_dispatch:
    inputs:
      refresh_all:
        description: 'Refresh every Savior snapshot, even if a backup already exists'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: savior-backup-write
  cancel-in-progress: false

jobs:
  backup-savior-details:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install browser
        shell: bash
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Backup Savior detail pages in KO EN JA
        shell: bash
        env:
          REFRESH_ALL: ${{ github.event.inputs.refresh_all || 'false' }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import crypto from 'node:crypto';
          import { chromium } from 'playwright';

          const ROOT = process.cwd();
          const APP_PATH = path.join(ROOT, 'app.js');
          const OUT_DIR = path.join(ROOT, 'data', 'saviors');
          const ASSET_DIR = path.join(ROOT, 'data', 'savior-detail-assets');
          const INDEX_PATH = path.join(OUT_DIR, 'index.json');
          const SOURCE_ROOT = 'https://star-savior-arcana-db.pages.dev/savior';
          const refreshAll = String(process.env.REFRESH_ALL || 'false').toLowerCase() === 'true';
          const LANGUAGES = [
            { code: 'ko', label: '한국어', html: 'ko', locale: 'ko-KR' },
            { code: 'en', label: 'English', html: 'en', locale: 'en-US' },
            { code: 'ja', label: '日本語', html: 'ja', locale: 'ja-JP' }
          ];
          const ALL_LANGUAGE_LABELS = /^(한국어|English|日本語)$/;

          if (!fs.existsSync(APP_PATH)) throw new Error('app.js was not found in the repository root.');
          fs.mkdirSync(OUT_DIR, { recursive: true });
          fs.mkdirSync(ASSET_DIR, { recursive: true });
          for (const language of LANGUAGES.filter((item) => item.code !== 'ko')) {
            fs.mkdirSync(path.join(OUT_DIR, language.code), { recursive: true });
          }

          const appText = fs.readFileSync(APP_PATH, 'utf8');
          const idBlock = appText.match(/const\s+SAVIOR_DETAIL_IDS\s*=\s*\{([\s\S]*?)\n\};/);
          if (!idBlock) throw new Error('Could not find SAVIOR_DETAIL_IDS in app.js.');
          const entries = [...idBlock[1].matchAll(/["']([^"']+)["']\s*:\s*(\d+)/g)]
            .map((m) => ({ key: m[1], id: Number(m[2]) }));
          if (!entries.length) throw new Error('No Savior detail IDs were found in app.js.');
          const saviors = [...new Map(entries.map((entry) => [entry.id, entry])).values()].sort((a, b) => a.id - b.id);

          let oldIndex = {};
          if (fs.existsSync(INDEX_PATH)) {
            try { oldIndex = JSON.parse(fs.readFileSync(INDEX_PATH, 'utf8')); } catch (_) {}
          }
          const newIndex = { ...oldIndex };

          const outputPathFor = (id, language) => language === 'ko'
            ? path.join(OUT_DIR, `${id}.html`)
            : path.join(OUT_DIR, language, `${id}.html`);
          const indexFileFor = (id, language) => language === 'ko'
            ? `./${id}.html`
            : `./${language}/${id}.html`;
          const assetPrefixFor = (language) => language === 'ko' ? '../savior-detail-assets/' : '../../savior-detail-assets/';

          function safeExt(url, contentType = '') {
            try {
              const ext = path.extname(new URL(url).pathname).toLowerCase();
              if (/^\.(webp|png|jpe?g|gif|svg|avif)$/.test(ext)) return ext;
            } catch (_) {}
            if (/webp/i.test(contentType)) return '.webp';
            if (/png/i.test(contentType)) return '.png';
            if (/jpe?g/i.test(contentType)) return '.jpg';
            if (/gif/i.test(contentType)) return '.gif';
            if (/svg/i.test(contentType)) return '.svg';
            if (/avif/i.test(contentType)) return '.avif';
            return '.bin';
          }

          async function downloadAsset(request, url, language) {
            if (!url || !/^https?:\/\//i.test(url)) return url;
            const hash = crypto.createHash('sha256').update(url).digest('hex').slice(0, 24);
            let response;
            try {
              response = await request.get(url, { timeout: 45000 });
              if (!response.ok()) throw new Error(`HTTP ${response.status()}`);
            } catch (error) {
              console.warn(`asset skipped: ${url} (${error.message})`);
              return url;
            }
            const contentType = response.headers()['content-type'] || '';
            const ext = safeExt(url, contentType);
            const filename = `${hash}${ext}`;
            const dest = path.join(ASSET_DIR, filename);
            if (!fs.existsSync(dest) || fs.statSync(dest).size < 20) fs.writeFileSync(dest, await response.body());
            return `${assetPrefixFor(language)}${filename}`;
          }

          function snapshotShell(title, content, capturedAt, language) {
            const escapedTitle = String(title || 'Savior details')
              .replaceAll('&', '&amp;').replaceAll('<', '&lt;').replaceAll('>', '&gt;').replaceAll('"', '&quot;');
            return `<!doctype html>
          <html lang="${language.html}">
          <head>
            <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
            <title>${escapedTitle}</title>
          </head>
          <body>
            <div class="snapshot-meta" data-language="${language.code}" data-captured-at="${capturedAt}"></div>
            <main class="snapshot-root">${content}</main>
          </body>
          </html>`;
          }

          async function selectNativeLanguage(page, targetLabel) {
            const selects = page.locator('select');
            for (let i = 0; i < await selects.count(); i++) {
              const select = selects.nth(i);
              const options = await select.locator('option').allTextContents().catch(() => []);
              if (!options.some((text) => text.replace(/\s+/g, ' ').trim() === targetLabel)) continue;
              await select.selectOption({ label: targetLabel });
              return true;
            }
            return false;
          }

          async function selectCustomLanguage(page, targetLabel) {
            const triggers = page.locator('button,[role="button"]').filter({ hasText: /한국어|English|日本語/ });
            let trigger = null;
            for (let i = 0; i < await triggers.count(); i++) {
              const candidate = triggers.nth(i);
              if (!await candidate.isVisible().catch(() => false)) continue;
              const text = ((await candidate.innerText().catch(() => '')) || '').replace(/\s+/g, ' ').trim();
              if (ALL_LANGUAGE_LABELS.test(text)) { trigger = candidate; break; }
            }
            if (!trigger) return false;
            await trigger.click({ timeout: 3000 });
            await page.waitForTimeout(150);

            const exactCandidates = page.getByText(targetLabel, { exact: true });
            for (let i = (await exactCandidates.count()) - 1; i >= 0; i--) {
              const candidate = exactCandidates.nth(i);
              if (!await candidate.isVisible().catch(() => false)) continue;
              const clickable = candidate.locator('xpath=ancestor-or-self::*[self::button or @role="option" or @role="menuitem" or self::li][1]');
              if (await clickable.count()) await clickable.first().click({ timeout: 3000 }).catch(() => candidate.click({ timeout: 3000 }));
              else await candidate.click({ timeout: 3000 });
              return true;
            }
            return false;
          }

          async function setSourceLanguage(page, language) {
            let changed = await selectNativeLanguage(page, language.label).catch(() => false);
            if (!changed) changed = await selectCustomLanguage(page, language.label).catch(() => false);
            if (!changed) throw new Error(`Language control not found for ${language.code} (${language.label})`);
            await page.waitForTimeout(650);
          }

          async function expandContent(page) {
            const expandable = page.locator('button[aria-expanded="false"]');
            const count = await expandable.count();
            for (let i = 0; i < count; i++) {
              const control = expandable.nth(i);
              const label = ((await control.innerText().catch(() => '')) || '').replace(/\s+/g, ' ').trim();
              if (ALL_LANGUAGE_LABELS.test(label) || /^(뒤로|Back|戻る)$/.test(label)) continue;
              await control.click({ timeout: 1500 }).catch(() => {});
            }
          }

          async function captureSnapshot(page) {
            await page.evaluate(async () => {
              const total = Math.max(document.body.scrollHeight, document.documentElement.scrollHeight);
              const step = Math.max(500, Math.floor(window.innerHeight * 0.8));
              for (let y = 0; y < total; y += step) {
                window.scrollTo(0, y);
                await new Promise((resolve) => setTimeout(resolve, 30));
              }
              window.scrollTo(0, 0);
            });
            await page.waitForTimeout(350);

            return page.evaluate(() => {
              const body = document.body;
              const normalize = (value) => String(value || '').replace(/\s+/g, ' ').trim();
              const markerCandidates = [...body.querySelectorAll('h1,h2,h3,h4,h5,h6,[role="heading"],p,span,strong')];
              const marker = markerCandidates.find((el) => {
                const text = normalize(el.textContent);
                return /^(일러스트|Illustration|イラスト)$/.test(text)
                  || /^(아크\s*포인트|Arc\s*Point|アーク\s*ポイント)(?:\s|$|\()/.test(text);
              });
              const range = document.createRange();
              range.setStart(body, 0);
              if (marker) range.setEndBefore(marker); else range.setEnd(body, body.childNodes.length);
              const wrapper = document.createElement('div');
              wrapper.className = 'captured-savior-detail';
              wrapper.appendChild(range.cloneContents());

              wrapper.querySelectorAll('script,noscript,style,link,nav,footer,form,dialog,header').forEach((el) => el.remove());
              wrapper.querySelectorAll('details').forEach((el) => el.setAttribute('open', ''));
              wrapper.querySelectorAll('[hidden]').forEach((el) => el.removeAttribute('hidden'));
              wrapper.querySelectorAll('[aria-hidden="true"]').forEach((el) => el.removeAttribute('aria-hidden'));
              wrapper.querySelectorAll('[inert]').forEach((el) => el.removeAttribute('inert'));
              wrapper.querySelectorAll('button,select,input,textarea').forEach((el) => {
                const text = normalize(el.textContent || el.getAttribute('aria-label') || el.getAttribute('title'));
                if (!text || /^(뒤로|Back|戻る|한국어|English|日本語|터치하여 확인)$/.test(text)) el.remove();
              });

              const assetUrls = new Set();
              wrapper.querySelectorAll('img').forEach((img) => {
                const raw = img.getAttribute('src') || img.src || '';
                if (!raw) return;
                const abs = new URL(raw, document.baseURI).href;
                img.setAttribute('src', abs); img.removeAttribute('srcset'); assetUrls.add(abs);
              });
              wrapper.querySelectorAll('source').forEach((sourceEl) => {
                const raw = sourceEl.getAttribute('src') || '';
                if (raw) { const abs = new URL(raw, document.baseURI).href; sourceEl.setAttribute('src', abs); assetUrls.add(abs); }
                sourceEl.removeAttribute('srcset');
              });
              wrapper.querySelectorAll('a[href]').forEach((a) => a.removeAttribute('href'));

              return {
                title: document.title,
                html: wrapper.innerHTML,
                assets: [...assetUrls],
                text: normalize(wrapper.innerText || wrapper.textContent),
                markerFound: Boolean(marker)
              };
            });
          }

          const browser = await chromium.launch({ headless: true });
          const context = await browser.newContext({ locale: 'ko-KR', viewport: { width: 1280, height: 1600 } });
          const page = await context.newPage();
          page.setDefaultTimeout(60000);
          const failures = [];

          for (const [position, savior] of saviors.entries()) {
            const sourceUrl = `${SOURCE_ROOT}/${savior.id}`;
            const files = {};
            const capturedAt = {};
            for (const language of LANGUAGES) {
              const outputPath = outputPathFor(savior.id, language.code);
              files[language.code] = indexFileFor(savior.id, language.code);
              if (!refreshAll && fs.existsSync(outputPath) && fs.statSync(outputPath).size > 500) {
                console.log(`[${position + 1}/${saviors.length}] keep ${language.code} ${savior.key} (${savior.id})`);
                continue;
              }

              console.log(`[${position + 1}/${saviors.length}] capture ${language.code} ${savior.key} (${savior.id})`);
              let success = false;
              let lastError;
              for (let attempt = 1; attempt <= 3 && !success; attempt++) {
                try {
                  await page.goto(sourceUrl, { waitUntil: 'domcontentloaded', timeout: 60000 });
                  try { await page.waitForLoadState('networkidle', { timeout: 20000 }); } catch (_) {}
                  await page.waitForFunction(() => (document.body?.innerText || '').trim().length > 300, null, { timeout: 30000 });
                  await page.waitForTimeout(500);
                  await setSourceLanguage(page, language);
                  await expandContent(page);
                  await page.waitForTimeout(350);

                  const snapshot = await captureSnapshot(page);
                  if (!snapshot.html || snapshot.text.length < 300) throw new Error(`Snapshot too small (${snapshot.text.length})`);
                  let html = snapshot.html;
                  for (const assetUrl of snapshot.assets) {
                    const localUrl = await downloadAsset(context.request, assetUrl, language.code);
                    if (localUrl && localUrl !== assetUrl) html = html.split(assetUrl).join(localUrl);
                  }
                  const at = new Date().toISOString();
                  fs.mkdirSync(path.dirname(outputPath), { recursive: true });
                  fs.writeFileSync(outputPath, snapshotShell(snapshot.title, html, at, language), 'utf8');
                  capturedAt[language.code] = at;
                  success = true;
                } catch (error) {
                  lastError = error;
                  console.warn(`attempt ${attempt} failed (${language.code}/${savior.id}): ${error.message}`);
                  if (attempt < 3) await page.waitForTimeout(attempt * 1800);
                }
              }
              if (!success) failures.push(`${language.code} ${savior.key} (${savior.id}): ${lastError?.message || 'unknown error'}`);
            }

            newIndex[String(savior.id)] = {
              key: savior.key,
              id: savior.id,
              file: files.ko,
              files,
              source: sourceUrl,
              capturedAt: { ...((newIndex[String(savior.id)]?.capturedAt && typeof newIndex[String(savior.id)].capturedAt === 'object') ? newIndex[String(savior.id)].capturedAt : {}), ...capturedAt }
            };
          }

          await browser.close();

          // Fail loudly if a language switch silently captured Korean again.
          for (const savior of saviors) {
            const koPath = outputPathFor(savior.id, 'ko');
            const enPath = outputPathFor(savior.id, 'en');
            const jaPath = outputPathFor(savior.id, 'ja');
            if (![koPath, enPath, jaPath].every(fs.existsSync)) {
              failures.push(`missing localized backup files for ${savior.key} (${savior.id})`);
              continue;
            }
            const strip = (file) => fs.readFileSync(file, 'utf8').replace(/<[^>]*>/g, ' ').replace(/\s+/g, ' ').trim();
            const ko = strip(koPath), en = strip(enPath), ja = strip(jaPath);
            if (en === ko || !/[A-Za-z]{4,}/.test(en)) failures.push(`English backup did not localize: ${savior.key} (${savior.id})`);
            if (ja === ko || !/[\u3040-\u30ff]/.test(ja)) failures.push(`Japanese backup did not localize: ${savior.key} (${savior.id})`);
          }

          newIndex._meta = {
            sourceRoot: SOURCE_ROOT,
            generatedAt: new Date().toISOString(),
            count: saviors.length,
            languages: LANGUAGES.map((item) => item.code),
            excludedSections: ['Illustration', 'Arc Point']
          };
          fs.writeFileSync(INDEX_PATH, JSON.stringify(newIndex, null, 2) + '\n', 'utf8');

          if (failures.length) {
            console.error('\nFailed Savior backups:');
            failures.forEach((failure) => console.error(`- ${failure}`));
            process.exit(2);
          }
          console.log(`Backed up ${saviors.length} Savior detail entries in ko/en/ja.`);
          NODE

      - name: Commit Savior backups
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/saviors data/savior-detail-assets
          if git diff --cached --quiet; then
            echo "No Savior backup changes to commit."
          else
            git commit -m "Backup Savior details in ko en ja"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
          fi
