name: Export current Arcana event data for audit

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/audit-espr-arcana-events.yml'

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Export compact Arcana events
        shell: bash
        run: |
          mkdir -p audit
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const archive = JSON.parse(fs.readFileSync('data/arcanas/arcanas.json', 'utf8'));
          const potentials = new Map((archive.potentials || []).map(x => [Number(x.id), x]));
          const buffs = new Map((archive.journeyBuffs || []).map(x => [Number(x.id), x]));
          const signed = n => Number(n) > 0 ? `+${Number(n)}` : String(Number(n));
          const loc = (v, lang) => typeof v === 'string' ? v : String(v?.[lang] || v?.ko || '');
          let eventCount = 0;
          let choiceCount = 0;
          function reward(r) {
            let ko = '', en = '';
            if (r.type === 'RT_STAT') { ko = loc(r.statName,'ko') || r.rewardStat || ''; en = loc(r.statName,'en') || ko; }
            else if (r.type === 'RT_SE_POTEN') { const p = potentials.get(Number(r.rewardId)); ko = loc(p?.name,'ko'); en = loc(p?.name,'en') || ko; }
            else if (r.type === 'RT_JOURNEY_BUFF') { const b = buffs.get(Number(r.rewardId)); ko = loc(b?.name,'ko'); en = loc(b?.name,'en') || ko; }
            else if (r.type === 'RT_STAMINA') { ko='스태미나'; en='Stamina'; }
            else if (r.type === 'RT_CONDITION') { ko='컨디션'; en='Condition'; }
            else if (r.type === 'RT_POTEN_POINT') { ko='잠재력 포인트'; en='Potential Points'; }
            else { ko=r.type || ''; en=ko; }
            return { type:r.type, sourceId:r.rewardId ?? null, ko, en, value:r.min == null ? '' : signed(r.min) };
          }
          const arcanas = (archive.arcanas || []).map(a => {
            const events = (a.events || []).map(e => {
              eventCount++;
              const choices = (e.choices || []).map(c => {
                choiceCount++;
                const success = (c.successRewards || []).flatMap(g => (g || []).map(reward));
                const failure = (c.failureRewards || []).flatMap(g => (g || []).map(reward));
                return { name:{ko:loc(c.name,'ko'),en:loc(c.name,'en')}, success, failure };
              });
              return { name:{ko:loc(e.name,'ko'),en:loc(e.name,'en')}, choices };
            });
            return { id:a.id, name:{ko:loc(a.name,'ko'),en:loc(a.name,'en')}, events };
          });
          const out = { generatedAt:new Date().toISOString(), arcanaCount:arcanas.length, eventCount, choiceCount, arcanas };
          fs.writeFileSync('audit/current-arcana-events.json', JSON.stringify(out, null, 2) + '\n');
          console.log(JSON.stringify({arcanaCount:out.arcanaCount,eventCount:out.eventCount,choiceCount:out.choiceCount}, null, 2));
          NODE

      - name: Upload compact audit source
        uses: actions/upload-artifact@v4
        with:
          name: current-arcana-events
          path: audit/current-arcana-events.json
          if-no-files-found: error
