name: Diagnose ESPR sync DOM

on:
  push:
    paths:
      - '.tmp/espr-diagnose-trigger.txt'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Inspect ESPR fallback access
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const checks = [
            ['DIRECT_LIST', 'https://ss.espr.gg/ko/database/characters'],
            ['JINA_LIST', 'https://r.jina.ai/https://ss.espr.gg/ko/database/characters'],
            ['JINA_CHARACTER', 'https://r.jina.ai/https://ss.espr.gg/en/database/characters/annah'],
            ['JINA_ARCANA', 'https://r.jina.ai/https://ss.espr.gg/ko/database/arcanas/experienced-mercenary'],
            ['JINA_POTENTIAL', 'https://r.jina.ai/https://ss.espr.gg/ko/database/potentials/catalyst'],
            ['CDN_CARD', 'https://ss.esprcdn.dev/images/arcanas/illustration/7104901.webp'],
          ];
          for (const [name, url] of checks) {
            try {
              const response = await fetch(url, { headers: { 'user-agent': 'starsavior-guide-sync-diagnostic/1.0' } });
              const type = response.headers.get('content-type') || '';
              const body = type.startsWith('image/') ? new Uint8Array(await response.arrayBuffer()) : await response.text();
              console.log(`=== ${name} ===`);
              console.log('status', response.status, 'type', type, 'length', typeof body === 'string' ? body.length : body.byteLength);
              if (typeof body === 'string') console.log(body.slice(0, 12000));
            } catch (error) {
              console.log(`=== ${name} ERROR ===`, error?.stack || error);
            }
          }
          NODE
