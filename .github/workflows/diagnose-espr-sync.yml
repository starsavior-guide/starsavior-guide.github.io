name: Diagnose ESPR sync DOM

on:
  push:
    paths:
      - '.tmp/espr-diagnose-trigger.txt'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Test ESPR direct structured endpoints
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const names = ['saviors.json','arcanas.json','potentials.json','buffs.json','journey_buffs.json','stat_potentials.json','journeys.json'];
          for (const name of names) {
            for (const root of ['https://ss.espr.gg/data','https://ss.esprcdn.dev/data']) {
              const url = `${root}/${name}`;
              try {
                const r = await fetch(url, { headers: { 'user-agent':'starsavior-guide-sync-diagnostic/1.0', accept:'application/json' }, redirect:'follow' });
                const text = await r.text();
                console.log(JSON.stringify({url,status:r.status,type:r.headers.get('content-type')||'',length:text.length,head:text.slice(0,180)}));
              } catch (e) { console.log(JSON.stringify({url,error:e?.message||String(e)})); }
            }
          }
          NODE
