name: Diagnose ESPR sync DOM

on:
  push:
    paths:
      - '.tmp/espr-diagnose-trigger.txt'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Inspect structured fallback source
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const origin = 'https://star-savior-arcana-db.pages.dev';
          const urls = [
            '/', '/arcana', '/data', '/data/arcanas.json', '/data/arcana.json',
            '/data/saviors.json', '/data/savior.json', '/data/journey.json',
            '/data/arcana-data.json', '/data/savior-data.json'
          ];
          for (const path of urls) {
            try {
              const r = await fetch(origin + path, { headers: { 'user-agent': 'starsavior-guide-sync-diagnostic/1.0' }, redirect: 'follow' });
              const t = await r.text();
              console.log(`=== ${path} === status=${r.status} type=${r.headers.get('content-type') || ''} len=${t.length}`);
              console.log(t.slice(0, 1500));
              if (path === '/arcana' && r.ok) {
                const scripts = [...t.matchAll(/<script[^>]+src=["']([^"']+)["']/gi)].map(m => m[1]);
                console.log('SCRIPTS', JSON.stringify(scripts, null, 2));
                for (const src of scripts.slice(-10)) {
                  const u = new URL(src, origin).href;
                  const sr = await fetch(u);
                  const js = await sr.text();
                  console.log('SCRIPT', u, sr.status, js.length);
                  const hits = [...js.matchAll(/(?:fetch\(|axios|\/data\/|\.json)/g)].slice(0, 30).map(m => ({ at: m.index, text: js.slice(Math.max(0,m.index-180), m.index+450) }));
                  if (hits.length) console.log(JSON.stringify(hits, null, 2));
                }
              }
            } catch (e) { console.log('ERROR', path, e?.stack || e); }
          }
          NODE
