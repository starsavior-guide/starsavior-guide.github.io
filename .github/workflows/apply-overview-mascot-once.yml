name: Apply overview mascot once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-overview-mascot-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply mascot patch
        run: python3 scripts/apply-overview-mascot.py

      - name: Validate
        shell: bash
        run: |
          test -f images/guide-mascot.webp
          grep -q 'newbie-equipment-notice-mascot' index.html
          grep -q 'overview-mascot-layout' app.js
          grep -q 'overview mascot cards 2026-09-15' styles.css

      - name: Commit result
        shell: bash
        run: |
          rm -f scripts/apply-overview-mascot.py .github/workflows/apply-overview-mascot-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Add mascot art to guide overview cards'
          git push
