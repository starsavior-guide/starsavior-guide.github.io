name: Finalize Professor M integration
on:
  push:
    paths:
      - '.github/workflows/finalize-professor-m.yml'
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch app and Arcana dataset
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          p=Path('app.js')
          s=p.read_text(encoding='utf-8')

          # Localization maps
          s=s.replace('"로자리아":"Rosaria"}', '"로자리아":"Rosaria","프로페서M":"Professor M"}')
          s=s.replace('"로자리아":"ロザリア"}', '"로자리아":"ロザリア","프로페서M":"プロフェッサーM"}')

          # Detail ID
          anchor='  "rosaria": 3003\n};'
          if '"professor-m": 1039' not in s:
              s=s.replace(anchor, '  "rosaria": 3003,\n  "professor-m": 1039\n};')

          # Arcana detail ID
          if '"탐닉자의 유흥거리": 7103901' not in s:
              s=s.replace('  "영원 속박의 굴레": 7101701\n};', '  "영원 속박의 굴레": 7101701,\n  "탐닉자의 유흥거리": 7103901\n};')

          # Arcana English name only; Japanese remains source-unverified.
          s=s.replace('"휴가 준비는 쇼핑에서부터!":"Vacation Prep Starts with Shopping!"}', '"휴가 준비는 쇼핑에서부터!":"Vacation Prep Starts with Shopping!","탐닉자의 유흥거리":"A Hedonist\\\'s Diversion"}')

          # Main-content placeholder
          if '"professor-m": ["미정"]' not in s:
              s=s.replace('  "amora": ["작전", "회랑", "코스모 게이트", "인자작"]\n};', '  "amora": ["작전", "회랑", "코스모 게이트", "인자작"],\n  "professor-m": ["미정"]\n};')

          # Savior list entry: recommendations intentionally TBD.
          if '"id": "professor-m"' not in s:
              marker='  {\n    "id": "amora",'
              obj='''  {\n    "id": "professor-m",\n    "name": "프로페서M",\n    "subtitle": "람파디스",\n    "affiliation": "람파디스",\n    "grade": "SSR",\n    "element": "moon",\n    "className": "레인저",\n    "role": "레인저",\n    "attackType": "정신",\n    "image": "./data/savior-detail-assets/프로페서M.webp",\n    "summary": "신규 구원자 데이터 반영.",\n    "guideUrl": "https://ss.espr.gg/ko/database/characters/professor-m",\n    "detail": {\n      "equipment": {\n        "pve": {"necklace":"미정","ring":"미정","sets":["미정"],"potential":"미정","note":"미정"},\n        "pvp": {"necklace":"미정","ring":"미정","sets":["미정"],"potential":"미정","note":"미정"}\n      },\n      "arcana": {"pve": PENDING_ARCANA(), "pvp": PENDING_ARCANA(), "alternatives": PENDING_ARCANA()}\n    }\n  },\n'''
              s=s.replace(marker,obj+marker)

          # Newest release sorting
          if '"professor-m": 20260917' not in s:
              s=s.replace('const SAVIOR_RELEASE_DATE = Object.freeze({\n  "amora": 20260903,', 'const SAVIOR_RELEASE_DATE = Object.freeze({\n  "professor-m": 20260917,\n  "amora": 20260903,')

          p.write_text(s,encoding='utf-8')

          # Merge standalone Arcana into the canonical Arcana dataset.
          ap=Path('data/arcanas/arcanas.json')
          data=json.loads(ap.read_text(encoding='utf-8'))
          extra=json.loads(Path('data/arcanas/7103901.json').read_text(encoding='utf-8'))
          if not any(int(a.get('id',0))==7103901 for a in data.get('arcanas',[])):
              data['arcanas'].append(extra)
          ap.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          # Manifest counts for one Arcana / three events / six choices / one card asset.
          mp=Path('data/arcanas/manifest.json')
          m=json.loads(mp.read_text(encoding='utf-8'))
          m['arcanaCount']=81
          m['eventCount']=197
          m['choiceCount']=246
          m['assetCount']=max(int(m.get('assetCount',157)),158)
          mp.write_text(json.dumps(m,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          # Basic assertions
          assert '"id": "professor-m"' in s
          assert '"professor-m": 1039' in s
          assert '"professor-m": 20260917' in s
          assert '"탐닉자의 유흥거리": 7103901' in s
          assert any(int(a.get('id',0))==7103901 for a in data['arcanas'])
          PY
      - name: Remove one-time workflow
        run: rm -f .github/workflows/finalize-professor-m.yml
      - name: Validate JSON and local paths
        run: |
          python -m json.tool data/saviors/index.json >/dev/null
          python -m json.tool data/arcanas/arcanas.json >/dev/null
          python -m json.tool data/arcanas/manifest.json >/dev/null
          test -f 'data/saviors/1039.html'
          test -f 'data/savior-detail-assets/프로페서M.webp'
          test -f 'data/savior-detail-assets/프로페서M 일러스트.webp'
          test -f 'data/arcana-assets/cards/7103901.webp'
          grep -q '프로페서M' app.js
          grep -q '7103901' app.js
      - name: Commit final integration
        run: |
          git config user.name 'starsavior-guide'
          git config user.email 'actions@users.noreply.github.com'
          git add app.js data/arcanas/arcanas.json data/arcanas/manifest.json .github/workflows/finalize-professor-m.yml
          git commit -m 'Integrate Professor M and Hedonist Diversion into site' || exit 0
          git push
