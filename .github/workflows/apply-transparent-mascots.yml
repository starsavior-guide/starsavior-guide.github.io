name: Apply transparent mascot assets

on:
  push:
    paths:
      - '.tmp/transparent-mascot-trigger.txt'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Apply transparent image assets
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin asset-replace-temp
          git cherry-pick --no-commit FETCH_HEAD
      - name: Patch image references and transparent styling
        run: python .tmp/transparent-mascot-patch.py
      - name: Validate
        shell: bash
        run: |
          set -euo pipefail
          node --check app.js
          git diff --check
          python - <<'PY'
          from pathlib import Path
          import struct

          png = Path('images/home-button.png').read_bytes()
          assert png[:8] == b'\x89PNG\r\n\x1a\n', 'home-button is not PNG'
          color_type = png[25]
          assert color_type in (4, 6, 3), f'home-button PNG does not support alpha: color_type={color_type}'

          webp = Path('images/guide-mascot.webp').read_bytes()
          assert webp[:4] == b'RIFF' and webp[8:12] == b'WEBP', 'guide mascot is not WebP'
          assert b'ALPH' in webp or b'VP8X' in webp, 'guide mascot has no alpha chunk'
          print('transparent image validation passed')
          PY
      - name: Remove temporary files and commit
        shell: bash
        run: |
          set -euo pipefail
          git rm -f .github/workflows/apply-transparent-mascots.yml .tmp/transparent-mascot-patch.py .tmp/transparent-mascot-trigger.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html app.js images/home-button.png images/guide-mascot.webp
          git commit -m 'Use transparent mascot assets across site'
          git pull --rebase origin main
          git push origin HEAD:main
          git push origin --delete asset-replace-temp || true
