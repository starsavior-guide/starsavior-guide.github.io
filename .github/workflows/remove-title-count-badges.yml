name: Remove title count badges

on:
  push:
    paths:
      - '.tmp/remove-title-count-badges-trigger.txt'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Apply count badge cleanup
        run: python .tmp/remove-title-count-badges.py
      - name: Validate
        run: |
          node --check app.js
          git diff --check
      - name: Commit
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- index.html app.js styles.css; then
            echo 'No changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html app.js styles.css
          git commit -m 'Remove database title count badges'
          git pull --rebase origin main
          git push origin HEAD:main
