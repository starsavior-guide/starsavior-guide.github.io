name: Fix Professor M Arcana event reward

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/fix-professor-m-arcana-event.yml'

permissions:
  contents: write

jobs:
  fix-event:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Fix Arcana event reward
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import crypto from 'node:crypto';

          const ARCANA_ID = 7103901;
          const EVENT_NAME = '인기 강좌의 비결';
          const CHOICE_NAME = '강의 방식의 문제가 아닐까?';
          const POTENTIAL_ID = 20007;

          const archivePath = 'data/arcanas/arcanas.json';
          const archive = JSON.parse(fs.readFileSync(archivePath, 'utf8'));
          const arcana = archive.arcanas.find((item) => Number(item.id) === ARCANA_ID);
          if (!arcana) throw new Error(`Arcana ${ARCANA_ID} not found`);
          const event = (arcana.events || []).find((item) => item?.name?.ko === EVENT_NAME) || arcana.events?.[0];
          if (!event) throw new Error('Target event not found');
          const choice = (event.choices || []).find((item) => item?.name?.ko === CHOICE_NAME) || event.choices?.[1];
          if (!choice) throw new Error('Target choice not found');

          const potential = (archive.potentials || []).find((item) => Number(item.id) === POTENTIAL_ID);
          if (!potential || potential?.name?.ko !== '집중의 감각') {
            throw new Error(`Potential ${POTENTIAL_ID} is not 집중의 감각`);
          }

          choice.successRewards = [[{
            type: 'RT_SE_POTEN',
            rewardId: POTENTIAL_ID,
            min: 1,
            max: 1
          }]];
          if (!Array.isArray(choice.failureRewards)) choice.failureRewards = [];
          fs.writeFileSync(archivePath, `${JSON.stringify(archive, null, 2)}\n`, 'utf8');

          const standalonePath = `data/arcanas/${ARCANA_ID}.json`;
          if (fs.existsSync(standalonePath)) {
            const standalone = JSON.parse(fs.readFileSync(standalonePath, 'utf8'));
            const standaloneEvent = (standalone.events || []).find((item) => item?.name?.ko === EVENT_NAME) || standalone.events?.[0];
            const standaloneChoice = (standaloneEvent?.choices || []).find((item) => item?.name?.ko === CHOICE_NAME) || standaloneEvent?.choices?.[1];
            if (!standaloneChoice) throw new Error('Standalone target choice not found');
            standaloneChoice.successRewards = [[{
              type: 'RT_SE_POTEN',
              rewardId: POTENTIAL_ID,
              min: 1,
              max: 1
            }]];
            if (!Array.isArray(standaloneChoice.failureRewards)) standaloneChoice.failureRewards = [];
            fs.writeFileSync(standalonePath, `${JSON.stringify(standalone, null, 2)}\n`, 'utf8');
          }

          const localized = (value, language) => {
            if (typeof value === 'string') return value;
            return String(value?.[language] || value?.ko || '');
          };

          const buildSearchText = (entry) => {
            const values = [entry.arcanaName, entry.savior];
            for (const group of entry.eventGroups || []) {
              values.push(group.title);
              for (const item of group.choices || []) {
                values.push(item.name);
                for (const rewards of [item.successRewards || [], item.failureRewards || []]) {
                  for (const rewardGroup of rewards) {
                    for (const reward of rewardGroup || []) values.push(reward.label, reward.value, reward.description);
                  }
                }
              }
            }
            return values.filter(Boolean).join(' ').replace(/\s+/g, ' ').trim();
          };

          const journeyHashes = {};
          for (const language of ['ko', 'en', 'ja']) {
            const journeyPath = `data/journey/${language}/journey.json`;
            const journey = JSON.parse(fs.readFileSync(journeyPath, 'utf8'));
            const entry = (journey.arcana || []).find((item) => Number(item.arcanaId) === ARCANA_ID);
            if (!entry) throw new Error(`${language}: Arcana journey entry not found`);
            const targetEvent = (entry.eventGroups || []).find((item) => item.title === EVENT_NAME) || entry.eventGroups?.[0];
            const targetChoice = (targetEvent?.choices || []).find((item) => item.name === CHOICE_NAME) || targetEvent?.choices?.[1];
            if (!targetChoice) throw new Error(`${language}: target journey choice not found`);

            targetChoice.successRewards = [[{
              sourceType: 'RT_SE_POTEN',
              sourceId: POTENTIAL_ID,
              sourceStat: null,
              sourceMin: 1,
              sourceMax: 1,
              label: localized(potential.name, language),
              value: '',
              description: localized(potential.description, language),
              polarity: 'neutral',
              effectTone: 'special',
              iconAssets: []
            }]];
            if (!Array.isArray(targetChoice.failureRewards)) targetChoice.failureRewards = [];
            entry.searchText = buildSearchText(entry);
            fs.writeFileSync(journeyPath, `${JSON.stringify(journey, null, 2)}\n`, 'utf8');
            journeyHashes[language] = crypto.createHash('sha256').update(JSON.stringify(journey.arcana)).digest('hex');
          }

          const auditPath = 'data/journey/arcana-source-audit.json';
          if (fs.existsSync(auditPath)) {
            const audit = JSON.parse(fs.readFileSync(auditPath, 'utf8'));
            audit.arcanaOutputHashes = { ...(audit.arcanaOutputHashes || {}), ...journeyHashes };
            audit.capturedAt = new Date().toISOString();
            fs.writeFileSync(auditPath, `${JSON.stringify(audit, null, 2)}\n`, 'utf8');
          }

          const verifyArchive = JSON.parse(fs.readFileSync(archivePath, 'utf8'));
          const verifyArcana = verifyArchive.arcanas.find((item) => Number(item.id) === ARCANA_ID);
          const verifyChoice = verifyArcana.events[0].choices[1];
          if (verifyChoice.successRewards.length !== 1 || verifyChoice.successRewards[0].length !== 1 || Number(verifyChoice.successRewards[0][0].rewardId) !== POTENTIAL_ID) {
            throw new Error('Arcana reward verification failed');
          }
          console.log('Verified: 인기 강좌의 비결 / 강의 방식의 문제가 아닐까? -> 집중의 감각 (20007)');
          NODE

      - name: Validate diff
        run: git diff --check

      - name: Commit correction and remove one-time workflow
        shell: bash
        run: |
          rm .github/workflows/fix-professor-m-arcana-event.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/arcanas/arcanas.json data/arcanas/7103901.json data/journey/ko/journey.json data/journey/en/journey.json data/journey/ja/journey.json data/journey/arcana-source-audit.json .github/workflows/fix-professor-m-arcana-event.yml
          git commit -m 'Fix Professor M Arcana event reward'
          git pull --rebase origin main
          git push origin HEAD:main
