name: Reorder main tabs once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/reorder-main-tabs-once.yml'

permissions:
  contents: write

jobs:
  reorder:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Reorder tabs
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '''      <nav class="main-nav" aria-label="주요 메뉴">
        <button class="nav-item is-active" type="button" data-section="savior">구원자</button>
        <button class="nav-item" type="button" data-section="arcana">아르카나</button>
        <button class="nav-item" type="button" data-section="journey">여정</button>
        <button class="nav-item" type="button" data-section="equipment">장비</button>
      </nav>'''
          new = '''      <nav class="main-nav" aria-label="주요 메뉴">
        <button class="nav-item is-active" type="button" data-section="savior">구원자</button>
        <button class="nav-item" type="button" data-section="arcana">아르카나</button>
        <button class="nav-item" type="button" data-section="equipment">장비</button>
        <button class="nav-item" type="button" data-section="journey">여정</button>
      </nav>'''
          if old not in s:
              if new in s:
                  print('Already reordered')
              else:
                  raise SystemExit('main nav block not found')
          else:
              p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Validate
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s = Path('index.html').read_text(encoding='utf-8')
          a = s.index('data-section="arcana"')
          e = s.index('data-section="equipment"')
          j = s.index('data-section="journey"')
          assert a < e < j
          PY

      - name: Commit and clean workflow
        shell: bash
        run: |
          rm -f .github/workflows/reorder-main-tabs-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/workflows/reorder-main-tabs-once.yml
          git commit -m 'Reorder main navigation tabs'
          git push
