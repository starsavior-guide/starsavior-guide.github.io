name: Apply final mobile UI patch

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/reorder-main-tabs-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Apply patch
        run: node scripts/patch-ui-20260915.js
      - name: Validate
        run: |
          node -e "const fs=require('fs');const h=fs.readFileSync('index.html','utf8');if(!(h.indexOf('data-section=\"arcana\"')<h.indexOf('data-section=\"equipment\"')&&h.indexOf('data-section=\"equipment\"')<h.indexOf('data-section=\"journey\"')))process.exit(1);"
          test -s images/home-button.png
          grep -q -- '--muted: #4f5d73;' styles.css
      - name: Commit result
        run: |
          rm -f scripts/patch-ui-20260915.js
          rm -f .github/workflows/reorder-main-tabs-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html styles.css images/home-button.png scripts/patch-ui-20260915.js .github/workflows/reorder-main-tabs-once.yml
          git commit -m 'Fix home icon, tab order, and light text contrast'
          git push
