name: One-time Defender Arcana patch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-defender-arcana.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Patch Defender attack-tank Arcana preset only
        shell: python
        run: |
          from pathlib import Path

          path = Path('app.js')
          text = path.read_text(encoding='utf-8')

          old = '''const DEFENDER_ATTACK_TANK_ARCANA = Object.freeze({
            recommended: [
              { name: "단점 보완 맞춤 훈련", note: "" },
              { name: "누각 위, 유리달 맞이", note: "" },
              { name: "조용한 휴식 시간", note: "" },
              { name: "하얀 달의 온기는 햇빛처럼", note: "" },
              { name: "꽃들에게 죽음을", note: "" }
            ],
            alternatives: [
              { name: "완벽한 바니걸", note: "하얀 달의 온기는 햇빛처럼 대체" },
              { name: "영원 속박의 굴레", note: "누각 위, 유리달 맞이 대체" },
              { name: "대단하고 엄청난 바니걸", note: "공격의 재능 용도로 사용하나 인자 만드는걸 추천" },
              { name: "", note: "단점 보완 맞춤 훈련은 절대 대체불가합니다" }
            ]
          });'''

          new = '''const DEFENDER_ATTACK_TANK_ARCANA = Object.freeze({
            recommended: [
              { name: "단점 보완 맞춤 훈련", note: "" },
              { name: "누각 위, 유리달 맞이 or 하얀 달의 온기는 햇빛처럼", note: "" },
              { name: "조용한 휴식 시간", note: "" },
              { name: "대단하고 엄청난 바니걸", note: "" },
              { name: "꽃들에게 죽음을", note: "" }
            ],
            alternatives: [
              { name: "영원 속박의 굴레", note: "누각 위, 유리달 맞이 대체" },
              { name: "", note: "단점 보완 맞춤 훈련은 절대 대체불가합니다" }
            ]
          });'''

          if text.count(old) != 1:
              raise SystemExit(f'Expected exactly one target block, found {text.count(old)}')

          path.write_text(text.replace(old, new, 1), encoding='utf-8')

      - name: Verify only requested preset changed
        shell: python
        run: |
          from pathlib import Path
          text = Path('app.js').read_text(encoding='utf-8')
          assert '{ name: "누각 위, 유리달 맞이 or 하얀 달의 온기는 햇빛처럼", note: "" }' in text
          assert '{ name: "대단하고 엄청난 바니걸", note: "" }' in text
          assert '{ name: "영원 속박의 굴레", note: "누각 위, 유리달 맞이 대체" }' in text

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js
          git diff --cached --quiet && exit 0
          git commit -m "Update Defender attack tank Arcana recommendations"
          git push
