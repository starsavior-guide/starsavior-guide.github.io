name: Compact Savior tier and main content

on:
  push:
    paths:
      - '.tmp/compact-tier-content-trigger.txt'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Apply compact tier/content patch
        run: node .tmp/compact-tier-content.mjs
      - name: Validate
        run: |
          node --check app.js
          git diff --check
      - name: Commit
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- app.js styles.css; then
            echo 'No changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.js styles.css
          git commit -m 'Compact Savior tier and main content summary'
          git pull --rebase origin main
          git push origin HEAD:main
