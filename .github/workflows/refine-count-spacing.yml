name: Refine database counts and Savior spacing

on:
  push:
    paths:
      - '.tmp/refine-count-spacing-trigger.txt'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Apply UI refinement patch
        run: python .tmp/refine-count-spacing.py
      - name: Validate
        run: |
          node --check app.js
          git diff --check
      - name: Commit
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- index.html app.js styles.css; then
            echo 'No changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html app.js styles.css
          git commit -m 'Refine database counts and Savior summary spacing'
          git pull --rebase origin main
          git push origin HEAD:main
