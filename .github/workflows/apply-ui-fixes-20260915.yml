name: Apply requested UI fixes

on:
  push:
    paths:
      - '.github/workflows/apply-ui-fixes-20260915.yml'
      - 'scripts/apply-ui-fixes-20260915.mjs'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: starsavior-ui-one-shot
  cancel-in-progress: false

jobs:
  apply-ui-fixes:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Apply requested UI fixes
        run: node scripts/apply-ui-fixes-20260915.mjs

      - name: Validate patch
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'images/home-button.png' index.html
          ! grep -q 'data-section="cosmo"' index.html
          grep -q 'id="ui-fixes-20260915"' index.html
          test -s images/home-button.png
          git diff --check

      - name: Commit UI changes and remove one-shot helpers
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm scripts/apply-ui-fixes-20260915.mjs .github/workflows/apply-ui-fixes-20260915.yml
          git add index.html images/home-button.png
          git commit -m 'Fix light mode UI and top navigation'
          git pull --rebase origin main
          git push origin HEAD:main
