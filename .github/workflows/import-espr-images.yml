name: Import ESPR images

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download Professor M and Arcana assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data/savior-detail-assets data/arcana-assets/cards

          fetch() {
            url="$1"
            out="$2"
            echo "Downloading $url -> $out"
            curl --fail --location --retry 5 --retry-delay 3 \
              --connect-timeout 20 --max-time 120 \
              -A 'Mozilla/5.0' \
              -e 'https://ss.espr.gg/' \
              "$url" -o "$out"
            test -s "$out"
          }

          fetch 'https://ss.esprcdn.dev/images/characters/portrait/1039.webp' 'data/savior-detail-assets/프로페서M.webp'
          fetch 'https://ss.esprcdn.dev/images/characters/illustration/1039.ui.webp' 'data/savior-detail-assets/프로페서M 일러스트.webp'
          fetch 'https://ss.esprcdn.dev/images/characters/skills/1039_0.webp' 'data/savior-detail-assets/프로페서M 패시브.webp'
          fetch 'https://ss.esprcdn.dev/images/characters/skills/1039_1.webp' 'data/savior-detail-assets/프로페서M 기본기.webp'
          fetch 'https://ss.esprcdn.dev/images/characters/skills/1039_2.webp' 'data/savior-detail-assets/프로페서M 특수기.webp'
          fetch 'https://ss.esprcdn.dev/images/characters/skills/1039_3.webp' 'data/savior-detail-assets/프로페서M 궁극기.webp'
          fetch 'https://ss.esprcdn.dev/images/general/status/buff_detective_professor_1.webp' 'data/savior-detail-assets/표본 행동 분석.webp'
          fetch 'https://ss.esprcdn.dev/images/general/status/buff_adjusttype_resource_moon.webp' 'data/savior-detail-assets/냉각.webp'
          fetch 'https://ss.esprcdn.dev/images/general/status/debuff_detective_professor_2.webp' 'data/savior-detail-assets/표적 각인.webp'
          fetch 'https://ss.esprcdn.dev/images/arcanas/illustration/7103901.webp' 'data/arcana-assets/cards/탐닉자의 유흥거리.webp'

          file data/savior-detail-assets/*.webp data/arcana-assets/cards/'탐닉자의 유흥거리.webp'

      - name: Commit imported assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/savior-detail-assets data/arcana-assets/cards
          if git diff --cached --quiet; then
            echo 'No asset changes.'
            exit 0
          fi
          git commit -m 'Import Professor M and Hedonist Diversion assets'
          git push
