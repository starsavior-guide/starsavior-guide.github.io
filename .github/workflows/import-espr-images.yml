name: Professor M hotfix

on:
  push:
    paths:
      - '.github/workflows/import-espr-images.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  hotfix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply data fixes
        run: |
          echo '' | base64 -d > /tmp/hotfix.py
          python3 /tmp/hotfix.py
          python3 -m json.tool data/arcanas/arcanas.json >/dev/null
          python3 -m json.tool data/arcanas/7103901.json >/dev/null
      - name: Commit fixes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.js data/arcanas/arcanas.json data/arcanas/7103901.json
          git commit -m 'Fix Professor M skills and Hedonist event choices'
          git push
