name: Sync new Savior and Arcana from ESPR

on:
  push:
    paths:
      - '.github/workflows/sync-new-espr.yml'
  schedule:
    - cron: '0 3 * * 4'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: starsavior-source-backup-write
  cancel-in-progress: false

jobs:
  sync-new-espr:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install ESPR browser collector
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Validate ESPR collectors
        run: |
          node --check scripts/espr-common.mjs
          node --check scripts/backup-espr-characters.mjs
          node --check scripts/backup-espr-arcanas.mjs

      - name: Collect Savior data directly from ESPR
        env:
          REFRESH_ALL: 'false'
          ESPR_NAV_MIN_INTERVAL_MS: '3500'
          ESPR_NAV_ATTEMPTS: '6'
        run: node scripts/backup-espr-characters.mjs

      - name: Collect Arcana data directly from ESPR
        env:
          REFRESH_ALL: 'false'
          ESPR_NAV_MIN_INTERVAL_MS: '3500'
          ESPR_NAV_ATTEMPTS: '6'
        run: node scripts/backup-espr-arcanas.mjs

      - name: Validate generated data
        shell: bash
        run: |
          set -euo pipefail
          node --check app.js
          git diff --check
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const saviorIndex = JSON.parse(fs.readFileSync('data/saviors/index.json','utf8'));
          const skills = JSON.parse(fs.readFileSync('data/savior-skills/saviors.json','utf8'));
          const arcana = JSON.parse(fs.readFileSync('data/arcanas/arcanas.json','utf8'));
          const skillIds = new Set((skills.saviors || []).map(x => Number(x.id)));
          for (const id of Object.keys(saviorIndex).filter(x => /^\d+$/.test(x)).map(Number)) {
            if (!skillIds.has(id)) throw new Error(`Missing skill archive for Savior ${id}`);
          }
          for (const s of skills.saviors || []) {
            if ((s.resonancePotentials || []).length !== 3) throw new Error(`Savior ${s.id} resonance potential count is not 3`);
          }
          for (const a of arcana.arcanas || []) {
            if (!a.image?.startsWith('./data/arcana-assets/cards/')) throw new Error(`Arcana ${a.id} is not local-only`);
            const p = a.image.replace(/^\.\//,'');
            if (!fs.existsSync(p) || fs.statSync(p).size < 20) throw new Error(`Missing Arcana image ${a.id}`);
          }
          NODE

      - name: Commit ESPR additions
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain -- app.js data/saviors data/savior-detail-assets data/savior-skills data/savior-skill-assets data/savior-bloom data/arcanas data/arcana-assets)" ]; then
            echo 'No ESPR data changes found.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.js data/saviors data/savior-detail-assets data/savior-skills data/savior-skill-assets data/savior-bloom data/arcanas data/arcana-assets
          git commit -m 'Auto-sync new Savior and Arcana directly from ESPR'
          git pull --rebase origin main
          git push origin HEAD:main
