name: Fix ESPR localized name

on:
  push:
    paths:
      - '.tmp/fix-espr-name.trigger'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Replace ESPR localized names
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              '에크하르트 초자연 연구회(ESPR)': '에크하르트 초월지식 학회(ESPR)',
              'Eckhart’s Society for Preternatural Research (ESPR)': "Eckhart's Society for Preternatural Research (ESPR)",
              'エッカート超常研究協会（ESPR）': 'エクハルト超越知識学会（ESPR）',
          }
          changed = []
          for path in [Path('index.html'), Path('app.js')]:
              text = path.read_text(encoding='utf-8')
              original = text
              for old, new in replacements.items():
                  text = text.replace(old, new)
              if text != original:
                  path.write_text(text, encoding='utf-8')
                  changed.append(str(path))
          print('changed:', changed)
          if not changed:
              raise SystemExit('No target ESPR strings were changed')
          PY
      - name: Validate localized names
        run: |
          grep -Fq '에크하르트 초월지식 학회(ESPR)' index.html
          grep -Fq '에크하르트 초월지식 학회(ESPR)' app.js
          grep -Fq "Eckhart's Society for Preternatural Research (ESPR)" app.js
          grep -Fq 'エクハルト超越知識学会（ESPR）' app.js
          ! grep -Fq '에크하르트 초자연 연구회(ESPR)' index.html
          ! grep -Fq '에크하르트 초자연 연구회(ESPR)' app.js
          ! grep -Fq 'エッカート超常研究協会（ESPR）' app.js
      - name: Commit and clean temporary files
        run: |
          rm -f .tmp/fix-espr-name.trigger .github/workflows/fix-espr-name.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html app.js .tmp/fix-espr-name.trigger .github/workflows/fix-espr-name.yml
          git commit -m 'Correct ESPR localized organization name'
          git push
