name: Import Gwen 1040 validation

on:
  push:
    branches:
      - gwen-1040-espr-import
    paths:
      - '.github/workflows/import-gwen-1040.yml'

permissions:
  contents: write

concurrency:
  group: gwen-1040-espr-import
  cancel-in-progress: false

jobs:
  import-gwen:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out validation branch
        uses: actions/checkout@v5
        with:
          ref: gwen-1040-espr-import

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install ESPR browser collector
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Build Gwen-only ESPR scan
        id: scan
        shell: bash
        run: |
          set -euo pipefail
          SCAN_ROOT="$RUNNER_TEMP/gwen-scan"
          rm -rf "$SCAN_ROOT"
          mkdir -p "$SCAN_ROOT"
          cp -a "$GITHUB_WORKSPACE/scripts" "$GITHUB_WORKSPACE/data" "$SCAN_ROOT/"
          ln -s "$GITHUB_WORKSPACE/node_modules" "$SCAN_ROOT/node_modules"
          python3 - "$SCAN_ROOT/scripts/backup-espr-characters.mjs" <<'PY'
          from pathlib import Path
          import sys
          p = Path(sys.argv[1])
          s = p.read_text()
          old = 'const slugs = await discoverSlugs(discoveryPage, "characters");'
          if old not in s:
              raise SystemExit('Could not locate Savior discovery line')
          s = s.replace(old, 'const slugs = ["gwen"];', 1)
          old = 'const minimum = Math.max(50, Math.min(slugs.length, oldArchive?.saviors?.length || 0));'
          if old not in s:
              raise SystemExit('Could not locate completeness minimum line')
          s = s.replace(old, 'const minimum = 1;', 1)
          p.write_text(s)
          PY
          (cd "$SCAN_ROOT" && node scripts/backup-espr-characters.mjs)
          echo "root=$SCAN_ROOT" >> "$GITHUB_OUTPUT"

      - name: Validate scanned Gwen source data
        env:
          SCAN_ROOT: ${{ steps.scan.outputs.root }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          const root = process.env.SCAN_ROOT;
          const index = JSON.parse(fs.readFileSync(path.join(root, 'data/saviors/index.json'), 'utf8'));
          const archive = JSON.parse(fs.readFileSync(path.join(root, 'data/savior-skills/saviors.json'), 'utf8'));
          const entry = index['1040'];
          const gwen = archive.saviors.find((x) => Number(x.id) === 1040);
          if (!entry || entry.slug !== 'gwen') throw new Error('Gwen 1040 was not detected from ESPR.');
          if (!gwen) throw new Error('Gwen 1040 is missing from Savior archive.');
          if (archive.saviors.length !== 55) throw new Error(`Expected 55 Saviors in scan, got ${archive.saviors.length}.`);
          if ((gwen.resonancePotentials || []).length !== 3) throw new Error(`Expected 3 Gwen resonance potentials, got ${gwen.resonancePotentials?.length || 0}.`);
          if ((gwen.skills || []).length !== 4) throw new Error(`Expected 4 Gwen skills, got ${gwen.skills?.length || 0}.`);
          for (const field of ['name','title','description']) {
            for (const lang of ['ko','en','ja']) {
              if (!gwen[field]?.[lang]) throw new Error(`Gwen ${field}.${lang} is missing.`);
            }
          }
          for (const [i, skill] of gwen.skills.entries()) {
            for (const lang of ['ko','en','ja']) {
              if (!skill.name?.[lang]) throw new Error(`Gwen skill ${i} name.${lang} is missing.`);
            }
            if (!Array.isArray(skill.levels) || !skill.levels.length) throw new Error(`Gwen skill ${i} has no level data.`);
          }
          for (const asset of [entry.profile?.portrait, entry.profile?.illustration, ...gwen.skills.map((x) => x.icon)]) {
            if (!asset || /^https?:/i.test(asset)) throw new Error(`Non-local Gwen asset path: ${asset}`);
            const abs = path.join(root, asset.replace(/^\.\//, ''));
            if (!fs.existsSync(abs)) throw new Error(`Missing Gwen local asset: ${asset}`);
          }
          console.log('GWEN_SCAN_SUMMARY=' + JSON.stringify({
            id: 1040,
            slug: entry.slug,
            saviorCount: archive.saviors.length,
            name: gwen.name,
            title: gwen.title,
            profile: entry.profile,
            resonanceCount: gwen.resonancePotentials.length,
            skillCount: gwen.skills.length,
            skillLevels: gwen.skills.map((x) => x.levels?.length || 0),
            blossomSkillCount: gwen.blossomSkills?.length || 0,
            assets: [entry.profile?.portrait, entry.profile?.illustration, ...gwen.skills.map((x) => x.icon)]
          }, null, 2));
          NODE

      - name: Merge new ID only
        env:
          SCAN_ROOT: ${{ steps.scan.outputs.root }}
        run: node scripts/sync-new-espr.mjs "$SCAN_ROOT"

      - name: Validate merged guide
        run: |
          set -euo pipefail
          node --check app.js
          git diff --check
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const index = JSON.parse(fs.readFileSync('data/saviors/index.json', 'utf8'));
          const archive = JSON.parse(fs.readFileSync('data/savior-skills/saviors.json', 'utf8'));
          const gwen = archive.saviors.find((x) => Number(x.id) === 1040);
          const entry = index['1040'];
          const app = fs.readFileSync('app.js', 'utf8');
          const ids = Object.keys(index).filter((x) => /^\d+$/.test(x));
          if (ids.length !== 55) throw new Error(`Expected 55 guide Saviors, got ${ids.length}.`);
          if (!entry || !gwen) throw new Error('Merged Gwen data is missing.');
          if (!app.includes('"gwen": 1040')) throw new Error('SAVIOR_DETAIL_IDS has no Gwen 1040 mapping.');
          if (!app.includes('"id": "gwen"')) throw new Error('SAVIORS has no Gwen entry.');
          if (!app.includes('./data/savior-detail-assets/1040-illustration.webp')) throw new Error('Gwen app image is not local.');
          if (/https?:[^\n]*1040-(?:portrait|illustration)/i.test(app)) throw new Error('External Gwen app asset URL detected.');
          if ((gwen.resonancePotentials || []).length !== 3) throw new Error('Merged Gwen resonance data is incomplete.');
          if ((gwen.skills || []).length !== 4) throw new Error('Merged Gwen skill data is incomplete.');
          console.log(`GUIDE_SAVIOR_COUNT=${ids.length}`);
          console.log(`GWEN_SKILL_LEVEL_COUNTS=${gwen.skills.map((x) => x.levels?.length || 0).join(',')}`);
          console.log(`GWEN_BLOSSOM_SKILL_COUNT=${gwen.blossomSkills?.length || 0}`);
          NODE
          echo '--- CHANGED FILES ---'
          git status --short
          echo '--- DIFF STAT ---'
          git diff --stat

      - name: Commit Gwen to validation branch only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.js data/saviors data/savior-detail-assets data/savior-skills data/savior-skill-assets data/savior-bloom
          if git diff --cached --quiet; then
            echo 'No Gwen changes were generated.'
            exit 1
          fi
          git commit -m 'Add Gwen 1040 from ESPR'
          git push origin HEAD:gwen-1040-espr-import
